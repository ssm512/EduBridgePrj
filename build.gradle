plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.7'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.prj'
version = '0.0.1-SNAPSHOT'
description = 'EduBridgePrj'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

ext {
    set('springAiVersion', "2.0.0")
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'me.paulschwarz:springboot4-dotenv:5.0.1'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:4.0.1'
    implementation 'com.google.firebase:firebase-admin:9.4.1'
    implementation 'org.springframework.ai:spring-ai-starter-model-google-genai'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
    // RCT-02: 영수증 PDF 출력 - Thymeleaf로 렌더링한 HTML을 그대로 PDF로 변환 (별도 print-only 페이지를 새로 만들지 않기 위함)
    implementation 'com.openhtmltopdf:openhtmltopdf-pdfbox:1.0.10'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    // spring-boot-starter-test 하나가 JUnit5 + Mockito + AssertJ + spring-test 를 모두 포함한다.
    // (기존 -flyway-test/-security-test/-thymeleaf-test/-validation-test/-webmvc-test 는 존재하지 않는
    //  아티팩트라 test 태스크가 의존성 resolve 단계에서 실패했음 → 실제 스타터로 교체. 팀 공유 필요)
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:4.0.1'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}


dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}
