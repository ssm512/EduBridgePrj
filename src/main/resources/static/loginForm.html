<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>EduBridge 로그인</title>
<style>
  body { font-family: sans-serif; max-width: 420px; margin: 40px auto; }
  h2 { text-align: center; }
  .field { margin-bottom: 12px; }
  label { display: block; margin-bottom: 4px; font-size: 14px; }
  input { width: 100%; padding: 8px; box-sizing: border-box; }
  button { width: 100%; padding: 10px; margin-top: 8px; cursor: pointer; }
  .link { text-align: center; margin-top: 12px; font-size: 14px; }
  #afterLogin { display: none; }
  #afterLogin button { width: auto; padding: 6px 12px; margin-right: 4px; }
  pre { background: #f4f4f4; padding: 12px; white-space: pre-wrap; word-break: break-all; }
</style>
</head>
<body>
<h2>로그인</h2>

<div id="loginForm">
  <div class="field">
    <label for="loginId">아이디</label>
    <input id="loginId" placeholder="아이디">
  </div>
  <div class="field">
    <label for="password">비밀번호</label>
    <input id="password" type="password" placeholder="비밀번호">
  </div>
  <button onclick="login()">로그인</button>
  <div class="link"><a href="/signInForm.html">계정이 없으신가요? 회원가입</a></div>
</div>

<div id="afterLogin">
  <p id="welcome"></p>
  <button onclick="me()">내 정보</button>
  <button onclick="refresh()">토큰 재발급</button>
  <button onclick="logout()">로그아웃</button>
</div>

<pre id="out" hidden></pre>

<script>
// Access Token은 메모리에만 보관 (데모용)
let accessToken = null;
let refreshToken = null;

// 쿠키에서 XSRF-TOKEN 값 읽기
function getCsrfCookie() {
  const m = document.cookie.match(/(?:^|;\s*)XSRF-TOKEN=([^;]*)/);
  return m ? decodeURIComponent(m[1]) : null;
}

// CSRF 쿠키가 없으면 발급받기
async function ensureCsrf() {
  if (!getCsrfCookie()) {
    await fetch('/api/auth/csrf');
  }
  return getCsrfCookie();
}

// 공통 요청: POST면 X-XSRF-TOKEN, 토큰 있으면 Bearer 헤더 추가
async function api(url, method = 'GET', body = null) {
  const headers = { 'Content-Type': 'application/json' };
  if (method !== 'GET') {
    headers['X-XSRF-TOKEN'] = await ensureCsrf();
  }
  if (accessToken) {
    headers['Authorization'] = 'Bearer ' + accessToken;
  }
  const res = await fetch(url, {
    method, headers,
    body: body ? JSON.stringify(body) : null
  });
  const data = await res.json().catch(() => ({}));
  show(res.status + ' ' + res.statusText, data);
  return { res, data };
}

function show(title, data) {
  const out = document.getElementById('out');
  out.hidden = false;
  out.textContent = title + '\n' + JSON.stringify(data, null, 2);
}

async function login() {
  const { res, data } = await api('/api/auth/login', 'POST', {
    loginId: document.getElementById('loginId').value,
    password: document.getElementById('password').value
  });
  if (res.ok) {
    accessToken = data.accessToken;
    refreshToken = data.refreshToken;
    document.getElementById('loginForm').style.display = 'none';
    document.getElementById('afterLogin').style.display = 'block';
    document.getElementById('welcome').textContent =
        data.user.name + '님 로그인되었습니다. (' + data.user.roleCode + ')';
  }
}

async function me() {
  await api('/api/auth/me');
}

async function refresh() {
  const { res, data } = await api('/api/auth/refresh', 'POST', { refreshToken });
  if (res.ok) {
    accessToken = data.accessToken;
    refreshToken = data.refreshToken;
  }
}

async function logout() {
  await api('/api/auth/logout', 'POST', { refreshToken });
  accessToken = null;
  refreshToken = null;
  document.getElementById('loginForm').style.display = 'block';
  document.getElementById('afterLogin').style.display = 'none';
}
</script>
</body>
</html>
