<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8">
  <title>EduBridge 학생</title>
  <link rel="stylesheet" href="/css/common.css">
</head>
<body>
<div th:replace="~{fragments/common :: topbar('학생')}"></div>
<div class="shell">
  <main class="content">
    <h1>학생 홈</h1>
    <p class="sub">내 출석·성적·회비·공지가 여기에 표시됩니다. (담당자 구현 예정)</p>
    <div class="cards">
      <div class="card"><div class="card-title">내 출석</div><div class="card-desc">출석 현황 조회</div></div>
      <div class="card"><div class="card-title">내 성적</div><div class="card-desc">시험 점수·추이</div></div>
      <div class="card"><div class="card-title">내 회비</div><div class="card-desc">청구·납부 내역</div></div>
      <!-- [추가] 공지 조회 화면 연결 (NOT-02~03, notice 도메인) -->
      <a class="card" href="/studentPage/notices" style="text-decoration:none;color:inherit">
        <div class="card-title">공지사항</div><div class="card-desc">받은 공지 확인</div>
      </a>
    </div>
  </main>
</div>
<script th:replace="~{fragments/common :: logoutScript}"></script>
</body>
</html>
