<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title th:text="${@branding.name} + ' 비밀번호 변경'">EduBridge 비밀번호 변경</title>
<style>
  body { font-family: sans-serif; max-width: 420px; margin: 40px auto; }
  h2 { text-align: center; }
  .field { margin-bottom: 12px; }
  label { display: block; margin-bottom: 4px; font-size: 14px; }
  input { width: 100%; padding: 8px; box-sizing: border-box; }
  button { width: 100%; padding: 10px; margin-top: 8px; cursor: pointer; }
  .link { text-align: center; margin-top: 12px; font-size: 14px; }
  .notice { background: #fff6e0; border: 1px solid #e0c060; padding: 10px; font-size: 13px; margin-bottom: 16px; border-radius: 4px; }
  .msg { color: #d33; margin-top: 8px; font-size: 14px; }
</style>
</head>
<body>
<h2>비밀번호 변경</h2>

<!-- 관리자 초기화(임시 비밀번호)로 진입한 경우 안내 -->
<div id="forcedNotice" class="notice" hidden>
  관리자가 비밀번호를 초기화했습니다. 계속하려면 새 비밀번호로 변경해 주세요.
</div>

<div class="field">
  <label for="currentPassword">현재 비밀번호</label>
  <input id="currentPassword" type="password" placeholder="현재(또는 임시) 비밀번호">
</div>
<div class="field">
  <label for="newPassword">새 비밀번호</label>
  <input id="newPassword" type="password" placeholder="새 비밀번호 (4자 이상)">
</div>
<div class="field">
  <label for="newPasswordConfirm">새 비밀번호 확인</label>
  <input id="newPasswordConfirm" type="password" placeholder="새 비밀번호 다시 입력">
</div>

<button onclick="changePassword()">비밀번호 변경</button>
<div class="link"><a href="/home">나중에 변경하기 (홈으로)</a></div>
<div class="msg" id="msg"></div>

<script>
// 강제 변경으로 진입했으면(?forced=1) 안내 표시 + "나중에" 링크 숨김
const forced = new URLSearchParams(location.search).get('forced') === '1';
if (forced) {
  document.getElementById('forcedNotice').hidden = false;
  document.querySelector('.link').hidden = true;
}

function getCsrfCookie() {
  const m = document.cookie.match(/(?:^|;\s*)XSRF-TOKEN=([^;]*)/);
  return m ? decodeURIComponent(m[1]) : null;
}

async function ensureCsrf() {
  if (!getCsrfCookie()) {
    await fetch('/api/auth/csrf');
  }
  return getCsrfCookie();
}

async function changePassword() {
  const currentPassword = document.getElementById('currentPassword').value;
  const newPassword = document.getElementById('newPassword').value;
  const confirm = document.getElementById('newPasswordConfirm').value;
  const msg = document.getElementById('msg');

  if (!currentPassword || !newPassword) {
    msg.textContent = '현재 비밀번호와 새 비밀번호를 입력해 주세요.';
    return;
  }
  if (newPassword !== confirm) {
    msg.textContent = '새 비밀번호가 서로 일치하지 않습니다.';
    return;
  }

  // 인증은 ACCESS_TOKEN 쿠키(httpOnly)로 처리된다.
  const res = await fetch('/api/auth/password', {
    method: 'PUT',
    headers: {
      'Content-Type': 'application/json',
      'X-XSRF-TOKEN': await ensureCsrf()
    },
    body: JSON.stringify({ currentPassword, newPassword })
  });
  const data = await res.json().catch(() => ({}));

  if (res.ok) {
    alert('비밀번호가 변경되었습니다.');
    location.href = '/home';
    return;
  }
  msg.textContent = typeof data.message === 'string'
      ? data.message : JSON.stringify(data.message);
}
</script>
</body>
</html>
