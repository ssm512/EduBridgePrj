<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>성적 관리</title>
    <link rel="stylesheet" href="/css/common.css">
    <style>
        .grade-layout {
            display: grid;
            grid-template-columns: 360px 1fr;
            gap: 16px;
            align-items: start;
        }

        .compact-filter-layout {
            grid-template-columns: minmax(220px, 360px) minmax(220px, 420px);
            justify-content: start;
        }

        .trend-filter-layout {
            grid-template-columns: minmax(220px, 360px) minmax(220px, 360px) minmax(220px, 420px);
            justify-content: start;
        }

        .exam-layout {
            align-items: stretch;
        }

        .exam-layout > .grade-panel {
            height: 100%;
        }

        .exam-form-panel {
            display: flex;
            flex-direction: column;
        }

        .exam-form-panel .form-row {
            margin-bottom: 32px;
        }

        .exam-form-panel .button-row {
            margin-top: 10px;
            padding-top: 0;
        }

        .exam-action-row {
            justify-content: space-between;
            align-items: center;
        }

        .exam-main-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .exam-list-panel {
            display: flex;
            flex-direction: column;
        }

        .exam-list-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 14px;
        }

        .exam-list-header h2 {
            margin-bottom: 0;
        }

        .exam-search {
            position: relative;
            display: flex;
            justify-content: flex-end;
            gap: 6px;
            max-width: 420px;
        }

        .exam-search-toggle {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .search-arrow {
            font-size: 11px;
            line-height: 1;
            color: #374151;
        }

        .exam-search input {
            width: 190px;
            padding: 7px 9px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
        }

        .exam-search-menu {
            display: none;
            position: absolute;
            top: 38px;
            left: 0;
            z-index: 10;
            min-width: 110px;
            padding: 6px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            background: #fff;
            box-shadow: 0 10px 22px rgba(15, 23, 42, .12);
        }

        .exam-search-menu.show {
            display: block;
        }

        .exam-search-menu button {
            display: block;
            width: 100%;
            border: 0;
            border-radius: 4px;
            padding: 7px 8px;
            background: #fff;
            color: #111827;
            text-align: left;
            cursor: pointer;
        }

        .exam-search-menu button:hover {
            background: #eff6ff;
        }

        .exam-table-wrap {
            min-height: 414px;
        }

        .exam-list-panel .pagination {
            margin-top: auto;
            padding-top: 12px;
        }

        .grade-panel {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 18px;
            margin-bottom: 16px;
        }

        .grade-panel h2 {
            margin: 0 0 14px;
            font-size: 17px;
        }

        .form-row {
            margin-bottom: 10px;
        }

        .form-row label {
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
            font-weight: 600;
            color: #374151;
        }

        .form-row input,
        .form-row select {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            background: #fff;
        }

        .datetime-row {
            display: flex;
            gap: 8px;
        }

        .datetime-row input {
            flex: 1;
        }

        .datetime-row .grade-btn {
            flex: 0 0 auto;
            padding: 8px 10px;
        }

        .date-picker-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 30;
            align-items: center;
            justify-content: center;
            background: rgba(15, 23, 42, .28);
        }

        .date-picker-overlay.show {
            display: flex;
        }

        .date-picker-modal {
            width: min(360px, calc(100vw - 32px));
            border-radius: 10px;
            background: #fff;
            box-shadow: 0 18px 40px rgba(15, 23, 42, .22);
            padding: 18px;
        }

        .date-picker-modal h3 {
            margin: 0 0 14px;
            font-size: 16px;
        }

        .date-picker-fields {
            display: grid;
            gap: 12px;
        }

        .date-picker-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 16px;
        }

        .class-picker {
            position: relative;
        }

        .class-picker input {
            padding-right: 38px;
        }

        .class-picker input[readonly] {
            cursor: pointer;
        }

        .class-picker-toggle {
            position: absolute;
            right: 1px;
            top: 1px;
            bottom: 1px;
            width: 34px;
            border: 0;
            border-left: 1px solid #cbd5e1;
            border-radius: 0 6px 6px 0;
            background: #f8fafc;
            color: #111827;
            cursor: pointer;
            font-size: 12px;
        }

        .class-picker-toggle:hover {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .class-picker-menu {
            display: none;
            position: absolute;
            top: 40px;
            left: 0;
            z-index: 12;
            min-width: 230px;
            max-height: 220px;
            overflow-y: auto;
            padding: 6px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            background: #fff;
            box-shadow: 0 10px 22px rgba(15, 23, 42, .12);
        }

        .class-picker-menu.show {
            display: block;
        }

        .class-picker-menu button {
            display: block;
            width: 100%;
            border: 0;
            border-radius: 5px;
            padding: 8px 9px;
            background: #fff;
            color: #111827;
            text-align: left;
            cursor: pointer;
        }

        .class-picker-menu button:hover,
        .class-picker-menu button.active {
            background: #2563eb;
            color: #fff;
        }

        .class-picker-menu .empty-row {
            padding: 12px 8px;
        }

        .button-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        .batch-save-row {
            justify-content: flex-end;
        }

        .grade-btn {
            border: 0;
            border-radius: 6px;
            padding: 8px 12px;
            background: #2563eb;
            color: #fff;
            cursor: pointer;
            font-weight: 600;
        }

        .grade-btn.secondary {
            background: #e5e7eb;
            color: #111827;
        }

        .grade-btn.danger {
            background: #dc2626;
        }

        .grade-btn:disabled {
            opacity: .45;
            cursor: not-allowed;
        }

        .table-wrap {
            overflow-x: auto;
        }

        .class-average-table-wrap {
            overflow: visible;
        }

        .grade-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        .grade-table th,
        .grade-table td {
            border-bottom: 1px solid #e5e7eb;
            padding: 9px 8px;
            text-align: left;
            vertical-align: middle;
        }

        .grade-table th {
            background: #f8fafc;
            color: #475569;
            font-size: 12px;
        }

        .sort-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            border: 0;
            border-radius: 4px;
            padding: 4px 6px;
            background: transparent;
            color: inherit;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        .sort-btn:hover {
            background: #dbeafe;
            color: #2563eb;
        }

        .sort-indicator {
            min-width: 10px;
            color: #94a3b8;
            font-size: 10px;
        }

        .sort-btn:hover .sort-indicator,
        .sort-indicator.active {
            color: #2563eb;
        }

        .help-tooltip {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 16px;
            height: 16px;
            margin-left: 4px;
            border: 1px solid #94a3b8;
            border-radius: 50%;
            background: #fff;
            color: #475569;
            font-size: 11px;
            font-weight: 700;
            line-height: 1;
            cursor: help;
        }

        .help-tooltip:hover {
            border-color: #2563eb;
            color: #2563eb;
        }

        .help-tooltip::after {
            content: attr(data-tooltip);
            display: none;
            position: absolute;
            left: 50%;
            top: calc(100% + 8px);
            z-index: 20;
            width: 250px;
            transform: translateX(-50%);
            padding: 9px 10px;
            border-radius: 6px;
            background: #111827;
            color: #fff;
            font-size: 12px;
            font-weight: 500;
            line-height: 1.45;
            white-space: normal;
            box-shadow: 0 10px 20px rgba(15, 23, 42, .18);
        }

        .help-tooltip:hover::after {
            display: block;
        }

        .grade-table tr.selected {
            background: #eff6ff;
        }

        .exam-table tbody tr {
            cursor: pointer;
        }

        .exam-table tbody tr:hover {
            background: #f1f5f9;
        }

        .exam-table tbody tr.selected:hover {
            background: #dbeafe;
        }

        .grade-table input {
            width: 100%;
            min-width: 70px;
            padding: 6px 8px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
        }

        .selected-info {
            margin: 0 0 12px;
            color: #1e3a8a;
            font-weight: 600;
        }

        .trend-info {
            margin: 12px 0 0;
            padding: 10px 12px;
            border: 1px solid #bfdbfe;
            border-radius: 8px;
            background: #eff6ff;
            color: #1e3a8a;
            font-size: 13px;
            font-weight: 600;
        }

        .trend-chart {
            min-height: 260px;
            margin: 14px 0 16px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            background: #fff;
        }

        .trend-chart canvas {
            display: block;
            width: 100%;
            height: 260px;
        }

        .trend-chart .empty-row {
            padding: 110px 8px;
        }

        .trend-mode-row {
            display: flex;
            gap: 14px;
            align-items: center;
            margin-bottom: 12px;
        }

        .trend-mode-row label {
            display: inline-flex;
            gap: 5px;
            align-items: center;
            font-size: 13px;
            font-weight: 600;
            color: #374151;
        }

        .status {
            display: none;
            position: fixed;
            right: 24px;
            bottom: 24px;
            z-index: 20;
            max-width: 420px;
            padding: 14px 16px;
            border: 1px solid #bfdbfe;
            border-left: 5px solid #2563eb;
            border-radius: 8px;
            background: #eff6ff;
            color: #1e3a8a;
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 10px 24px rgba(15, 23, 42, .18);
        }

        .status.error {
            border-color: #fecaca;
            border-left-color: #dc2626;
            background: #fef2f2;
            color: #b91c1c;
        }

        .status.show {
            display: block;
        }

        .empty-row {
            text-align: center;
            color: #6b7280;
            padding: 22px 8px;
        }

        .pagination {
            display: flex;
            gap: 6px;
            margin-top: 12px;
            justify-content: center;
        }

        .page-btn {
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            background: #fff;
            color: #374151;
            padding: 6px 10px;
            cursor: pointer;
        }

        .page-btn.active {
            background: #2563eb;
            color: #fff;
            border-color: #2563eb;
            font-weight: 700;
        }

        .page-btn:disabled {
            opacity: .4;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div th:replace="~{fragments/common :: topbar('강사')}"></div>

<div class="shell">
    <nav class="sidebar">
        <a href="/teacherPage">강사 홈</a>
        <a href="/teacherPage/grades">성적입력</a>
        <a href="/teacherPage/notices">공지사항</a>
    </nav>

    <main class="content">
        <h1>성적입력</h1>
        <p class="sub">시험을 등록하고, 시험을 선택한 뒤 수강 학생별 점수를 입력합니다.</p>

        <div id="status" class="status"></div>

        <div class="grade-layout exam-layout">
            <section class="grade-panel exam-form-panel">
                <h2>시험 등록 / 수정</h2>

                <div class="form-row">
                    <label for="classId">반</label>
                    <div class="class-picker">
                        <input id="classId" placeholder="반 이름 선택" autocomplete="off" readonly onclick="toggleClassMenu('classIdMenu')">
                        <input id="classIdValue" type="hidden">
                        <button type="button" class="class-picker-toggle" onclick="toggleClassMenu('classIdMenu')">▼</button>
                        <div id="classIdMenu" class="class-picker-menu"></div>
                    </div>
                </div>

                <div class="form-row">
                    <label for="examName">시험명</label>
                    <input id="examName" placeholder="7월 수학 단원평가">
                </div>

                <div class="form-row">
                    <label for="subject">과목</label>
                    <input id="subject" placeholder="수학">
                </div>

                <div class="form-row">
                    <label for="examDate">시험일시</label>
                    <div class="datetime-row">
                        <input id="examDateDisplay" placeholder="시험일시를 선택하세요" readonly>
                        <input id="examDate" type="hidden">
                        <button type="button" class="grade-btn secondary" onclick="openExamDatePicker()">선택</button>
                    </div>
                </div>

                <div class="form-row">
                    <label for="totalScore">만점</label>
                    <input id="totalScore" type="number" min="0" max="100" value="100" oninput="clampScoreInput(this)">
                </div>

                <div class="button-row exam-action-row">
                    <div class="exam-main-actions">
                        <button id="saveExamButton" class="grade-btn" onclick="saveExam()">시험 등록</button>
                        <button id="deleteExamButton" class="grade-btn danger" onclick="deleteExam()" disabled>시험 삭제</button>
                    </div>
                    <button class="grade-btn secondary" onclick="createExamFromForm()">새 시험 등록</button>
                </div>
            </section>

            <section class="grade-panel exam-list-panel">
                <div class="exam-list-header">
                    <h2>시험 목록</h2>
                    <div class="exam-search">
                        <button id="examSearchTypeButton" type="button" class="grade-btn secondary exam-search-toggle"
                                onclick="toggleExamSearchMenu()">
                            <span id="examSearchTypeLabel">전체검색</span>
                            <span class="search-arrow">▼</span>
                        </button>
                        <div id="examSearchMenu" class="exam-search-menu">
                            <button type="button" onclick="setExamSearchType('all')">전체검색</button>
                            <button type="button" onclick="setExamSearchType('className')">반</button>
                            <button type="button" onclick="setExamSearchType('examName')">시험명</button>
                            <button type="button" onclick="setExamSearchType('subject')">과목</button>
                            <button type="button" onclick="setExamSearchType('examDate')">시험일시</button>
                        </div>
                        <input id="examSearchKeyword" placeholder="검색어 입력" oninput="applyExamListView()">
                    </div>
                </div>

                <div class="table-wrap exam-table-wrap">
                    <table class="grade-table exam-table">
                        <thead>
                        <tr>
                            <th><button type="button" class="sort-btn" title="반 정렬" onclick="setExamSort('class_name')">반 <span id="sort_class_name" class="sort-indicator">↕</span></button></th>
                            <th><button type="button" class="sort-btn" title="시험명 정렬" onclick="setExamSort('exam_name')">시험명 <span id="sort_exam_name" class="sort-indicator">↕</span></button></th>
                            <th><button type="button" class="sort-btn" title="과목 정렬" onclick="setExamSort('subject')">과목 <span id="sort_subject" class="sort-indicator">↕</span></button></th>
                            <th><button type="button" class="sort-btn" title="시험일시 정렬" onclick="setExamSort('exam_date')">시험일시 <span id="sort_exam_date" class="sort-indicator">↕</span></button></th>
                            <th>만점</th>
                        </tr>
                        </thead>
                        <tbody id="examList"></tbody>
                    </table>
                </div>
                <div id="examPagination" class="pagination"></div>
            </section>
        </div>

        <section class="grade-panel">
            <h2>학생별 성적 입력</h2>
            <p id="selectedExamInfo" class="selected-info">선택한 시험이 없습니다.</p>

            <div class="table-wrap">
                <table class="grade-table">
                    <thead>
                    <tr>
                        <th>학생명</th>
                        <th>학생번호</th>
                        <th>점수</th>
                        <th>비고</th>
                        <th>관리</th>
                    </tr>
                    </thead>
                    <tbody id="studentGradeList"></tbody>
                </table>
            </div>
            <div class="button-row batch-save-row">
                <button class="grade-btn" onclick="saveAllStudentGrades()">일괄 저장</button>
            </div>
        </section>

        <section class="grade-panel">
            <h2>성적 확인</h2>

            <div class="table-wrap">
                <table class="grade-table">
                    <thead>
                    <tr>
                        <th><button type="button" class="sort-btn" title="학생명 정렬" onclick="setGradeCheckSort('student_name')">학생명 <span id="gradeSort_student_name" class="sort-indicator">↕</span></button></th>
                        <th><button type="button" class="sort-btn" title="점수 정렬" onclick="setGradeCheckSort('score')">점수 <span id="gradeSort_score" class="sort-indicator">↕</span></button></th>
                        <th><button type="button" class="sort-btn" title="석차 정렬" onclick="setGradeCheckSort('rank_no')">석차 <span id="gradeSort_rank_no" class="sort-indicator">↕</span></button></th>
                        <th>비고</th>
                    </tr>
                    </thead>
                    <tbody id="gradeList"></tbody>
                </table>
            </div>
        </section>

        <section class="grade-panel">
            <h2>과목별 성적 조회</h2>

            <div class="grade-layout compact-filter-layout">
                <div>
                    <div class="form-row">
                        <label for="subjectGradeSubject">과목</label>
                        <input id="subjectGradeSubject" placeholder="예: 수학">
                    </div>
                </div>
                <div>
                    <div class="form-row">
                        <label for="subjectGradeClassId">반</label>
                        <div class="class-picker">
                            <input id="subjectGradeClassId" placeholder="비워두면 전체 반" autocomplete="off" readonly onclick="toggleClassMenu('subjectGradeClassIdMenu')">
                            <input id="subjectGradeClassIdValue" type="hidden">
                            <button type="button" class="class-picker-toggle" onclick="toggleClassMenu('subjectGradeClassIdMenu')">▼</button>
                            <div id="subjectGradeClassIdMenu" class="class-picker-menu"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="button-row">
                <button class="grade-btn" onclick="loadGradesBySubject()">과목별 조회</button>
            </div>

            <div class="table-wrap">
                <table class="grade-table">
                    <thead>
                    <tr>
                        <th>과목</th>
                        <th>시험명</th>
                        <th>반</th>
                        <th>학생명</th>
                        <th>점수</th>
                        <th>만점</th>
                        <th>석차</th>
                        <th>시험일시</th>
                    </tr>
                    </thead>
                    <tbody id="subjectGradeList"></tbody>
                </table>
            </div>
        </section>

        <section class="grade-panel">
            <h2>반 평균 조회</h2>

            <div class="grade-layout compact-filter-layout">
                <div>
                    <div class="form-row">
                        <label for="classAverageClassId">반</label>
                        <div class="class-picker">
                            <input id="classAverageClassId" placeholder="비워두면 전체 반" autocomplete="off" readonly onclick="toggleClassMenu('classAverageClassIdMenu')">
                            <input id="classAverageClassIdValue" type="hidden">
                            <button type="button" class="class-picker-toggle" onclick="toggleClassMenu('classAverageClassIdMenu')">▼</button>
                            <div id="classAverageClassIdMenu" class="class-picker-menu"></div>
                        </div>
                    </div>
                </div>
                <div>
                    <div class="form-row">
                        <label for="classAverageSubject">과목</label>
                        <input id="classAverageSubject" placeholder="비워두면 전체 과목">
                    </div>
                </div>
            </div>

            <div class="button-row">
                <button class="grade-btn" onclick="loadClassAverageStats()">평균 조회</button>
            </div>

            <div class="table-wrap class-average-table-wrap">
                <table class="grade-table">
                    <thead>
                    <tr>
                        <th>반</th>
                        <th>학생 수</th>
                        <th>성적 수</th>
                        <th>평균점수</th>
                        <th>최고점</th>
                        <th>최저점</th>
                        <th>
                            평균달성률
                            <span class="help-tooltip"
                                  data-tooltip="평균점수를 시험 만점으로 나눈 비율입니다. 예: 평균 80점 / 만점 100점이면 80%입니다.">?</span>
                        </th>
                    </tr>
                    </thead>
                    <tbody id="classAverageList"></tbody>
                </table>
            </div>
        </section>

        <section class="grade-panel">
            <h2>성적 추이 조회</h2>

            <div class="trend-mode-row">
                <label>
                    <input type="radio" name="trendMode" value="student" checked onchange="changeTrendMode()">
                    학생별
                </label>
                <label>
                    <input type="radio" name="trendMode" value="class" onchange="changeTrendMode()">
                    반별
                </label>
            </div>

            <div class="grade-layout trend-filter-layout">
                <div id="trendStudentField">
                    <div class="form-row">
                        <label for="trendStudentSearch">학생명</label>
                        <div class="class-picker">
                            <input id="trendStudentSearch" placeholder="수강중인 학생명 검색" autocomplete="off"
                                   oninput="handleTrendStudentSearchInput()"
                                   onkeydown="handleTrendStudentMenuKeydown(event)">
                            <input id="trendStudentId" type="hidden">
                            <button type="button" class="class-picker-toggle" onclick="toggleTrendStudentMenu()">▼</button>
                            <div id="trendStudentMenu" class="class-picker-menu"></div>
                        </div>
                    </div>
                </div>
                <div id="trendClassField" style="display:none;">
                    <div class="form-row">
                        <label for="trendClassId">반</label>
                        <div class="class-picker">
                            <input id="trendClassId" placeholder="반 이름 선택" autocomplete="off" readonly onclick="toggleClassMenu('trendClassIdMenu')">
                            <input id="trendClassIdValue" type="hidden">
                            <button type="button" class="class-picker-toggle" onclick="toggleClassMenu('trendClassIdMenu')">▼</button>
                            <div id="trendClassIdMenu" class="class-picker-menu"></div>
                        </div>
                    </div>
                </div>
                <div>
                    <div class="form-row">
                        <label for="trendSubject">과목</label>
                        <div class="class-picker">
                            <input id="trendSubject" value="전체 과목" autocomplete="off" readonly onclick="toggleTrendSubjectMenu()">
                            <input id="trendSubjectValue" type="hidden">
                            <button type="button" class="class-picker-toggle" onclick="toggleTrendSubjectMenu()">▼</button>
                            <div id="trendSubjectMenu" class="class-picker-menu"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="button-row">
                <button class="grade-btn" onclick="loadGradeTrend()">추이 조회</button>
            </div>

            <div id="trendInfo" class="trend-info" style="display:none;"></div>

            <div id="trendChart" class="trend-chart">
                <div class="empty-row">성적 추이를 조회하면 차트가 표시됩니다.</div>
            </div>

            <div class="table-wrap">
                <table class="grade-table">
                    <thead>
                    <tr>
                        <th>시험명</th>
                        <th>과목</th>
                        <th>시험일시</th>
                        <th>점수</th>
                        <th>만점</th>
                    </tr>
                    </thead>
                    <tbody id="trendList"></tbody>
                </table>
            </div>
        </section>
    </main>
</div>

<div id="examDatePickerOverlay" class="date-picker-overlay">
    <div class="date-picker-modal">
        <h3>시험일시 선택</h3>
        <div class="date-picker-fields">
            <div class="form-row">
                <label for="examDatePickerDate">시험일</label>
                <input id="examDatePickerDate" type="date">
            </div>
            <div class="form-row">
                <label for="examDatePickerTime">시험시간</label>
                <input id="examDatePickerTime" type="time">
            </div>
        </div>
        <div class="date-picker-actions">
            <button type="button" class="grade-btn secondary" onclick="closeExamDatePicker()">취소</button>
            <button type="button" class="grade-btn" onclick="applyExamDateSelection()">확인</button>
        </div>
    </div>
</div>

<script th:replace="~{fragments/common :: logoutScript}"></script>
<script src="/js/chart.umd.min.js"></script>
<script>
    // 현재 선택된 시험 ID
    // 시험 행을 클릭하면 이 값에 exam_id를 저장하고, 성적 입력/조회 시 내부적으로 사용한다.
    let selectedExamId = null;

    // 시험 수정 상태를 구분하기 위한 ID
    // null이면 신규 등록, 값이 있으면 해당 시험 수정으로 처리한다.
    let editingExamId = null;

    // 현재 화면에 조회된 시험 목록을 저장한다.
    // 시험 행 클릭 시 서버를 다시 조회하지 않고 이 목록에서 선택 시험을 찾는다.
    let examRows = [];
    let classOptionRows = [];
    let activeStudentOptions = [];
    let trendSubjectOptions = [];
    let trendStudentMenuIndex = -1;
    let gradeCheckRows = [];
    let gradeCheckSortKey = null;
    let gradeCheckSortDirection = 'asc';

    // 검색과 정렬이 적용된 시험 목록
    // 실제 테이블과 페이징은 이 배열을 기준으로 그린다.
    let filteredExamRows = [];

    // 시험 목록 페이징 상태
    // 한 페이지에 10개씩 보여주고, 페이지 번호는 최대 5개까지만 노출한다.
    let currentExamPage = 1;
    const examPageSize = 10;
    const maxVisiblePages = 5;

    // 시험 목록 검색/정렬 상태
    let examSearchType = 'all';
    let examSortKey = null;
    let examSortDirection = 'asc';
    let gradeTrendChart = null;
    const examSearchLabels = {
        all: '전체검색',
        className: '반',
        examName: '시험명',
        subject: '과목',
        examDate: '시험일시'
    };

    // XSRF-TOKEN 쿠키 값을 읽는다.
    // Spring Security CSRF 설정이 쿠키 방식이므로 POST/PUT/DELETE 요청에 이 값을 헤더로 보내야 한다.
    function getCsrfCookie() {
        const match = document.cookie.match(/(?:^|;\s*)XSRF-TOKEN=([^;]*)/);
        return match ? decodeURIComponent(match[1]) : null;
    }

    // CSRF 쿠키가 없으면 서버에서 먼저 발급받는다.
    // GET /api/auth/csrf 는 SecurityConfig에서 허용되어 있다.
    async function ensureCsrf() {
        if (!getCsrfCookie()) {
            await fetch('/api/auth/csrf');
        }
        return getCsrfCookie();
    }

    // JSON 요청 공통 함수
    // 성적관리의 등록/수정 요청에서 CSRF 헤더 누락을 방지하기 위해 사용한다.
    async function sendJson(url, method, body) {
        return fetch(url, {
            method: method,
            headers: {
                'Content-Type': 'application/json',
                'X-XSRF-TOKEN': await ensureCsrf()
            },
            body: JSON.stringify(body)
        });
    }

    // DELETE 요청 공통 함수
    // 삭제 요청도 CSRF 검증 대상이므로 X-XSRF-TOKEN 헤더가 필요하다.
    async function sendDelete(url) {
        return fetch(url, {
            method: 'DELETE',
            headers: {
                'X-XSRF-TOKEN': await ensureCsrf()
            }
        });
    }

    // 화면 상태 메시지를 출력한다.
    // alert 대신 페이지 안에서 결과를 보여줘서 반복 테스트가 덜 번거롭다.
    function setStatus(message, isError = false) {
        const status = document.getElementById('status');
        status.innerText = message;
        status.className = isError ? 'status error show' : 'status show';

        // 이전 알림이 남아 있더라도 새 알림 기준으로 다시 닫히게 한다.
        clearTimeout(status.dataset.timerId);
        status.dataset.timerId = setTimeout(() => {
            status.className = 'status';
            status.innerText = '';
        }, 4500);
    }

    // HTML 문자열 출력 시 특수문자로 인한 깨짐을 막는다.
    function escapeHtml(value) {
        return String(value ?? '').replace(/[&<>"']/g, ch => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;'
        })[ch]);
    }

    // 점수 입력값은 최소 0점, 최대 100점으로 제한한다.
    // 사용자가 100점을 넘게 입력하거나 붙여넣어도 즉시 100으로 보정한다.
    function clampScoreValue(value) {
        if (value === '' || value == null) {
            return '';
        }

        const numberValue = Number(value);
        if (Number.isNaN(numberValue)) {
            return '';
        }
        if (numberValue < 0) {
            return 0;
        }
        if (numberValue > 100) {
            return 100;
        }
        return numberValue;
    }

    // number input에 직접 연결하는 점수 제한 함수
    function clampScoreInput(input) {
        const limitedValue = clampScoreValue(input.value);
        input.value = limitedValue === '' ? '' : limitedValue;
    }

    // 저장 직전에도 한 번 더 보정해서 서버에 100점을 넘는 값이 전달되지 않게 한다.
    function getLimitedScoreInputValue(inputId) {
        const input = document.getElementById(inputId);
        clampScoreInput(input);
        return Number(input.value);
    }

    // 시험일시 선택 팝업을 연다.
    // 기존 선택값이 있으면 팝업 입력값에 먼저 채워 넣는다.
    function openExamDatePicker() {
        const examDate = document.getElementById('examDate').value;
        const [dateValue, timeValue] = examDate ? examDate.split('T') : ['', ''];

        document.getElementById('examDatePickerDate').value = dateValue || '';
        document.getElementById('examDatePickerTime').value = timeValue || '';
        document.getElementById('examDatePickerOverlay').classList.add('show');
    }

    // 시험일시 선택 팝업을 닫는다.
    function closeExamDatePicker() {
        document.getElementById('examDatePickerOverlay').classList.remove('show');
    }

    // 팝업에서 고른 날짜와 시간을 시험일시 입력값에 반영한다.
    function applyExamDateSelection() {
        const dateValue = document.getElementById('examDatePickerDate').value;
        const timeValue = document.getElementById('examDatePickerTime').value;

        if (!dateValue || !timeValue) {
            setStatus('시험일과 시험시간을 모두 선택하세요.', true);
            return;
        }

        setExamDateValue(dateValue + 'T' + timeValue);
        closeExamDatePicker();
        setStatus('시험일시를 선택했습니다: ' + document.getElementById('examDateDisplay').value);
    }

    // 서버 전송용 시험일시 값과 화면 표시값을 함께 갱신한다.
    function setExamDateValue(value) {
        document.getElementById('examDate').value = value || '';
        document.getElementById('examDateDisplay').value = value ? formatKoreanDateTime(value) : '';
    }

    // 서버에서 내려온 시험일시를 사람이 읽기 쉬운 한국어 형식으로 바꾼다.
    function formatKoreanDateTime(value) {
        if (!value) {
            return '';
        }

        const normalizedValue = String(value).replace(' ', 'T');
        const date = new Date(normalizedValue);
        if (Number.isNaN(date.getTime())) {
            return value;
        }

        return `${date.getFullYear()}년 ${date.getMonth() + 1}월 ${date.getDate()}일 ${date.getHours()}시 ${String(date.getMinutes()).padStart(2, '0')}분`;
    }

    // 시험 목록에 포함된 반 정보를 중복 없이 뽑아 직접 만든 선택 메뉴에 채운다.
    // 입력값이 이미 있어도 토글을 누르면 전체 반 목록을 다시 선택할 수 있다.
    function renderClassOptions() {
        const classMap = new Map();
        const sourceRows = classOptionRows.length > 0 ? classOptionRows : examRows;

        sourceRows.forEach(row => {
            if (row.class_id) {
                classMap.set(String(row.class_id), row.class_name || '반 이름 없음');
            }
        });

        const classOptions = Array.from(classMap.entries())
            .sort((a, b) => a[1].localeCompare(b[1], 'ko'));

        renderClassMenu('classIdMenu', 'classId', classOptions, false);
        renderClassMenu('subjectGradeClassIdMenu', 'subjectGradeClassId', classOptions, true);
        renderClassMenu('classAverageClassIdMenu', 'classAverageClassId', classOptions, true);
        renderClassMenu('trendClassIdMenu', 'trendClassId', classOptions, false);
    }

    // 반 선택 메뉴를 그린다.
    // includeEmpty가 true면 조회 조건에서 전체 반을 선택할 수 있게 빈 값 버튼을 추가한다.
    function renderClassMenu(menuId, inputId, classOptions, includeEmpty) {
        const menu = document.getElementById(menuId);
        menu.innerHTML = '';

        if (includeEmpty) {
            menu.innerHTML += `<button type="button" onclick="selectClassOption('${inputId}', '')">전체 반</button>`;
        }

        if (classOptions.length === 0) {
            menu.innerHTML += '<div class="empty-row">시험 목록에 등록된 반이 없습니다.</div>';
            return;
        }

        classOptions.forEach(([classId, className]) => {
            menu.innerHTML += `
                <button type="button" onclick="selectClassOption('${inputId}', '${classId}', '${escapeHtml(className)}')">
                    ${escapeHtml(className)}
                </button>
            `;
        });
    }

    // 반 선택 메뉴를 열고 닫는다.
    function toggleClassMenu(menuId) {
        document.querySelectorAll('.class-picker-menu').forEach(menu => {
            if (menu.id !== menuId) {
                menu.classList.remove('show');
            }
        });

        document.getElementById(menuId).classList.toggle('show');
    }

    // 반 선택 메뉴에서 고른 반명은 화면에, class_id는 숨김 값에 저장한다.
    function selectClassOption(inputId, classId, className = '') {
        document.getElementById(inputId).value = className;
        document.getElementById(inputId + 'Value').value = classId;
        document.querySelectorAll('.class-picker-menu').forEach(menu => menu.classList.remove('show'));

        if (inputId === 'trendClassId') {
            loadTrendSubjectOptions();
        }
    }

    // 학생명 검색어에 맞춰 성적 추이 학생 선택 메뉴를 다시 그린다.
    // 선택 전까지는 hidden student_id를 비워 잘못된 학생으로 조회되지 않게 한다.
    function handleTrendStudentSearchInput() {
        document.getElementById('trendStudentId').value = '';
        renderTrendStudentMenu(false);
    }

    // 학생 선택 메뉴를 토글한다.
    // 입력값이 없어도 버튼을 누르면 전체 수강 학생을 볼 수 있다.
    function toggleTrendStudentMenu() {
        const menu = document.getElementById('trendStudentMenu');
        document.querySelectorAll('.class-picker-menu').forEach(item => {
            if (item.id !== 'trendStudentMenu') {
                item.classList.remove('show');
            }
        });

        if (menu.classList.contains('show')) {
            menu.classList.remove('show');
            return;
        }

        renderTrendStudentMenu(true);
    }

    // 학생명 자동완성 목록을 렌더링한다.
    // 화면에는 이름/학생번호만 보여주고 student_id는 선택 시 hidden 값으로만 저장한다.
    function renderTrendStudentMenu(showAll) {
        const menu = document.getElementById('trendStudentMenu');
        const keyword = document.getElementById('trendStudentSearch').value.trim().toLowerCase();

        if (!showAll && !keyword) {
            menu.classList.remove('show');
            menu.innerHTML = '';
            trendStudentMenuIndex = -1;
            return;
        }

        const matchedRows = activeStudentOptions.filter(row => {
            const text = `${row.student_name || ''} ${row.student_no || ''} ${row.school_name || ''}`.toLowerCase();
            return showAll || text.includes(keyword);
        });

        menu.innerHTML = '';
        menu.classList.add('show');
        trendStudentMenuIndex = -1;

        if (matchedRows.length === 0) {
            menu.innerHTML = '<div class="empty-row">검색된 수강 학생이 없습니다.</div>';
            return;
        }

        matchedRows.forEach(row => {
            const label = `${row.student_name || '-'}${row.student_no ? ' / ' + row.student_no : ''}`;
            menu.innerHTML += `
                <button type="button" data-trend-student-option="true"
                        onclick="selectTrendStudent('${row.student_id}', '${escapeHtml(label)}')">
                    ${escapeHtml(label)}
                </button>
            `;
        });
    }

    // 자동완성 목록을 방향키와 Enter로 선택할 수 있게 한다.
    function handleTrendStudentMenuKeydown(event) {
        const menu = document.getElementById('trendStudentMenu');
        const options = Array.from(menu.querySelectorAll('button[data-trend-student-option="true"]'));

        if (event.key === 'ArrowDown') {
            event.preventDefault();
            if (!menu.classList.contains('show')) {
                renderTrendStudentMenu(true);
                return;
            }
            setTrendStudentActiveOption(Math.min(trendStudentMenuIndex + 1, options.length - 1));
        } else if (event.key === 'ArrowUp') {
            event.preventDefault();
            setTrendStudentActiveOption(Math.max(trendStudentMenuIndex - 1, 0));
        } else if (event.key === 'Enter' && menu.classList.contains('show')) {
            event.preventDefault();
            if (options[trendStudentMenuIndex]) {
                options[trendStudentMenuIndex].click();
            }
        } else if (event.key === 'Escape') {
            menu.classList.remove('show');
        }
    }

    // 키보드로 선택 중인 자동완성 항목을 표시한다.
    function setTrendStudentActiveOption(index) {
        const menu = document.getElementById('trendStudentMenu');
        const options = Array.from(menu.querySelectorAll('button[data-trend-student-option="true"]'));
        if (options.length === 0) {
            return;
        }

        trendStudentMenuIndex = index;
        options.forEach((option, optionIndex) => {
            option.classList.toggle('active', optionIndex === trendStudentMenuIndex);
        });

        options[trendStudentMenuIndex].scrollIntoView({block: 'nearest'});
    }

    // 학생 자동완성에서 선택한 학생명은 화면에, student_id는 hidden 값에 저장한다.
    function selectTrendStudent(studentId, label) {
        document.getElementById('trendStudentId').value = studentId;
        document.getElementById('trendStudentSearch').value = label;
        document.getElementById('trendStudentMenu').classList.remove('show');
        loadTrendSubjectOptions();
    }

    // 성적 추이 과목 선택값을 전체 과목 상태로 되돌린다.
    function resetTrendSubject() {
        document.getElementById('trendSubject').value = '전체 과목';
        document.getElementById('trendSubjectValue').value = '';
    }

    // 선택된 학생 또는 반을 기준으로 실제 성적이 있는 과목 목록을 불러온다.
    async function loadTrendSubjectOptions() {
        resetTrendSubject();
        trendSubjectOptions = [];

        const mode = getTrendMode();
        const studentId = document.getElementById('trendStudentId').value;
        const classId = document.getElementById('trendClassIdValue').value;

        if (mode === 'student' && !studentId) {
            renderTrendSubjectMenu(false);
            return;
        }

        if (mode === 'class' && !classId) {
            renderTrendSubjectMenu(false);
            return;
        }

        const params = new URLSearchParams();
        if (mode === 'student') {
            params.append('studentId', studentId);
        } else {
            params.append('classId', classId);
        }

        const res = await fetch('/api/grades/trend-subjects?' + params.toString());
        if (!res.ok) {
            setStatus('성적 추이 과목 목록을 불러오지 못했습니다.', true);
            return;
        }

        const rows = await res.json();
        trendSubjectOptions = rows
            .map(row => row.subject)
            .filter(subject => subject);
        renderTrendSubjectMenu(false);
    }

    // 성적 추이 과목 토글 메뉴를 열고 닫는다.
    function toggleTrendSubjectMenu() {
        const menu = document.getElementById('trendSubjectMenu');
        document.querySelectorAll('.class-picker-menu').forEach(item => {
            if (item.id !== 'trendSubjectMenu') {
                item.classList.remove('show');
            }
        });

        if (menu.classList.contains('show')) {
            menu.classList.remove('show');
            return;
        }

        renderTrendSubjectMenu(true);
    }

    // 성적 추이 과목 메뉴를 렌더링한다.
    // 전체 과목은 항상 첫 항목으로 두고, 이후 실제 시험 과목을 보여준다.
    function renderTrendSubjectMenu(showMenu) {
        const menu = document.getElementById('trendSubjectMenu');
        menu.innerHTML = `<button type="button" onclick="selectTrendSubject('')">전체 과목</button>`;

        if (trendSubjectOptions.length === 0) {
            menu.innerHTML += '<div class="empty-row">선택 가능한 과목이 없습니다.</div>';
        } else {
            trendSubjectOptions.forEach(subject => {
                menu.innerHTML += `
                    <button type="button" data-subject="${escapeHtml(subject)}"
                            onclick="selectTrendSubject(this.dataset.subject)">
                        ${escapeHtml(subject)}
                    </button>
                `;
            });
        }

        menu.classList.toggle('show', showMenu);
    }

    // 성적 추이 과목 토글에서 고른 과목을 저장한다.
    function selectTrendSubject(subject) {
        document.getElementById('trendSubjectValue').value = subject;
        document.getElementById('trendSubject').value = subject || '전체 과목';
        document.getElementById('trendSubjectMenu').classList.remove('show');
    }

    // 시험 등록 또는 수정 요청
    async function saveExam() {
        const classId = document.getElementById('classIdValue').value;
        if (!classId) {
            setStatus('시험을 등록할 반을 선택하세요.', true);
            return;
        }

        const body = {
            classId: Number(classId),
            examName: document.getElementById('examName').value,
            subject: document.getElementById('subject').value,
            examDate: document.getElementById('examDate').value,
            totalScore: getLimitedScoreInputValue('totalScore')
        };

        const url = editingExamId ? '/api/exams/' + editingExamId : '/api/exams';
        const method = editingExamId ? 'PUT' : 'POST';

        const res = await sendJson(url, method, body);
        const text = await res.text();

        if (!res.ok) {
            setStatus('시험 저장에 실패했습니다. 반, 시험명, 시험일시를 확인해주세요.', true);
            return;
        }

        setStatus(editingExamId ? '시험 정보를 수정했습니다.' : '시험을 등록했습니다.');
        resetExamForm();
        loadExams();
    }

    // 현재 입력값으로 새 시험을 등록한다.
    // 기존 시험을 선택한 상태라도 editingExamId를 사용하지 않고 POST로 신규 등록한다.
    async function createExamFromForm() {
        const classId = document.getElementById('classIdValue').value;
        if (!classId) {
            setStatus('새 시험을 등록할 반을 선택하세요.', true);
            return;
        }

        const body = {
            classId: Number(classId),
            examName: document.getElementById('examName').value,
            subject: document.getElementById('subject').value,
            examDate: document.getElementById('examDate').value,
            totalScore: getLimitedScoreInputValue('totalScore')
        };

        const res = await sendJson('/api/exams', 'POST', body);
        await res.text();

        if (!res.ok) {
            setStatus('새 시험 등록에 실패했습니다. 입력값을 확인해주세요.', true);
            return;
        }

        setStatus('새 시험을 등록했습니다.');
        resetExamForm();
        loadExams();
    }

    // 시험 입력 폼을 신규 등록 상태로 되돌린다.
    function resetExamForm() {
        editingExamId = null;
        document.getElementById('classId').value = '';
        document.getElementById('classIdValue').value = '';
        document.getElementById('examName').value = '';
        document.getElementById('subject').value = '';
        setExamDateValue('');
        document.getElementById('totalScore').value = '100';
        document.getElementById('saveExamButton').innerText = '시험 등록';
        document.getElementById('deleteExamButton').disabled = true;
    }

    // 시험 삭제 실패 메시지를 사용자에게 보여줄 문장으로 바꾼다.
    // DB 제약조건명이나 SQL 오류가 화면에 그대로 노출되지 않도록 처리한다.
    function getExamDeleteErrorMessage(errorText) {
        if (errorText.includes('grades_exam_id_fkey') || errorText.includes('still referenced from table "grades"')) {
            return '남아있는 성적이 존재해 삭제할 수 없습니다. 성적을 삭제 후 다시 시도해주세요.';
        }

        return '시험 삭제 중 오류가 발생했습니다. 잠시 후 다시 시도해주세요.';
    }

    // 선택된 시험을 삭제한다.
    // 연결된 성적이 있으면 사용자용 안내 문구를 표시한다.
    async function deleteExam() {
        if (!editingExamId) {
            setStatus('삭제할 시험을 먼저 선택하세요.', true);
            return;
        }

        if (!confirm('선택한 시험을 삭제할까요? 연결된 성적이 있으면 삭제가 실패할 수 있습니다.')) {
            return;
        }

        const res = await sendDelete('/api/exams/' + editingExamId);
        const text = await res.text();

        if (!res.ok) {
            setStatus(getExamDeleteErrorMessage(text), true);
            return;
        }

        setStatus('시험을 삭제했습니다.');
        selectedExamId = null;
        resetExamForm();
        clearSelectedExamArea();
        loadExams();
    }

    // 선택 시험 영역을 초기화한다.
    function clearSelectedExamArea() {
        document.getElementById('selectedExamInfo').innerText = '선택한 시험이 없습니다.';
        document.getElementById('studentGradeList').innerHTML =
            '<tr><td colspan="5" class="empty-row">시험을 선택하면 학생 목록이 표시됩니다.</td></tr>';
        document.getElementById('gradeList').innerHTML =
            '<tr><td colspan="4" class="empty-row">시험을 선택하면 입력된 성적이 표시됩니다.</td></tr>';
    }

    // 반/학생 선택 목록을 먼저 불러온다.
    // 화면에는 이름을 보여주고, 저장·조회 요청에는 숨겨둔 PK만 사용한다.
    async function loadGradeOptions() {
        const [classRes, studentRes] = await Promise.all([
            fetch('/api/grades/classes'),
            fetch('/api/grades/students')
        ]);

        if (classRes.ok) {
            classOptionRows = await classRes.json();
            renderClassOptions();
        } else {
            setStatus('반 선택 목록을 불러오지 못했습니다.', true);
        }

        if (studentRes.ok) {
            activeStudentOptions = await studentRes.json();
        } else {
            setStatus('학생 선택 목록을 불러오지 못했습니다.', true);
        }
    }

    // 시험 목록 조회 요청
    async function loadExams() {
        const res = await fetch('/api/exams');

        if (!res.ok) {
            setStatus('시험 목록 조회에 실패했습니다.', true);
            return;
        }

        examRows = await res.json();
        renderClassOptions();
        applyExamListView();
    }

    // 시험 목록 검색과 정렬을 적용한 뒤 테이블을 다시 그린다.
    function applyExamListView() {
        filteredExamRows = examRows
            .filter(row => isExamSearchMatched(row))
            .sort(compareExamRows);

        currentExamPage = 1;
        renderExamRows();
        renderExamSortIndicators();
    }

    // 선택한 검색 카테고리에 맞는 항목만 남긴다.
    function isExamSearchMatched(row) {
        const keyword = document.getElementById('examSearchKeyword').value.trim().toLowerCase();
        if (!keyword) {
            return true;
        }

        const searchValues = {
            all: [row.class_name, row.exam_name, row.subject, row.exam_date, row.total_score],
            className: [row.class_name],
            examName: [row.exam_name],
            subject: [row.subject],
            examDate: [row.exam_date]
        };

        return (searchValues[examSearchType] || searchValues.all)
            .some(value => String(value ?? '').toLowerCase().includes(keyword));
    }

    // 시험 목록 정렬 기준을 바꾼다.
    // 같은 제목을 다시 누르면 오름차순/내림차순이 번갈아 적용된다.
    function setExamSort(sortKey) {
        if (examSortKey === sortKey) {
            examSortDirection = examSortDirection === 'asc' ? 'desc' : 'asc';
        } else {
            examSortKey = sortKey;
            examSortDirection = sortKey === 'exam_date' ? 'desc' : 'asc';
        }

        applyExamListView();
    }

    // 현재 정렬 상태에 따라 두 시험 행의 순서를 비교한다.
    function compareExamRows(a, b) {
        if (!examSortKey) {
            return 0;
        }

        let result = 0;
        if (examSortKey === 'exam_id') {
            result = Number(a.exam_id) - Number(b.exam_id);
        } else if (examSortKey === 'exam_date') {
            result = new Date(a.exam_date).getTime() - new Date(b.exam_date).getTime();
        } else {
            result = String(a[examSortKey] ?? '').localeCompare(String(b[examSortKey] ?? ''), 'ko');
        }

        return examSortDirection === 'asc' ? result : -result;
    }

    // 정렬 중인 제목 옆에 방향 표시를 보여준다.
    function renderExamSortIndicators() {
        ['class_name', 'exam_name', 'subject', 'exam_date'].forEach(key => {
            const indicator = document.getElementById('sort_' + key);
            if (!indicator) {
                return;
            }

            indicator.innerText = examSortKey === key ? (examSortDirection === 'asc' ? '▲' : '▼') : '↕';
            indicator.classList.toggle('active', examSortKey === key);
        });
    }

    // 시험 목록 검색 카테고리 메뉴를 열고 닫는다.
    function toggleExamSearchMenu() {
        document.getElementById('examSearchMenu').classList.toggle('show');
    }

    // 검색 카테고리를 변경하고 현재 검색어로 다시 조회한다.
    function setExamSearchType(type) {
        examSearchType = type;
        document.getElementById('examSearchTypeLabel').innerText = examSearchLabels[type];
        document.getElementById('examSearchMenu').classList.remove('show');
        applyExamListView();
    }

    // 조회된 시험 목록을 화면 테이블에 출력한다.
    function renderExamRows() {
        const tbody = document.getElementById('examList');
        tbody.innerHTML = '';

        if (filteredExamRows.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" class="empty-row">조회된 시험이 없습니다.</td></tr>';
            renderExamPagination();
            return;
        }

        const startIndex = (currentExamPage - 1) * examPageSize;
        const pageRows = filteredExamRows.slice(startIndex, startIndex + examPageSize);

        pageRows.forEach(row => {
            const selectedClass = Number(row.exam_id) === Number(selectedExamId) ? ' class="selected"' : '';
            tbody.innerHTML += `
                <tr${selectedClass} onclick="selectExam(${row.exam_id})">
                    <td>${escapeHtml(row.class_name)}</td>
                    <td>${escapeHtml(row.exam_name)}</td>
                    <td>${escapeHtml(row.subject || '')}</td>
                    <td>${formatKoreanDateTime(row.exam_date)}</td>
                    <td>${row.total_score}</td>
                </tr>
            `;
        });

        renderExamPagination();
    }

    // 시험 목록 페이지 번호를 출력한다.
    function renderExamPagination() {
        const pagination = document.getElementById('examPagination');
        pagination.innerHTML = '';

        const totalPages = Math.ceil(filteredExamRows.length / examPageSize);
        if (totalPages <= 1) {
            return;
        }

        const pageGroupStart = Math.floor((currentExamPage - 1) / maxVisiblePages) * maxVisiblePages + 1;
        const pageGroupEnd = Math.min(totalPages, pageGroupStart + maxVisiblePages - 1);

        pagination.innerHTML += `
            <button class="page-btn" onclick="goExamPage(${currentExamPage - 1})" ${currentExamPage === 1 ? 'disabled' : ''}>이전</button>
        `;

        for (let page = pageGroupStart; page <= pageGroupEnd; page++) {
            const activeClass = page === currentExamPage ? ' active' : '';
            pagination.innerHTML += `
                <button class="page-btn${activeClass}" onclick="goExamPage(${page})">${page}</button>
            `;
        }

        pagination.innerHTML += `
            <button class="page-btn" onclick="goExamPage(${currentExamPage + 1})" ${currentExamPage === totalPages ? 'disabled' : ''}>다음</button>
        `;
    }

    // 선택한 페이지로 이동한다.
    function goExamPage(page) {
        const totalPages = Math.ceil(filteredExamRows.length / examPageSize);
        if (page < 1 || page > totalPages) {
            return;
        }

        currentExamPage = page;
        renderExamRows();
    }

    // 시험 목록에서 시험을 클릭했을 때 실행한다.
    async function selectExam(examId) {
        selectedExamId = examId;
        editingExamId = examId;

        const selectedExam = examRows.find(row => Number(row.exam_id) === Number(examId));

        if (selectedExam) {
            document.getElementById('classId').value = selectedExam.class_name || '';
            document.getElementById('classIdValue').value = selectedExam.class_id || '';
            document.getElementById('examName').value = selectedExam.exam_name;
            document.getElementById('subject').value = selectedExam.subject || '';
            setExamDateValue(formatExamDateForInput(selectedExam.exam_date));
            document.getElementById('totalScore').value = clampScoreValue(selectedExam.total_score);
            document.getElementById('saveExamButton').innerText = '시험 수정';
            document.getElementById('deleteExamButton').disabled = false;
            document.getElementById('selectedExamInfo').innerText =
                '선택한 시험: ' + selectedExam.class_name + ' / ' +
                selectedExam.exam_name + ' / ' + formatKoreanDateTime(selectedExam.exam_date);
        }

        renderExamRows();
        loadStudentGradeRows();
        loadGradesByExam();
    }

    // DB에서 내려온 시험일시 값을 datetime-local 입력값 형식으로 맞춘다.
    // 브라우저 input은 yyyy-MM-ddTHH:mm 형태를 기대한다.
    function formatExamDateForInput(value) {
        if (!value) {
            return '';
        }

        return String(value).substring(0, 16);
    }

    // 선택한 시험의 수강 학생 목록 + 기존 성적 조회
    async function loadStudentGradeRows() {
        if (!selectedExamId) {
            clearSelectedExamArea();
            return;
        }

        const res = await fetch('/api/exams/' + selectedExamId + '/students');

        if (!res.ok) {
            setStatus('학생별 성적 입력 목록 조회에 실패했습니다.', true);
            return;
        }

        const data = await res.json();
        const tbody = document.getElementById('studentGradeList');
        tbody.innerHTML = '';

        if (data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" class="empty-row">이 시험의 반에 등록된 수강 학생이 없습니다.</td></tr>';
            return;
        }

        // grade_id 유무로 신규 등록과 수정 요청을 나눠서 처리한다.
        data.forEach(row => {
            tbody.innerHTML += `
                <tr data-student-grade-row="true"
                    data-student-id="${row.student_id}"
                    data-grade-id="${row.grade_id || ''}">
                    <td>${escapeHtml(row.student_name || '')}</td>
                    <td>${escapeHtml(row.student_no || '')}</td>
                    <td><input id="studentScore_${row.student_id}" type="number" min="0" max="100" value="${row.score || ''}" oninput="clampScoreInput(this)"></td>
                    <td><input id="studentComment_${row.student_id}" value="${escapeHtml(row.comment || '')}"></td>
                    <td>
                        <button class="grade-btn" onclick="saveStudentGrade(${row.student_id}, ${row.grade_id || 'null'})">저장</button>
                        <button class="grade-btn danger" onclick="deleteStudentGrade(${row.grade_id || 'null'})" ${row.grade_id ? '' : 'disabled'}>삭제</button>
                    </td>
                </tr>
            `;
        });
    }

    // 학생별 성적 저장
    // gradeId가 있으면 PUT으로 수정하고, 없으면 POST로 신규 등록한다.
    async function saveStudentGrade(studentId, gradeId) {
        if (!selectedExamId) {
            setStatus('먼저 시험 목록에서 시험을 선택하세요.', true);
            return;
        }

        const body = {
            examId: selectedExamId,
            studentId: studentId,
            score: getLimitedScoreInputValue('studentScore_' + studentId),
            comment: document.getElementById('studentComment_' + studentId).value
        };

        const url = gradeId ? '/api/grades/' + gradeId : '/api/grades';
        const method = gradeId ? 'PUT' : 'POST';
        const res = await sendJson(url, method, body);
        const text = await res.text();

        if (!res.ok) {
            setStatus('성적 저장에 실패했습니다. 점수 입력값을 확인해주세요.', true);
            return;
        }

        setStatus('성적을 저장했습니다.');
        loadStudentGradeRows();
        loadGradesByExam();
    }

    // 현재 입력된 학생 점수와 비고를 한 번에 저장한다.
    // 점수가 비어 있는 행은 0점으로 잘못 저장되지 않도록 제외한다.
    async function saveAllStudentGrades() {
        if (!selectedExamId) {
            setStatus('먼저 시험 목록에서 시험을 선택하세요.', true);
            return;
        }

        const rows = Array.from(document.querySelectorAll('tr[data-student-grade-row="true"]'));
        const gradeRows = rows
            .map(row => {
                const studentId = row.dataset.studentId;
                const scoreInput = document.getElementById('studentScore_' + studentId);
                const commentInput = document.getElementById('studentComment_' + studentId);

                if (!scoreInput || scoreInput.value === '') {
                    return null;
                }

                return {
                    gradeId: row.dataset.gradeId ? Number(row.dataset.gradeId) : null,
                    examId: selectedExamId,
                    studentId: Number(studentId),
                    score: getLimitedScoreInputValue('studentScore_' + studentId),
                    comment: commentInput ? commentInput.value : ''
                };
            })
            .filter(row => row !== null);

        if (gradeRows.length === 0) {
            setStatus('일괄 저장할 점수가 입력된 학생이 없습니다.', true);
            return;
        }

        const res = await sendJson('/api/grades/batch', 'POST', gradeRows);
        await res.text();

        if (!res.ok) {
            setStatus('성적 일괄 저장에 실패했습니다. 입력값을 확인해주세요.', true);
            return;
        }

        setStatus(`${gradeRows.length}명의 성적을 일괄 저장했습니다.`);
        loadStudentGradeRows();
        loadGradesByExam();
    }

    // 학생별 입력 영역에서 성적 삭제
    async function deleteStudentGrade(gradeId) {
        if (!gradeId) {
            setStatus('아직 저장된 성적이 없습니다.', true);
            return;
        }

        if (!confirm('이 성적을 삭제할까요?')) {
            return;
        }

        const res = await sendDelete('/api/grades/' + gradeId);
        const text = await res.text();

        if (!res.ok) {
            setStatus('성적 삭제에 실패했습니다. 잠시 후 다시 시도해주세요.', true);
            return;
        }

        setStatus('성적을 삭제했습니다.');
        loadStudentGradeRows();
        loadGradesByExam();
    }

    // 선택한 시험 기준으로 성적 확인 목록을 조회한다.
    async function loadGradesByExam() {
        const tbody = document.getElementById('gradeList');

        if (!selectedExamId) {
            gradeCheckRows = [];
            tbody.innerHTML = '<tr><td colspan="4" class="empty-row">시험을 선택하면 입력된 성적이 표시됩니다.</td></tr>';
            return;
        }

        const res = await fetch('/api/exams/' + selectedExamId + '/grades');

        if (!res.ok) {
            setStatus('성적 확인 목록 조회에 실패했습니다.', true);
            return;
        }

        gradeCheckRows = await res.json();
        renderGradeCheckRows();
    }

    // 성적 확인 표의 정렬 기준을 바꾼다.
    // 같은 헤더를 다시 누르면 오름차순/내림차순이 번갈아 적용된다.
    function setGradeCheckSort(sortKey) {
        if (gradeCheckSortKey === sortKey) {
            gradeCheckSortDirection = gradeCheckSortDirection === 'asc' ? 'desc' : 'asc';
        } else {
            gradeCheckSortKey = sortKey;
            gradeCheckSortDirection = sortKey === 'rank_no' ? 'asc' : 'desc';
        }

        renderGradeCheckRows();
    }

    // 성적 확인 표를 현재 정렬 상태에 맞춰 다시 그린다.
    function renderGradeCheckRows() {
        const tbody = document.getElementById('gradeList');
        tbody.innerHTML = '';

        if (gradeCheckRows.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" class="empty-row">아직 입력된 성적이 없습니다.</td></tr>';
            renderGradeCheckSortIndicators();
            return;
        }

        const rows = [...gradeCheckRows].sort(compareGradeCheckRows);
        rows.forEach(row => {
            tbody.innerHTML += `
                <tr>
                    <td>${escapeHtml(row.student_name || '')}</td>
                    <td>${row.score}</td>
                    <td>${row.rank_no || ''}</td>
                    <td>${escapeHtml(row.comment || '')}</td>
                </tr>
            `;
        });

        renderGradeCheckSortIndicators();
    }

    // 성적 확인 표의 행 비교 함수
    function compareGradeCheckRows(a, b) {
        if (!gradeCheckSortKey) {
            return 0;
        }

        let result = 0;
        if (gradeCheckSortKey === 'score' || gradeCheckSortKey === 'rank_no') {
            result = Number(a[gradeCheckSortKey] ?? 0) - Number(b[gradeCheckSortKey] ?? 0);
        } else {
            result = String(a[gradeCheckSortKey] ?? '').localeCompare(String(b[gradeCheckSortKey] ?? ''), 'ko');
        }

        return gradeCheckSortDirection === 'asc' ? result : -result;
    }

    // 성적 확인 표 헤더에 현재 정렬 방향을 표시한다.
    function renderGradeCheckSortIndicators() {
        ['student_name', 'score', 'rank_no'].forEach(key => {
            const indicator = document.getElementById('gradeSort_' + key);
            if (!indicator) {
                return;
            }

            indicator.innerText = gradeCheckSortKey === key ? (gradeCheckSortDirection === 'asc' ? '▲' : '▼') : '↕';
            indicator.classList.toggle('active', gradeCheckSortKey === key);
        });
    }

    // 과목별 성적 조회
    // 과목명은 필수이고, 반을 선택한 경우에만 추가 필터로 사용한다.
    async function loadGradesBySubject() {
        const subject = document.getElementById('subjectGradeSubject').value;
        const classId = document.getElementById('subjectGradeClassIdValue').value;
        const tbody = document.getElementById('subjectGradeList');

        if (!subject) {
            setStatus('과목별 성적을 조회할 과목을 입력하세요.', true);
            return;
        }

        const params = new URLSearchParams();
        params.append('subject', subject);
        if (classId) {
            params.append('classId', classId);
        }

        const res = await fetch('/api/grades/subjects?' + params.toString());

        if (!res.ok) {
            setStatus('과목별 성적 조회에 실패했습니다. 과목과 반 입력값을 확인해주세요.', true);
            return;
        }

        const data = await res.json();
        tbody.innerHTML = '';

        if (data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="8" class="empty-row">조회된 과목별 성적이 없습니다.</td></tr>';
            return;
        }

        data.forEach(row => {
            tbody.innerHTML += `
                <tr>
                    <td>${escapeHtml(row.subject || '')}</td>
                    <td>${escapeHtml(row.exam_name || '')}</td>
                    <td>${escapeHtml(row.class_name || '')}</td>
                    <td>${escapeHtml(row.student_name || '')}</td>
                    <td>${row.score}</td>
                    <td>${row.total_score}</td>
                    <td>${row.rank_no || ''}</td>
                    <td>${formatKoreanDateTime(row.exam_date)}</td>
                </tr>
            `;
        });
    }

    // 반 평균 조회
    // 반을 선택하지 않으면 전체 반을 조회하고, 과목을 입력하면 해당 과목 시험만 평균 계산에 사용한다.
    async function loadClassAverageStats() {
        const classId = document.getElementById('classAverageClassIdValue').value;
        const subject = document.getElementById('classAverageSubject').value;
        const tbody = document.getElementById('classAverageList');

        const params = new URLSearchParams();
        if (classId) {
            params.append('classId', classId);
        }
        if (subject) {
            params.append('subject', subject);
        }

        const queryString = params.toString();
        const url = '/api/grades/class-averages' + (queryString ? '?' + queryString : '');
        const res = await fetch(url);

        if (!res.ok) {
            setStatus('반 평균 조회에 실패했습니다. 반과 과목 입력값을 확인해주세요.', true);
            return;
        }

        const data = await res.json();
        tbody.innerHTML = '';

        if (data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" class="empty-row">조회된 반 평균이 없습니다.</td></tr>';
            return;
        }

        data.forEach(row => {
            tbody.innerHTML += `
                <tr>
                    <td>${escapeHtml(row.class_name)}</td>
                    <td>${row.student_count ?? '-'}</td>
                    <td>${row.grade_count}</td>
                    <td>${row.average_score ?? '-'}</td>
                    <td>${row.highest_score ?? '-'}</td>
                    <td>${row.lowest_score ?? '-'}</td>
                    <td>${row.average_rate == null ? '-' : row.average_rate + '%'}</td>
                </tr>
            `;
        });
    }

    // 성적 추이 조회 모드를 학생별/반별로 전환한다.
    function changeTrendMode() {
        const mode = getTrendMode();
        document.getElementById('trendStudentField').style.display = mode === 'student' ? 'block' : 'none';
        document.getElementById('trendClassField').style.display = mode === 'class' ? 'block' : 'none';
        document.getElementById('trendInfo').style.display = 'none';
        document.getElementById('trendInfo').innerText = '';
        showTrendChartMessage('성적 추이를 조회하면 차트가 표시됩니다.');
        document.getElementById('trendList').innerHTML = '';
        resetTrendSubject();
        loadTrendSubjectOptions();
    }

    // 현재 선택된 성적 추이 조회 기준을 반환한다.
    function getTrendMode() {
        return document.querySelector('input[name="trendMode"]:checked').value;
    }

    // 학생별 또는 반별 성적 추이 조회
    async function loadGradeTrend() {
        const mode = getTrendMode();
        const studentId = document.getElementById('trendStudentId').value;
        const classId = document.getElementById('trendClassIdValue').value;
        const subject = document.getElementById('trendSubjectValue').value;
        const chart = document.getElementById('trendChart');

        if (mode === 'student' && !studentId) {
            setStatus('성적 추이를 조회할 학생명을 검색해서 선택하세요.', true);
            return;
        }

        if (mode === 'class' && !classId) {
            setStatus('성적 추이를 조회할 반을 선택하세요.', true);
            return;
        }

        let url = mode === 'student'
            ? '/api/grades/trends?studentId=' + encodeURIComponent(studentId)
            : '/api/grades/class-trends?classId=' + encodeURIComponent(classId);

        // 과목을 입력한 경우에만 subject 검색 조건 추가
        if (subject) {
            url += '&subject=' + encodeURIComponent(subject);
        }

        const res = await fetch(url);

        if (!res.ok) {
            setStatus('성적 추이 조회에 실패했습니다.', true);
            return;
        }

        const data = await res.json();
        const trendRows = sortTrendRowsByDate(data);
        const tbody = document.getElementById('trendList');
        tbody.innerHTML = '';

        if (trendRows.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" class="empty-row">조회된 성적 추이가 없습니다.</td></tr>';
            document.getElementById('trendInfo').style.display = 'none';
            document.getElementById('trendInfo').innerText = '';
            showTrendChartMessage('조회된 성적 추이가 없습니다.');
            return;
        }

        renderTrendInfo(trendRows[0], mode);
        renderGradeTrendChart(trendRows, mode);

        trendRows.forEach(row => {
            tbody.innerHTML += `
                <tr>
                    <td>${escapeHtml(row.exam_name)}</td>
                    <td>${escapeHtml(row.subject || '')}</td>
                    <td>${formatKoreanDateTime(row.exam_date)}</td>
                    <td>${mode === 'class' ? '평균 ' : ''}${row.score}</td>
                    <td>${row.total_score}</td>
                </tr>
            `;
        });
    }

    // 성적 추이 표와 차트는 시험일시가 빠른 순서대로 고정한다.
    // 같은 날짜의 시험은 exam_id를 보조 기준으로 사용해 표시 순서가 흔들리지 않게 한다.
    function sortTrendRowsByDate(rows) {
        return [...rows].sort((a, b) => {
            const dateResult = new Date(a.exam_date).getTime() - new Date(b.exam_date).getTime();
            if (dateResult !== 0) {
                return dateResult;
            }
            return Number(a.exam_id ?? 0) - Number(b.exam_id ?? 0);
        });
    }

    // 성적 추이 조회 대상의 기본 정보를 출력한다.
    function renderTrendInfo(row, mode) {
        const trendInfo = document.getElementById('trendInfo');

        if (mode === 'student') {
            trendInfo.innerText =
                `학생: ${row.student_name || '-'} / 학생번호 ${row.student_no || '-'}`;
        } else {
            trendInfo.innerText =
                `반: ${row.class_name || '-'} / 기준: 시험별 평균`;
        }

        trendInfo.style.display = 'block';
    }

    // 기존 Chart.js 인스턴스를 정리한다.
    // 새 조회 결과를 그리거나 안내 문구를 보여줄 때 이전 차트가 남지 않도록 한다.
    function destroyGradeTrendChart() {
        if (gradeTrendChart) {
            gradeTrendChart.destroy();
            gradeTrendChart = null;
        }
    }

    // 차트 영역에 안내 문구를 표시한다.
    function showTrendChartMessage(message) {
        destroyGradeTrendChart();
        document.getElementById('trendChart').innerHTML = `<div class="empty-row">${message}</div>`;
    }

    // 성적 추이 데이터를 Chart.js 선형 차트로 표시한다.
    // 시험 만점이 다를 수 있으므로 y축은 만점 대비 비율로 그리고, 점 라벨에는 실제 점수를 보여준다.
    function renderGradeTrendChart(data, mode) {
        const chart = document.getElementById('trendChart');
        destroyGradeTrendChart();
        chart.innerHTML = '<canvas id="trendChartCanvas"></canvas>';

        const labels = data.map(row => formatTrendChartLabel(row));
        const rates = data.map(row => Number(row.score) / Number(row.total_score || 100) * 100);
        const scoreLabels = data.map(row => `${mode === 'class' ? '평균 ' : ''}${Number(row.score).toFixed(1)}`);
        const titleText = mode === 'class' ? '반별 시험 평균 추이' : '학생별 성적 추이';
        const ctx = document.getElementById('trendChartCanvas');

        const pointLabelPlugin = {
            id: 'gradePointLabel',
            afterDatasetsDraw(chartInstance) {
                const {ctx} = chartInstance;
                const meta = chartInstance.getDatasetMeta(0);

                ctx.save();
                ctx.font = '11px sans-serif';
                ctx.fillStyle = '#1e3a8a';
                ctx.textAlign = 'center';
                meta.data.forEach((point, index) => {
                    ctx.fillText(scoreLabels[index], point.x, point.y - 10);
                });
                ctx.restore();
            }
        };

        gradeTrendChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels,
                datasets: [{
                    label: titleText,
                    data: rates,
                    borderColor: '#2563eb',
                    backgroundColor: 'rgba(37, 99, 235, .12)',
                    pointBackgroundColor: '#2563eb',
                    pointBorderColor: '#ffffff',
                    pointBorderWidth: 2,
                    pointRadius: 5,
                    pointHoverRadius: 6,
                    borderWidth: 3,
                    tension: .25,
                    fill: true
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                layout: {
                    padding: {
                        top: 24,
                        right: 18,
                        bottom: 4,
                        left: 8
                    }
                },
                plugins: {
                    legend: {
                        display: true,
                        align: 'start',
                        labels: {
                            boxWidth: 12,
                            color: '#1e3a8a',
                            font: {
                                weight: '700'
                            }
                        }
                    },
                    tooltip: {
                        callbacks: {
                            label(context) {
                                const row = data[context.dataIndex];
                                const prefix = mode === 'class' ? '평균 점수' : '점수';
                                return `${prefix}: ${row.score} / ${row.total_score} (${Number(context.raw).toFixed(1)}%)`;
                            }
                        }
                    }
                },
                scales: {
                    y: {
                        min: 0,
                        max: 100,
                        ticks: {
                            callback(value) {
                                return value + '%';
                            }
                        },
                        grid: {
                            color: '#e5e7eb'
                        }
                    },
                    x: {
                        grid: {
                            display: false
                        }
                    }
                }
            },
            plugins: [pointLabelPlugin]
        });
    }

    // 차트 하단 라벨은 시험일 기준으로 짧게 표시한다.
    function formatTrendChartLabel(row) {
        const dateText = String(row.exam_date || '').substring(5, 10);
        return dateText || row.exam_name || '';
    }

    // 페이지 진입 시 기본 목록을 조회한다.
    document.addEventListener('DOMContentLoaded', async () => {
        clearSelectedExamArea();
        await loadGradeOptions();
        loadExams();
    });

    // 검색 카테고리 메뉴가 열린 상태에서 다른 영역을 누르면 메뉴를 닫는다.
    document.addEventListener('click', event => {
        if (!event.target.closest('.exam-search')) {
            document.getElementById('examSearchMenu').classList.remove('show');
        }

        if (!event.target.closest('.class-picker')) {
            document.querySelectorAll('.class-picker-menu').forEach(menu => menu.classList.remove('show'));
        }

        if (event.target.id === 'examDatePickerOverlay') {
            closeExamDatePicker();
        }
    });
</script>

</body>
</html>
