<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8">
  <title>EduBridge · 공지사항</title>
  <link rel="stylesheet" href="/css/common.css">
  <style>
    /* ===== 공지 조회 화면 (학생/학부모 공통 패턴) ===== */
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
    .toolbar input {
      height: 36px; padding: 0 10px; border: 1px solid #d1d5db; border-radius: 6px;
      font-size: 14px; background: #fff; width: 220px;
    }
    .btn {
      height: 36px; padding: 0 16px; border: none; border-radius: 6px;
      font-size: 14px; cursor: pointer; background: #1e3a8a; color: #fff;
    }
    .btn.secondary { background: #fff; color: #374151; border: 1px solid #d1d5db; }
    .back-link { font-size: 13px; color: #6b7280; text-decoration: none; }
    .back-link:hover { color: #1e3a8a; }

    .notice-list { display: flex; flex-direction: column; gap: 10px; }
    .notice-item {
      background: #fff; border: 1px solid #e5e7eb; border-radius: 10px;
      padding: 14px 18px; cursor: pointer; transition: border-color .15s;
    }
    .notice-item:hover { border-color: #1e3a8a; }
    .notice-item.unread { border-left: 4px solid #1e3a8a; }
    .notice-item .top { display: flex; align-items: center; gap: 8px; }
    .notice-item .title { font-weight: 600; font-size: 15px; flex: 1; }
    .notice-item .meta { font-size: 12px; color: #9ca3af; margin-top: 6px; }
    .empty { text-align: center; color: #9ca3af; padding: 40px; background: #fff;
             border: 1px solid #e5e7eb; border-radius: 10px; }

    .chip { display: inline-block; font-size: 12px; padding: 2px 10px; border-radius: 999px; }
    .tt-ALL     { background: #dbeafe; color: #1e40af; }
    .tt-CLASS   { background: #dcfce7; color: #166534; }
    .tt-STUDENT { background: #fef9c3; color: #854d0e; }
    .tt-PARENT  { background: #fce7f3; color: #9d174d; }
    .tt-TEACHER { background: #ede9fe; color: #5b21b6; }
    .badge-unread { background: #1e3a8a; color: #fff; font-size: 11px; padding: 2px 8px; border-radius: 999px; }
    .clip { color: #6b7280; font-size: 12px; }

    .pager { display: flex; gap: 6px; justify-content: center; align-items: center; margin-top: 16px; }
    .pager button {
      min-width: 34px; height: 34px; border: 1px solid #d1d5db; background: #fff;
      border-radius: 6px; cursor: pointer; font-size: 13px;
    }
    .pager button.on { background: #1e3a8a; color: #fff; border-color: #1e3a8a; }
    .pager button:disabled { color: #d1d5db; cursor: default; }
    .pager .total { font-size: 13px; color: #6b7280; margin-left: 10px; }

    .modal-back {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4);
      align-items: center; justify-content: center; z-index: 50;
    }
    .modal-back.show { display: flex; }
    .modal {
      background: #fff; border-radius: 12px; width: 560px; max-width: calc(100vw - 40px);
      max-height: calc(100vh - 60px); overflow-y: auto; padding: 24px;
    }
    .modal h2 { margin: 0 0 10px; font-size: 17px; }
    .detail-meta { font-size: 13px; color: #6b7280; margin-bottom: 12px; }
    .detail-content {
      background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px;
      padding: 14px; font-size: 14px; line-height: 1.7; white-space: pre-wrap;
      margin-bottom: 14px;
    }
    .file-list { border: 1px solid #e5e7eb; border-radius: 8px; }
    .file-item {
      display: flex; align-items: center; gap: 8px; padding: 8px 12px;
      border-bottom: 1px solid #f3f4f6; font-size: 13px;
    }
    .file-item:last-child { border-bottom: none; }
    .file-item a { color: #1e3a8a; text-decoration: none; flex: 1; }
    .file-item a:hover { text-decoration: underline; }
    .file-item .size { color: #9ca3af; }
    .modal .actions { display: flex; justify-content: flex-end; margin-top: 18px; }
  </style>
</head>
<body>

<div th:replace="~{fragments/common :: topbar('공지사항')}"></div>

<div class="shell">
  <main class="content">
    <h1>공지사항</h1>
    <p class="sub"><a class="back-link" href="/parentPage">← 학부모 홈으로</a> · 나에게 온 공지를 확인합니다. 열람하면 자동으로 읽음 처리됩니다.</p>

    <!-- 검색 : GET /notices (NOT-02, 대상자별 목록) -->
    <div class="toolbar">
      <input type="text" id="fKeyword" placeholder="제목 / 내용 검색">
      <button class="btn" id="btnSearch">검색</button>
      <button class="btn secondary" id="btnReset">초기화</button>
    </div>

    <div class="notice-list" id="list"><div class="empty">불러오는 중…</div></div>
    <div class="pager" id="pager"></div>
  </main>
</div>

<!-- 공지 상세 모달 : GET /notices/{id} (NOT-03) + 읽음 처리 (NOT-08) -->
<div class="modal-back" id="detailModalBack">
  <div class="modal">
    <h2 id="dTitle"></h2>
    <div class="detail-meta" id="dMeta"></div>
    <div class="detail-content" id="dContent"></div>
    <div id="dFilesWrap">
      <label style="font-size:13px;color:#6b7280">첨부파일</label>
      <div class="file-list" id="dFiles"></div>
    </div>
    <div class="actions">
      <button class="btn secondary" onclick="closeModal()">닫기</button>
    </div>
  </div>
</div>

<script th:replace="~{fragments/common :: logoutScript}"></script>
<script>
  /* ===== 공지 조회 화면 로직 (학부모) =====
     - 목록: GET /notices?keyword=&page=&size=   (NOT-02, 서버가 내 대상 공지만 반환)
     - 상세: GET /notices/{noticeId}             (NOT-03)
     - 읽음: POST /notices/{noticeId}/read       (NOT-08, 상세 열람 시 자동 호출)
     - 첨부: GET /notice-files/{fileId}/download (NOT-07) */

  const TARGET_LABEL = { ALL: '전체', CLASS: '반', STUDENT: '학생', PARENT: '학부모', TEACHER: '강사' };
  const PAGE_SIZE = 10;
  let currentPage = 1;

  function esc(s) {
    return s == null ? '' : String(s).replace(/[&<>"']/g,
      c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  }
  function fmtDate(dt) { return dt ? dt.substring(0, 10) : ''; }
  function fmtSize(n) {
    if (n == null) return '';
    if (n < 1024) return n + 'B';
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + 'KB';
    return (n / 1024 / 1024).toFixed(1) + 'MB';
  }
  function closeModal() { document.getElementById('detailModalBack').classList.remove('show'); }

  /* ---------- 목록 (NOT-02) ---------- */
  async function loadNotices(page = 1) {
    currentPage = page;
    const params = new URLSearchParams({ page, size: PAGE_SIZE });
    const keyword = document.getElementById('fKeyword').value.trim();
    if (keyword) params.set('keyword', keyword);

    const res = await fetch('/api/notices?' + params);
    if (!res.ok) {
      document.getElementById('list').innerHTML =
        '<div class="empty">목록 조회 실패 (' + res.status + ')</div>';
      document.getElementById('pager').innerHTML = '';
      return;
    }
    const data = await res.json();
    renderList(data.items);
    renderPager(data);
  }

  function renderList(items) {
    const list = document.getElementById('list');
    if (!items || items.length === 0) {
      list.innerHTML = '<div class="empty">받은 공지가 없습니다.</div>';
      return;
    }
    list.innerHTML = items.map(n => `
      <div class="notice-item ${n.readYn !== 'Y' ? 'unread' : ''}" onclick="openDetail(${n.noticeId})">
        <div class="top">
          <span class="chip tt-${n.targetType}">${TARGET_LABEL[n.targetType] || n.targetType}</span>
          <span class="title">${esc(n.title)}</span>
          ${n.fileCount > 0 ? `<span class="clip">📎${n.fileCount}</span>` : ''}
          ${n.readYn !== 'Y' ? '<span class="badge-unread">안읽음</span>' : ''}
        </div>
        <div class="meta">${esc(n.writerName)} · ${fmtDate(n.createdAt)}</div>
      </div>`).join('');
  }

  function renderPager({ page, totalPages, totalCount }) {
    const pager = document.getElementById('pager');
    if (totalPages <= 0) { pager.innerHTML = ''; return; }
    let html = `<button ${page <= 1 ? 'disabled' : ''} onclick="loadNotices(${page - 1})">‹</button>`;
    const start = Math.max(1, page - 2), end = Math.min(totalPages, start + 4);
    for (let p = start; p <= end; p++) {
      html += `<button class="${p === page ? 'on' : ''}" onclick="loadNotices(${p})">${p}</button>`;
    }
    html += `<button ${page >= totalPages ? 'disabled' : ''} onclick="loadNotices(${page + 1})">›</button>`;
    html += `<span class="total">총 ${totalCount}건</span>`;
    pager.innerHTML = html;
  }

  /* ---------- 상세 (NOT-03) + 자동 읽음 처리 (NOT-08) ---------- */
  async function openDetail(noticeId) {
    const res = await fetch('/api/notices/' + noticeId);
    if (!res.ok) return;
    const n = await res.json();

    document.getElementById('dTitle').textContent = n.title;
    document.getElementById('dMeta').textContent =
      `${n.writerName} · ${fmtDate(n.createdAt)}` + (n.updatedAt ? ` (수정 ${fmtDate(n.updatedAt)})` : '');
    document.getElementById('dContent').textContent = n.content;

    const wrap = document.getElementById('dFilesWrap');
    if (n.files && n.files.length > 0) {
      wrap.style.display = '';
      document.getElementById('dFiles').innerHTML = n.files.map(f => `
        <div class="file-item">
          <a href="/api/notice-files/${f.fileId}/download">📎 ${esc(f.originalName)}</a>
          <span class="size">${fmtSize(f.fileSize)}</span>
        </div>`).join('');
    } else {
      wrap.style.display = 'none';
    }
    document.getElementById('detailModalBack').classList.add('show');

    // 열람 = 읽음 처리 (NOT-08). 성공하면 목록의 안읽음 표시 갱신
    if (n.readYn !== 'Y') {
      if (!getCsrfCookie()) { await fetch('/api/auth/csrf'); }
      await fetch('/api/notices/' + noticeId + '/read', {
        method: 'POST',
        headers: { 'X-XSRF-TOKEN': getCsrfCookie() }
      });
      loadNotices(currentPage);
    }
  }

  /* ---------- 이벤트 바인딩 ---------- */
  document.getElementById('btnSearch').onclick = () => loadNotices(1);
  document.getElementById('btnReset').onclick = () => { fKeyword.value = ''; loadNotices(1); };
  document.getElementById('fKeyword').addEventListener('keydown',
    e => { if (e.key === 'Enter') loadNotices(1); });
  document.getElementById('detailModalBack').addEventListener('click',
    e => { if (e.target.id === 'detailModalBack') closeModal(); });

  loadNotices(1);
</script>
</body>
</html>
