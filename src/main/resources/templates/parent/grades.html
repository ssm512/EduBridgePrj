<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>자녀 성적</title>
    <link rel="stylesheet" href="/css/common.css">
    <style>
        .grade-page { display: grid; gap: 16px; }
        .page-actions { margin-bottom: 16px; }
        .back-btn {
            display: inline-flex;
            align-items: center;
            border: 0;
            border-radius: 6px;
            padding: 8px 12px;
            background: #e5e7eb;
            color: #111827;
            cursor: pointer;
            font-weight: 700;
        }
        .back-btn:hover { background: #dbeafe; color: #1d4ed8; }
        .grade-panel {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 18px;
        }
        .grade-toolbar {
            display: flex;
            align-items: end;
            gap: 12px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }
        .field { display: grid; gap: 6px; min-width: 220px; }
        .field label { font-size: 13px; font-weight: 600; color: #0f2a5f; }
        select {
            height: 36px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            padding: 0 10px;
            background: #fff;
        }
        .child-summary {
            color: #475569;
            font-size: 13px;
            margin-bottom: 12px;
        }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td {
            border-bottom: 1px solid #e5e7eb;
            padding: 10px 8px;
            text-align: left;
            vertical-align: middle;
        }
        th { background: #f8fafc; color: #0f2a5f; font-weight: 600; }
        .empty { color: #64748b; text-align: center; padding: 28px 0; }
        .score-chip { font-weight: 700; color: #1d4ed8; }
        .rank-chip { font-weight: 700; color: #1d4ed8; }
        .chart-wrap {
            height: 300px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 12px;
        }
        .grade-view-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }
        .grade-view-tab {
            border: 0;
            border-radius: 6px;
            padding: 8px 12px;
            background: #e5e7eb;
            color: #111827;
            cursor: pointer;
            font-weight: 700;
        }
        .grade-view-tab.active {
            background: #2563eb;
            color: #fff;
        }
        .grade-view-pane { display: none; }
        .grade-view-pane.active { display: block; }
        .recent-summary {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 10px;
        }
        .summary-box {
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 12px;
            background: #f8fafc;
        }
        .summary-label {
            display: block;
            color: #64748b;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 5px;
        }
        .summary-value {
            color: #0f2a5f;
            font-size: 17px;
            font-weight: 800;
        }
        .summary-value.good { color: #1d4ed8; }
        .summary-value.warn { color: #c2410c; }
        @media (max-width: 720px) {
            .content { padding: 20px 16px; }
            .table-wrap { overflow-x: auto; }
            .recent-summary { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div th:replace="~{fragments/common :: topbar('학부모')}"></div>
<div class="shell">
    <main class="content">
        <div class="page-actions">
            <button type="button" class="back-btn" onclick="location.href='/parentPage'">뒤로가기</button>
        </div>
        <h1>자녀 성적</h1>
        <p class="sub">자녀의 시험 점수와 과목별 성적 추이를 확인합니다.</p>

        <div class="grade-page">
            <section class="grade-panel">
                <div class="grade-toolbar">
                    <div class="field">
                        <label for="childSelect">자녀</label>
                        <select id="childSelect" onchange="onChildChange()"></select>
                    </div>
                    <div class="field">
                        <label for="subjectFilter">과목</label>
                        <select id="subjectFilter" onchange="loadGradePage()">
                            <option value="">전체 과목</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="chartType">차트 유형</label>
                        <select id="chartType" onchange="loadGradePage()">
                            <option value="line">선형 차트</option>
                            <option value="bar">막대 차트</option>
                            <option value="area">영역 차트</option>
                        </select>
                    </div>
                </div>
                <div id="childSummary" class="child-summary"></div>
                <div class="grade-view-tabs">
                    <button type="button" class="grade-view-tab active" data-grade-view-tab="chart" onclick="showGradeViewTab('chart')">차트</button>
                    <button type="button" class="grade-view-tab" data-grade-view-tab="summary" onclick="showGradeViewTab('summary')">최근 변화</button>
                </div>
                <div id="chartPane" class="grade-view-pane active">
                    <div class="chart-wrap">
                        <canvas id="trendChart"></canvas>
                    </div>
                </div>
                <div id="summaryPane" class="grade-view-pane">
                    <div id="recentSummary" class="recent-summary"></div>
                </div>
            </section>

            <section class="grade-panel">
                <h2>성적 목록</h2>
                <div class="table-wrap">
                    <table>
                        <thead>
                        <tr>
                            <th>시험명</th>
                            <th>반</th>
                            <th>과목</th>
                            <th>시험일시</th>
                            <th>점수</th>
                            <th>석차</th>
                            <th>선생님 한 줄</th>
                        </tr>
                        </thead>
                        <tbody id="gradeRows">
                        <tr><td class="empty" colspan="7">자녀를 선택하면 성적이 표시됩니다.</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>
</div>
<script src="/js/chart.umd.min.js"></script>
<script th:replace="~{fragments/common :: logoutScript}"></script>
<script>
    let children = [];
    let trendChart;

    document.addEventListener('DOMContentLoaded', async () => {
        await loadChildren();
    });

    async function fetchJson(url) {
        const response = await fetch(url, { headers: { 'Accept': 'application/json' } });
        if (!response.ok) {
            throw new Error(await response.text());
        }
        return response.json();
    }

    async function loadChildren() {
        children = await fetchJson('/api/grades/children');
        const select = document.getElementById('childSelect');
        if (!children.length) {
            select.innerHTML = '<option value="">연결된 자녀가 없습니다</option>';
            renderEmpty('연결된 자녀가 없습니다.');
            return;
        }
        select.innerHTML = children.map(child => `
            <option value="${child.student_id}">${escapeHtml(child.student_name || '')}${child.student_no ? ` / ${escapeHtml(child.student_no)}` : ''}</option>
        `).join('');
        await onChildChange();
    }

    async function onChildChange() {
        await loadSubjects();
        await loadGradePage();
        renderChildSummary();
    }

    async function loadSubjects() {
        const studentId = document.getElementById('childSelect').value;
        const select = document.getElementById('subjectFilter');
        select.innerHTML = '<option value="">전체 과목</option>';
        if (!studentId) return;
        const subjects = await fetchJson(`/api/grades/children/${studentId}/subjects`);
        subjects.forEach(item => {
            const option = document.createElement('option');
            option.value = item.subject;
            option.textContent = item.subject;
            select.appendChild(option);
        });
    }

    async function loadGradePage() {
        const studentId = document.getElementById('childSelect').value;
        if (!studentId) return;
        const subject = document.getElementById('subjectFilter').value;
        const query = subject ? `?subject=${encodeURIComponent(subject)}` : '';
        const [grades, trends] = await Promise.all([
            fetchJson(`/api/grades/children/${studentId}${query}`),
            fetchJson(`/api/grades/children/${studentId}/trends${query}`)
        ]);
        renderGrades(grades);
        renderRecentSummary(grades);
        renderChart(trends);
    }

    function renderChildSummary() {
        const studentId = document.getElementById('childSelect').value;
        const child = children.find(item => String(item.student_id) === String(studentId));
        document.getElementById('childSummary').textContent = child
            ? `${child.student_name || ''}${child.school_name ? ` · ${child.school_name}` : ''}${child.grade_level ? ` · ${child.grade_level}` : ''}`
            : '';
    }

    function renderGrades(grades) {
        const tbody = document.getElementById('gradeRows');
        if (!grades.length) {
            renderEmpty('조회된 성적이 없습니다.');
            return;
        }
        tbody.innerHTML = grades.map(grade => `
            <tr>
                <td>${escapeHtml(grade.exam_name || '')}</td>
                <td>${escapeHtml(grade.class_name || '')}</td>
                <td>${escapeHtml(grade.subject || '')}</td>
                <td>${formatKoreanDateTime(grade.exam_date)}</td>
                <td><span class="score-chip">${formatNumber(grade.score)}점</span> / 총점 ${formatNumber(grade.total_score)}점</td>
                <td>${formatRank(grade)}</td>
                <td>${escapeHtml(grade.comment || '')}</td>
            </tr>
        `).join('');
    }

    function renderEmpty(message) {
        document.getElementById('gradeRows').innerHTML = `<tr><td class="empty" colspan="7">${message}</td></tr>`;
        document.getElementById('recentSummary').innerHTML = `<div class="empty">${message}</div>`;
    }

    function showGradeViewTab(tabName) {
        document.querySelectorAll('[data-grade-view-tab]').forEach(button => {
            button.classList.toggle('active', button.dataset.gradeViewTab === tabName);
        });
        document.getElementById('chartPane').classList.toggle('active', tabName === 'chart');
        document.getElementById('summaryPane').classList.toggle('active', tabName === 'summary');
    }

    function renderRecentSummary(grades) {
        const target = document.getElementById('recentSummary');
        if (!grades.length) {
            target.innerHTML = '<div class="empty">최근 변화 요약을 표시할 성적이 없습니다.</div>';
            return;
        }

        const sorted = [...grades].sort((a, b) => new Date(a.exam_date) - new Date(b.exam_date));
        const latest = sorted[sorted.length - 1];
        const previous = sorted.length > 1 ? sorted[sorted.length - 2] : null;
        const latestRate = achievementRate(latest);
        const previousRate = previous ? achievementRate(previous) : null;
        const change = previous ? latestRate - previousRate : null;
        const best = sorted.reduce((max, row) => achievementRate(row) > achievementRate(max) ? row : max, sorted[0]);
        const lowest = sorted.reduce((min, row) => achievementRate(row) < achievementRate(min) ? row : min, sorted[0]);

        target.innerHTML = `
            ${summaryBox('최근 시험', `${escapeHtml(latest.exam_name || '-')} · ${formatNumber(latest.score)}점`, 'good')}
            ${summaryBox('이전 시험 대비', previous ? formatChange(change) : '비교할 이전 성적 없음', change >= 0 ? 'good' : 'warn')}
            ${summaryBox('가장 높았던 시험', `${escapeHtml(best.exam_name || '-')} · ${formatNumber(best.score)}점`, 'good')}
            ${summaryBox('보완이 필요한 시험', `${escapeHtml(lowest.exam_name || '-')} · ${formatNumber(lowest.score)}점`, 'warn')}
        `;
    }

    function summaryBox(label, value, tone = '') {
        return `
            <div class="summary-box">
                <span class="summary-label">${label}</span>
                <span class="summary-value ${tone}">${value}</span>
            </div>
        `;
    }

    function achievementRate(grade) {
        const score = Number(grade?.score || 0);
        const total = Number(grade?.total_score || 100) || 100;
        return (score / total) * 100;
    }

    function formatChange(change) {
        if (change === 0) {
            return '변화 없음';
        }
        return `${formatNumber(Math.abs(change))}% ${change > 0 ? '상승' : '하락'}`;
    }

    function renderChart(trends) {
        const sorted = [...trends].sort((a, b) => new Date(a.exam_date) - new Date(b.exam_date));
        const labels = sorted.map(item => formatShortDate(item.exam_date));
        const scores = sorted.map(item => Number(item.score || 0));
        const chartType = document.getElementById('chartType').value;
        const isBarChart = chartType === 'bar';
        const isAreaChart = chartType === 'area';
        const ctx = document.getElementById('trendChart');
        if (trendChart) {
            trendChart.destroy();
        }
        trendChart = new Chart(ctx, {
            type: isBarChart ? 'bar' : 'line',
            data: {
                labels,
                datasets: [{
                    label: '점수',
                    data: scores,
                    borderColor: '#2563eb',
                    backgroundColor: isBarChart ? 'rgba(37, 99, 235, .72)' : 'rgba(37, 99, 235, .12)',
                    pointBackgroundColor: '#2563eb',
                    pointBorderColor: '#ffffff',
                    pointBorderWidth: 2,
                    tension: .25,
                    fill: isAreaChart
                }]
            },
            options: {
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: { y: { beginAtZero: true, suggestedMax: 100 } }
            }
        });
    }

    function formatKoreanDateTime(value) {
        if (!value) return '-';
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return '-';
        return `${date.getFullYear()}년 ${date.getMonth() + 1}월 ${date.getDate()}일 ${String(date.getHours()).padStart(2, '0')}시 ${String(date.getMinutes()).padStart(2, '0')}분`;
    }

    function formatShortDate(value) {
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return '-';
        return `${date.getMonth() + 1}/${date.getDate()}`;
    }

    function formatNumber(value) {
        if (value === null || value === undefined || value === '') return '-';
        return Number(value).toLocaleString('ko-KR', { maximumFractionDigits: 1 });
    }

    function formatRank(grade) {
        if (!grade.rank_no) return '-';
        const rank = `<span class="rank-chip">${formatNumber(grade.rank_no)}등</span>`;
        return grade.rank_total ? `${rank} / 총 ${formatNumber(grade.rank_total)}명` : rank;
    }

    function escapeHtml(value) {
        return String(value)
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#039;');
    }
</script>
</body>
</html>
