<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8">
  <title>EduBridge 학부모</title>
  <link rel="stylesheet" href="/css/common.css">
</head>
<body>
<div th:replace="~{fragments/common :: topbar('학부모')}"></div>
<div class="shell">
  <main class="content">
    <h1>학부모 홈</h1>
    <p class="sub">자녀의 출석·성적·회비·상담 내용이 여기에 표시됩니다. (담당자 구현 예정)</p>
    <div class="cards">
      <div class="card"><div class="card-title">자녀 출석</div><div class="card-desc">자녀 출석 현황</div></div>
      <div class="card"><div class="card-title">자녀 성적</div><div class="card-desc">시험 점수·추이</div></div>
      <div class="card"><div class="card-title">회비 납부</div><div class="card-desc">청구·납부 내역</div></div>
      <div class="card"><div class="card-title">상담 신청</div><div class="card-desc">상담 기록·신청</div></div>
    </div>
  </main>
</div>
<script th:replace="~{fragments/common :: logoutScript}"></script>
</body>
</html>
