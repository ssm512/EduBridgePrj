<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8">
  <title>EduBridge 학부모</title>
  <link rel="stylesheet" href="/css/common.css">
</head>
<body>
<div th:replace="~{fragments/common :: topbar('학부모')}"></div>
<div class="shell">
  <main class="content">
    <h1>학부모 홈</h1>
    <p class="sub">자녀의 출석·성적·회비·상담 내용이 여기에 표시됩니다.</p>
    <div class="cards">
      <a class="card" href="/parent/attendance" style="text-decoration:none;color:inherit">
        <div class="card-title">자녀 출석</div><div class="card-desc">자녀 출석 현황</div>
      </a>
      <a class="card" href="/parentPage/grades">
        <div class="card-title">자녀 성적</div><div class="card-desc">시험 점수·추이</div>
      </a>
      <div class="card"><div class="card-title">회비 납부</div><div class="card-desc">청구·납부 내역</div></div>
      <a class="card" href="/parentPage/counseling">
        <div class="card-title">상담 확인</div><div class="card-desc">공유된 자녀 상담 내용</div>
      </a>
      <!-- [추가] 공지 조회 화면 연결 (NOT-02~03, notice 도메인) -->
      <a class="card" href="/parentPage/notices" style="text-decoration:none;color:inherit">
        <div class="card-title">공지사항</div><div class="card-desc">받은 공지 확인</div>
      </a>
    </div>
  </main>
</div>
<script th:replace="~{fragments/common :: logoutScript}"></script>
</body>
</html>
