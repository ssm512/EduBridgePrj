<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>EduBridge 로그인</title>
<style>
  body { font-family: sans-serif; max-width: 420px; margin: 40px auto; }
  h2 { text-align: center; }
  .field { margin-bottom: 12px; }
  label { display: block; margin-bottom: 4px; font-size: 14px; }
  input { width: 100%; padding: 8px; box-sizing: border-box; }
  button { width: 100%; padding: 10px; margin-top: 8px; cursor: pointer; }
  .link { text-align: center; margin-top: 12px; font-size: 14px; }
  #afterLogin button { width: auto; padding: 6px 12px; margin-right: 4px; }
  pre { background: #f4f4f4; padding: 12px; white-space: pre-wrap; word-break: break-all; }
</style>
</head>
<body>
<h2>로그인</h2>

<div id="loginForm">
  <div class="field">
    <label for="loginId">아이디</label>
    <input id="loginId" placeholder="아이디">
  </div>
  <div class="field">
    <label for="password">비밀번호</label>
    <input id="password" type="password" placeholder="비밀번호">
  </div>
  <button onclick="login()">로그인</button>
  <div class="link"><a href="/signInForm.html">계정이 없으신가요? 회원가입</a></div>
</div>
<div class="msg"></div>

<script>
// Access Token은 메모리에만 보관 (데모용)
let accessToken = null;
let refreshToken = null;

// 쿠키에서 XSRF-TOKEN 값 읽기
function getCsrfCookie() {
  const m = document.cookie.match(/(?:^|;\s*)XSRF-TOKEN=([^;]*)/);
  return m ? decodeURIComponent(m[1]) : null;
}

// CSRF 쿠키가 없으면 발급받기
async function ensureCsrf() {
  if (!getCsrfCookie()) {
    await fetch('/api/auth/csrf');
  }
  return getCsrfCookie();
}

// 공통 요청: POST면 X-XSRF-TOKEN, 토큰 있으면 Bearer 헤더 추가
async function api(url, method = 'GET', body = null) {
  const headers = { 'Content-Type': 'application/json' };
  if (method !== 'GET') {
    headers['X-XSRF-TOKEN'] = await ensureCsrf();
  }
  if (accessToken) {
    headers['Authorization'] = 'Bearer ' + accessToken;
  }
  const res = await fetch(url, {
    method, headers,
    body: body ? JSON.stringify(body) : null
  });
  const data = await res.json().catch(() => ({}));
  return { res, data };
}


async function login() {
  const { res, data } = await api('/api/auth/login', 'POST', {
    loginId: document.getElementById('loginId').value,
    password: document.getElementById('password').value
  });
  if (res.ok) {
    // 서버가 ACCESS_TOKEN 쿠키(httpOnly)를 내려줬으므로 페이지 이동만 하면 된다.
    // 실제 어느 역할 화면으로 갈지는 서버("/home")가 권한을 보고 결정한다.
    window.location.href = '/home';
  } else {
    document.querySelector('.msg').innerHTML = JSON.stringify(data.message);
  }
}



</script>

</body>
</html>
