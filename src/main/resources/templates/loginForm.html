<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>EduBridge 로그인</title>
<style>
  body { font-family: sans-serif; max-width: 420px; margin: 40px auto; }
  h2 { text-align: center; }
  .field { margin-bottom: 12px; }
  label { display: block; margin-bottom: 4px; font-size: 14px; }
  input { width: 100%; padding: 8px; box-sizing: border-box; }
  button { width: 100%; padding: 10px; margin-top: 8px; cursor: pointer; }
  .link { text-align: center; margin-top: 12px; font-size: 14px; }
  #afterLogin button { width: auto; padding: 6px 12px; margin-right: 4px; }
  .reset-panel { margin-top: 20px; padding: 14px; border: 1px solid #ddd; border-radius: 4px; background: #fafafa; }
  .reset-desc { font-size: 13px; color: #666; margin: 6px 0 12px; }
  pre { background: #f4f4f4; padding: 12px; white-space: pre-wrap; word-break: break-all; }
</style>
</head>
<body>
<h2>로그인</h2>

<div id="loginForm">
  <div class="field">
    <label for="loginId">아이디</label>
    <input id="loginId" placeholder="아이디">
  </div>
  <div class="field">
    <label for="password">비밀번호</label>
    <input id="password" type="password" placeholder="비밀번호">
  </div>
  <button onclick="login()">로그인</button>
  <div class="link">
    <a href="/signInForm.html">계정이 없으신가요? 회원가입</a>
    &nbsp;|&nbsp;
    <a href="#" onclick="toggleResetPanel(); return false;">비밀번호 재설정</a>
  </div>
</div>

<!-- 비밀번호 재설정: 아이디+이메일 일치 시 임시 비밀번호를 이메일로 발송 -->
<div id="resetPanel" class="reset-panel" hidden>
  <strong>비밀번호 재설정</strong>
  <p class="reset-desc">가입 시 등록한 아이디와 이메일이 일치하면 임시 비밀번호를 이메일로 보내드립니다.</p>
  <div class="field">
    <label for="resetLoginId">아이디</label>
    <input id="resetLoginId" placeholder="아이디">
  </div>
  <div class="field">
    <label for="resetEmail">이메일</label>
    <input id="resetEmail" type="email" placeholder="가입 시 등록한 이메일">
  </div>
  <button onclick="requestPasswordReset()">임시 비밀번호 발송</button>
</div>
<div class="msg"></div>

<script>
// Access Token은 메모리에만 보관 (데모용)
let accessToken = null;
let refreshToken = null;

// 쿠키에서 XSRF-TOKEN 값 읽기
function getCsrfCookie() {
  const m = document.cookie.match(/(?:^|;\s*)XSRF-TOKEN=([^;]*)/);
  return m ? decodeURIComponent(m[1]) : null;
}

// CSRF 쿠키가 없으면 발급받기
async function ensureCsrf() {
  if (!getCsrfCookie()) {
    await fetch('/api/auth/csrf');
  }
  return getCsrfCookie();
}

// 공통 요청: POST면 X-XSRF-TOKEN, 토큰 있으면 Bearer 헤더 추가
async function api(url, method = 'GET', body = null) {
  const headers = { 'Content-Type': 'application/json' };
  if (method !== 'GET') {
    headers['X-XSRF-TOKEN'] = await ensureCsrf();
  }
  if (accessToken) {
    headers['Authorization'] = 'Bearer ' + accessToken;
  }
  const res = await fetch(url, {
    method, headers,
    body: body ? JSON.stringify(body) : null
  });
  const data = await res.json().catch(() => ({}));
  return { res, data };
}


// 비밀번호 재설정 패널 표시/숨김
function toggleResetPanel() {
  const panel = document.getElementById('resetPanel');
  panel.hidden = !panel.hidden;
}

// 셀프 비밀번호 재설정: 아이디+이메일 일치 시 임시 비밀번호 발송
// (개발 단계에서는 서버 콘솔에 임시 비밀번호가 출력된다)
async function requestPasswordReset() {
  const loginId = document.getElementById('resetLoginId').value.trim();
  const email = document.getElementById('resetEmail').value.trim();
  const msg = document.querySelector('.msg');

  if (!loginId || !email) {
    msg.textContent = '아이디와 이메일을 모두 입력해 주세요.';
    return;
  }

  const { res, data } = await api('/api/auth/password-reset', 'POST', { loginId, email });
  if (res.ok) {
    alert(data.message);
    document.getElementById('resetPanel').hidden = true;
    msg.textContent = '';
  } else {
    msg.textContent = typeof data.message === 'string'
        ? data.message : JSON.stringify(data.message);
  }
}

async function login() {
  const { res, data } = await api('/api/auth/login', 'POST', {
    loginId: document.getElementById('loginId').value,
    password: document.getElementById('password').value
  });
  if (res.ok) {
    // 관리자가 비밀번호를 초기화한 계정이면 변경 페이지로 강제 이동
    if (data.user && data.user.mustChangePassword) {
      window.location.href = '/passwordChangeForm.html?forced=1';
      return;
    }
    // 서버가 ACCESS_TOKEN 쿠키(httpOnly)를 내려줬으므로 페이지 이동만 하면 된다.
    // 실제 어느 역할 화면으로 갈지는 서버("/home")가 권한을 보고 결정한다.
    window.location.href = '/home';
  } else {
    document.querySelector('.msg').innerHTML = JSON.stringify(data.message);
  }
}



</script>

</body>
</html>
