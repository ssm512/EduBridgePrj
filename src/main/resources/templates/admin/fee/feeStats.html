<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8">
  <title th:text="${@branding.name} + ' · ' + ${title}">EduBridge</title>
  <link rel="stylesheet" href="/css/common.css">

  <!-- 회비 통계 페이지 전용 스타일 (팀 규칙: 개인 구간은 html 내 style 태그)
       사용 중인 클래스:
       .tabs / .tab       : 상단 탭(회비 목록/통계·매출/할인정책관리 3페이지 이동, admin/attendance 탭 디자인 재사용)
       .stats-toolbar     : 월 선택 + 조회 영역
       .stats-cards       : 요약 카드 3개 가로 배치 컨테이너
       .stats-card        : 요약 카드 (총액/납부액/미납액)
       .stats-card-label  : 카드 상단 라벨
       .stats-card-value  : 카드 금액 (큰 글씨)
       .stats-charts      : 차트 2개 가로 배치 컨테이너
       .stats-chart-box   : 차트 하나를 감싸는 박스 (제목 + canvas)
       ※ 차트 자체 색상은 CSS 가 아니라 아래 JS 의 CHART_COLORS 에서 변경
  -->
  <style>
    /* ===== 회비 통계 화면 ===== */
    /* 상단 탭 (회비 목록 / 통계·매출 / 할인정책관리) - admin/attendance 페이지의 .tabs/.tab 디자인 재사용.
       거기는 같은 페이지 안에서 JS로 섹션을 전환하지만 여긴 실제로 다른 페이지로 이동하는 링크라 a 태그로 구현 */
    .tabs { display: flex; gap: 4px; border-bottom: 2px solid #e5e7eb; margin-bottom: 16px; }
    .tabs .tab {
      display: inline-block; padding: 9px 18px; background: none; cursor: pointer; font-size: 14px;
      font-weight: 600; color: #94a3b8; border-bottom: 2px solid transparent; margin-bottom: -2px;
    }
    .tabs .tab:hover { color: #475569; }
    .tabs .tab.active { color: #1e3a8a; border-bottom-color: #1e3a8a; }

    .stats-toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 20px; }
    .stats-toolbar input[type="month"] {
      height: 36px; padding: 0 10px; border: 1px solid #d1d5db; border-radius: 6px;
      font-size: 14px; background: #fff;
    }
    .stats-toolbar button {
      height: 36px; padding: 0 16px; border: none; border-radius: 6px;
      font-size: 14px; cursor: pointer; background: #1e3a8a; color: #fff;
    }
    .stats-toolbar button:hover { background: #1d4ed8; }

    .stats-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px; }
    .stats-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 18px; }
    .stats-card-label { font-size: 13px; color: #6b7280; margin-bottom: 6px; }
    .stats-card-value { font-size: 22px; font-weight: 700; color: #0f2a5f; }
    #cardUnpaid { color: #dc2626; }

    .stats-charts { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .stats-chart-box { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 18px; }
    .stats-chart-box h3 { margin: 0 0 12px; font-size: 14px; color: #374151; }
  </style>
</head>
<body>

<div th:replace="~{fragments/common :: topbar(${title})}"></div>

<div class="shell">
  <nav class="sidebar">
    <a href="/admin/dashboard">대시보드</a>
    <a href="/admin/members">회원관리</a>
    <div class="group-label">반 / 수강</div>
    <a href="/admin/classes">반관리</a>
    <a href="/admin/enrollments">수강관리</a>
    <div class="group-label">학생</div>
    <a href="/admin/attendance">출석관리</a>
    <a href="/admin/fees">회비관리</a>
    <a href="/admin/grades">성적관리</a>
    <div class="group-label">소통</div>
    <a href="/admin/notices">공지관리</a>
    <a href="/admin/counseling">상담관리</a>
    <div class="group-label">운영</div>
    <a href="/admin/ai">AI 리포트</a>
    <a href="/admin/notifications">알림이력</a>
    <a href="/admin/logs">활동로그</a>
    <a href="/admin/settings">시스템설정</a>
  </nav>

  <main class="content">
    <h1>매출/통계</h1>
    <p class="sub">월별 회비 총액·납부액·미납액과 상태별 건수 통계 (SCR-W-12)</p>

    <!-- 상단 탭: 회비 목록 / 통계·매출 / 할인정책관리 -->
    <div class="tabs">
      <a class="tab" href="/admin/fees">회비 목록</a>
      <a class="tab active" href="/admin/fees/statistics">통계/매출</a>
      <a class="tab" href="/admin/discount-policies">할인정책관리</a>
    </div>

    <!-- 월 선택 + 조회. TODO: 반 필터는 classroom 파트 목록 API 완성 후 select 추가 (API 는 classId 이미 지원) -->
    <div class="stats-toolbar">
      <input type="month" id="statsMonth">
      <button type="button" onclick="loadStats()">조회</button>
    </div>

    <!-- 요약 카드: 기준 월의 총액/납부액/미납액 -->
    <div class="stats-cards">
      <div class="stats-card">
        <div class="stats-card-label">총액</div>
        <div class="stats-card-value" id="cardTotal">-</div>
      </div>
      <div class="stats-card">
        <div class="stats-card-label">납부액</div>
        <div class="stats-card-value" id="cardPaid">-</div>
      </div>
      <div class="stats-card">
        <div class="stats-card-label">미납액</div>
        <div class="stats-card-value" id="cardUnpaid">-</div>
      </div>
    </div>

    <!-- 차트: 월별 매출(막대) + 상태별 건수 추이(선) -->
    <div class="stats-charts">
      <div class="stats-chart-box">
        <h3>월별 매출</h3>
        <canvas id="revenueChart"></canvas>
      </div>
      <div class="stats-chart-box">
        <h3>상태별 건수 추이</h3>
        <canvas id="statusChart"></canvas>
      </div>
    </div>
  </main>
</div>

<script th:replace="~{fragments/common :: logoutScript}"></script>

<!-- Chart.js: 외부 CDN 의존 (팀 공유 완료 전 임시, 문제 시 로컬 다운로드로 교체 가능) -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

<script>
  // 차트 색상 (CSS 로는 canvas 내부를 못 바꾸므로 여기서 관리)
  const CHART_COLORS = {
    revenue:   '#0f766e',   // 매출 막대
    paid:      '#0f766e',   // 납부완료 선
    unpaid:    '#dc2626',   // 미납 선
    scheduled: '#94a3b8'    // 예정 선
  };

  // Chart.js 인스턴스 보관: 재조회 시 destroy 안 하면 같은 canvas 에 차트가 겹쳐 그려짐
  let revenueChart = null;
  let statusChart = null;

  function formatWon(value) {
    return Number(value).toLocaleString('ko-KR') + '원';
  }

  async function loadStats() {
    const month = document.getElementById('statsMonth').value;
    const query = month ? '?billingMonth=' + month : '';   // 미선택이면 서버가 이번 달로 처리

    const res = await fetch('/api/fees/statistics' + query);
    if (!res.ok) {
      const error = await res.json();
      alert('통계 조회 실패: ' + (error.message || res.status));
      return;
    }
    const data = await res.json();

    // 조회 기준 월을 입력창에 반영 (미선택으로 조회했을 때)
    document.getElementById('statsMonth').value = data.billingMonth;

    // 요약 카드
    document.getElementById('cardTotal').textContent  = formatWon(data.summary.totalAmount);
    document.getElementById('cardPaid').textContent   = formatWon(data.summary.paidAmount);
    document.getElementById('cardUnpaid').textContent = formatWon(data.summary.unpaidAmount);

    const labels = data.monthlyStats.map(s => s.billingMonth);

    // 월별 매출 (납부액 기준 - TODO(팀 확인): 매출 기준 정의 필요, 회의 안건)
    if (revenueChart) revenueChart.destroy();
    revenueChart = new Chart(document.getElementById('revenueChart'), {
      type: 'bar',
      data: {
        labels: labels,
        datasets: [{
          label: '매출(납부액)',
          data: data.monthlyStats.map(s => s.paidAmount),
          backgroundColor: CHART_COLORS.revenue
        }]
      },
      options: {
        scales: { y: { beginAtZero: true } }
      }
    });

    // 상태별 건수 추이
    if (statusChart) statusChart.destroy();
    statusChart = new Chart(document.getElementById('statusChart'), {
      type: 'line',
      data: {
        labels: labels,
        datasets: [
          { label: '납부완료', data: data.monthlyStats.map(s => s.paidCount),      borderColor: CHART_COLORS.paid,      backgroundColor: CHART_COLORS.paid },
          { label: '미납',     data: data.monthlyStats.map(s => s.unpaidCount),    borderColor: CHART_COLORS.unpaid,    backgroundColor: CHART_COLORS.unpaid },
          { label: '예정',     data: data.monthlyStats.map(s => s.scheduledCount), borderColor: CHART_COLORS.scheduled, backgroundColor: CHART_COLORS.scheduled }
        ]
      },
      options: {
        scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }   // 건수라 정수 눈금
      }
    });
  }

  // 첫 진입 시 이번 달 기준으로 자동 조회
  loadStats();
</script>
</body>
</html>
