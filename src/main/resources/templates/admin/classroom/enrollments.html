<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8">
  <title>EduBridge · 수강관리</title>
  <link rel="stylesheet" href="/css/common.css">
  <style>
    /* ===== 수강관리 전용 스타일 (classes.html과 동일 패턴) ===== */
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
    .toolbar select, .toolbar input {
      height: 36px; padding: 0 10px; border: 1px solid #d1d5db; border-radius: 6px;
      font-size: 14px; background: #fff;
    }
    .toolbar input[type="text"] { width: 200px; }
    .toolbar .spacer { flex: 1; }
    .btn {
      height: 36px; padding: 0 16px; border: none; border-radius: 6px;
      font-size: 14px; cursor: pointer; background: #1e3a8a; color: #fff;
    }
    .btn:hover { background: #1d4ed8; }
    .btn.secondary { background: #fff; color: #374151; border: 1px solid #d1d5db; }
    .btn.secondary:hover { background: #f3f4f6; }
    .btn.danger { background: #dc2626; }
    .btn.danger:hover { background: #b91c1c; }

    .table-wrap { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; overflow: hidden; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    thead th {
      text-align: left; background: #f9fafb; color: #6b7280; font-weight: 600;
      padding: 10px 14px; border-bottom: 1px solid #e5e7eb; font-size: 13px;
    }
    tbody td { padding: 10px 14px; border-bottom: 1px solid #f3f4f6; }
    tbody tr:last-child td { border-bottom: none; }
    .empty { text-align: center; color: #9ca3af; padding: 32px !important; }

    .chip { display: inline-block; font-size: 12px; padding: 2px 10px; border-radius: 999px; }
    .st-ACTIVE { background: #dcfce7; color: #166534; }
    .st-ENDED  { background: #f3f4f6; color: #6b7280; }
    .end-link { color: #dc2626; font-size: 13px; cursor: pointer; }

    .pager { display: flex; gap: 6px; justify-content: center; align-items: center; margin-top: 16px; }
    .pager button {
      min-width: 34px; height: 34px; border: 1px solid #d1d5db; background: #fff;
      border-radius: 6px; cursor: pointer; font-size: 13px;
    }
    .pager button.on { background: #1e3a8a; color: #fff; border-color: #1e3a8a; }
    .pager button:disabled { color: #d1d5db; cursor: default; }
    .pager .total { font-size: 13px; color: #6b7280; margin-left: 10px; }

    .modal-back {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4);
      align-items: center; justify-content: center; z-index: 50;
    }
    .modal-back.show { display: flex; }
    .modal {
      background: #fff; border-radius: 12px; width: 420px; max-width: calc(100vw - 40px);
      padding: 24px;
    }
    .modal h2 { margin: 0 0 18px; font-size: 17px; }
    .modal .row { margin-bottom: 12px; }
    .modal label { display: block; font-size: 13px; color: #6b7280; margin-bottom: 4px; }
    .modal input, .modal select {
      width: 100%; height: 38px; padding: 0 10px; border: 1px solid #d1d5db;
      border-radius: 6px; font-size: 14px;
    }
    .modal .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
    .modal .err { color: #dc2626; font-size: 13px; min-height: 18px; margin-top: 8px; }
    .modal .info { font-size: 13px; color: #374151; line-height: 1.8; margin-bottom: 8px; }
  </style>
</head>
<body>

<div th:replace="~{fragments/common :: topbar('수강관리')}"></div>

<div class="shell">
  <nav class="sidebar">
    <a href="/admin/dashboard">대시보드</a>
    <a href="/admin/members">회원관리</a>
    <div class="group-label">반 / 수강</div>
    <a href="/admin/classes">반관리</a>
    <a href="/admin/enrollments">수강관리</a>
    <div class="group-label">학생</div>
    <a href="/admin/attendance">출석관리</a>
    <a href="/admin/fees">회비관리</a>
    <a href="/admin/grades">성적관리</a>
    <div class="group-label">소통</div>
    <a href="/admin/notices">공지관리</a>
    <a href="/admin/counseling">상담관리</a>
    <div class="group-label">운영</div>
    <a href="/admin/ai">AI 리포트</a>
    <a href="/admin/notifications">알림이력</a>
    <a href="/admin/logs">활동로그</a>
    <a href="/admin/settings">시스템설정</a>
  </nav>

  <main class="content">
    <h1>수강관리</h1>
    <p class="sub">학생의 반 수강을 등록하고, 수강 종료를 처리합니다. (ENR-01 ~ ENR-02)</p>

    <!-- 검색 툴바 : GET /enrollments 파라미터와 1:1 대응 -->
    <div class="toolbar">
      <select id="fClass"><option value="">반 전체</option></select>
      <select id="fStatus">
        <option value="">상태 전체</option>
        <option value="ACTIVE">수강중</option>
        <option value="ENDED">종료</option>
      </select>
      <input type="text" id="fKeyword" placeholder="학생 이름 / 학번 검색">
      <button class="btn" id="btnSearch">검색</button>
      <button class="btn secondary" id="btnReset">초기화</button>
      <div class="spacer"></div>
      <button class="btn" id="btnCreate">+ 수강 등록</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
        <tr>
          <th>ID</th><th>학생</th><th>학번</th><th>반</th><th>과목</th>
          <th>수강기간</th><th>상태</th><th></th>
        </tr>
        </thead>
        <tbody id="tbody">
        <tr><td class="empty" colspan="8">불러오는 중…</td></tr>
        </tbody>
      </table>
    </div>

    <div class="pager" id="pager"></div>
  </main>
</div>

<!-- 수강 등록 모달 : POST /enrollments (ENR-01) -->
<div class="modal-back" id="createModalBack">
  <div class="modal">
    <h2>수강 등록</h2>
    <div class="row"><label>학생 *</label><select id="cStudent"></select></div>
    <div class="row"><label>반 *</label><select id="cClass"></select></div>
    <div class="row"><label>수강 시작일 (생략 시 오늘)</label><input id="cEnrollDate" type="date"></div>
    <div class="err" id="cErr"></div>
    <div class="actions">
      <button class="btn secondary" onclick="closeModal('createModalBack')">취소</button>
      <button class="btn" id="btnCreateSave">등록</button>
    </div>
  </div>
</div>

<!-- 수강 해제 모달 : PUT /enrollments/{id}/end (ENR-02) -->
<div class="modal-back" id="endModalBack">
  <div class="modal">
    <h2>수강 해제</h2>
    <div class="info" id="endInfo"></div>
    <div class="row"><label>수강 종료일 (생략 시 오늘)</label><input id="eEndDate" type="date"></div>
    <div class="err" id="eErr"></div>
    <div class="actions">
      <button class="btn secondary" onclick="closeModal('endModalBack')">취소</button>
      <button class="btn danger" id="btnEndSave">수강 해제</button>
    </div>
  </div>
</div>

<script th:replace="~{fragments/common :: logoutScript}"></script>
<script>
  /* ===== 수강관리 화면 로직 =====
     - 목록: GET /enrollments?classId=&statusCode=&keyword=&page=&size=
     - 등록: POST /enrollments                        (ENR-01)
     - 해제: PUT /enrollments/{enrollmentId}/end      (ENR-02, 상태변경+종료일)
     학생/반 선택은 GET /students, GET /classes 목록으로 드롭다운 구성 */

  const STATUS_LABEL = { ACTIVE: '수강중', ENDED: '종료' };
  const PAGE_SIZE = 10;

  let currentPage = 1;
  let endingEnrollmentId = null;

  /* ---------- 공통 유틸 ---------- */
  function esc(s) {
    return s == null ? '' : String(s).replace(/[&<>"']/g,
      c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  }
  async function writeFetch(url, method, body) {
    if (!getCsrfCookie()) { await fetch('/api/auth/csrf'); }
    return fetch(url, {
      method,
      headers: { 'Content-Type': 'application/json', 'X-XSRF-TOKEN': getCsrfCookie() },
      body: JSON.stringify(body)
    });
  }
  function closeModal(id) { document.getElementById(id).classList.remove('show'); }
  function openModalById(id) { document.getElementById(id).classList.add('show'); }

  /* ---------- 드롭다운 (반 필터/등록 모달 공용) ---------- */
  async function loadClassOptions() {
    const res = await fetch('/api/classes?page=1&size=100');
    if (!res.ok) return;
    const data = await res.json();
    document.getElementById('fClass').innerHTML = '<option value="">반 전체</option>' +
      data.items.map(c => `<option value="${c.classId}">${esc(c.className)}</option>`).join('');
    // 등록 모달에는 운영중(ACTIVE)인 반만
    document.getElementById('cClass').innerHTML =
      data.items.filter(c => c.statusCode === 'ACTIVE')
        .map(c => `<option value="${c.classId}">${esc(c.className)} (${esc(c.subject) || '-'})</option>`).join('');
  }

  async function loadStudentOptions() {
    const res = await fetch('/api/students?page=1&size=100');
    if (!res.ok) return;
    const data = await res.json();
    // 등록 모달에는 재원중(ACTIVE)인 학생만 (탈퇴/휴원 학생 신규 등록 방지)
    document.getElementById('cStudent').innerHTML =
      data.items.filter(s => s.statusCode === 'ACTIVE').map(s =>
        `<option value="${s.studentId}">${esc(s.name)} (${esc(s.studentNo) || '학번없음'})</option>`).join('');
  }

  /* ---------- 목록 조회 ---------- */
  async function loadEnrollments(page = 1) {
    currentPage = page;
    const params = new URLSearchParams({ page, size: PAGE_SIZE });
    const classId = document.getElementById('fClass').value;
    const status = document.getElementById('fStatus').value;
    const keyword = document.getElementById('fKeyword').value.trim();
    if (classId) params.set('classId', classId);
    if (status) params.set('statusCode', status);
    if (keyword) params.set('keyword', keyword);

    const res = await fetch('/api/enrollments?' + params);
    if (!res.ok) {
      document.getElementById('tbody').innerHTML =
        '<tr><td class="empty" colspan="8">목록 조회 실패 (' + res.status + ')</td></tr>';
      document.getElementById('pager').innerHTML = '';
      return;
    }
    const data = await res.json();
    renderTable(data.items);
    renderPager(data);
  }

  function renderTable(items) {
    const tbody = document.getElementById('tbody');
    if (!items || items.length === 0) {
      tbody.innerHTML = '<tr><td class="empty" colspan="8">조회 결과가 없습니다.</td></tr>';
      return;
    }
    tbody.innerHTML = items.map(e => `
      <tr>
        <td>${e.enrollmentId}</td>
        <td>${esc(e.studentName)}</td>
        <td>${esc(e.studentNo) || '-'}</td>
        <td>${esc(e.className)}</td>
        <td>${esc(e.subject) || '-'}</td>
        <td>${e.enrollDate} ~ ${e.endDate || ''}</td>
        <td><span class="chip st-${e.statusCode}">${STATUS_LABEL[e.statusCode] || e.statusCode}</span></td>
        <td>${e.statusCode === 'ACTIVE'
              ? `<span class="end-link" onclick="openEndModal(${e.enrollmentId}, '${esc(e.studentName)}', '${esc(e.className)}')">수강해제</span>`
              : ''}</td>
      </tr>`).join('');
  }

  function renderPager({ page, totalPages, totalCount }) {
    const pager = document.getElementById('pager');
    if (totalPages <= 0) { pager.innerHTML = ''; return; }
    let html = `<button ${page <= 1 ? 'disabled' : ''} onclick="loadEnrollments(${page - 1})">‹</button>`;
    const start = Math.max(1, page - 2), end = Math.min(totalPages, start + 4);
    for (let p = start; p <= end; p++) {
      html += `<button class="${p === page ? 'on' : ''}" onclick="loadEnrollments(${p})">${p}</button>`;
    }
    html += `<button ${page >= totalPages ? 'disabled' : ''} onclick="loadEnrollments(${page + 1})">›</button>`;
    html += `<span class="total">총 ${totalCount}건</span>`;
    pager.innerHTML = html;
  }

  /* ---------- 수강 등록 (ENR-01) ---------- */
  function openCreateModal() {
    document.getElementById('cEnrollDate').value = '';
    document.getElementById('cErr').textContent = '';
    openModalById('createModalBack');
  }

  async function saveCreate() {
    const studentId = document.getElementById('cStudent').value;
    const classId = document.getElementById('cClass').value;
    if (!studentId || !classId) {
      document.getElementById('cErr').textContent = '학생과 반을 선택하세요';
      return;
    }
    const body = {
      studentId: Number(studentId),
      classId: Number(classId),
      enrollDate: document.getElementById('cEnrollDate').value || null
    };
    const res = await writeFetch('/api/enrollments', 'POST', body);   // ENR-01
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      document.getElementById('cErr').textContent = err.message || '등록 실패 (' + res.status + ')';
      return;
    }
    closeModal('createModalBack');
    loadEnrollments(1);
  }

  /* ---------- 수강 해제 (ENR-02) ---------- */
  function openEndModal(enrollmentId, studentName, className) {
    endingEnrollmentId = enrollmentId;
    document.getElementById('endInfo').textContent =
      `${studentName} 학생의 [${className}] 수강을 종료합니다.`;
    document.getElementById('eEndDate').value = '';
    document.getElementById('eErr').textContent = '';
    openModalById('endModalBack');
  }

  async function saveEnd() {
    const body = { endDate: document.getElementById('eEndDate').value || null };
    const res = await writeFetch('/api/enrollments/' + endingEnrollmentId + '/end', 'PUT', body);  // ENR-02
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      document.getElementById('eErr').textContent = err.message || '해제 실패 (' + res.status + ')';
      return;
    }
    closeModal('endModalBack');
    loadEnrollments(currentPage);
  }

  /* ---------- 이벤트 바인딩 ---------- */
  document.getElementById('btnSearch').onclick = () => loadEnrollments(1);
  document.getElementById('btnReset').onclick = () => {
    fClass.value = ''; fStatus.value = ''; fKeyword.value = '';
    loadEnrollments(1);
  };
  document.getElementById('fKeyword').addEventListener('keydown',
    e => { if (e.key === 'Enter') loadEnrollments(1); });
  document.getElementById('fClass').onchange = () => loadEnrollments(1);
  document.getElementById('fStatus').onchange = () => loadEnrollments(1);
  document.getElementById('btnCreate').onclick = openCreateModal;
  document.getElementById('btnCreateSave').onclick = saveCreate;
  document.getElementById('btnEndSave').onclick = saveEnd;

  ['createModalBack', 'endModalBack'].forEach(id => {
    document.getElementById(id).addEventListener('click',
      e => { if (e.target.id === id) closeModal(id); });
  });

  loadClassOptions();
  loadStudentOptions();
  loadEnrollments(1);
</script>
</body>
</html>
