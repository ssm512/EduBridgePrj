<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8">
  <title>EduBridge · 반관리</title>
  <link rel="stylesheet" href="/css/common.css">
  <style>
    /* ===== 반관리 전용 스타일 (members.html과 동일 패턴) ===== */
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
    .toolbar select, .toolbar input {
      height: 36px; padding: 0 10px; border: 1px solid #d1d5db; border-radius: 6px;
      font-size: 14px; background: #fff;
    }
    .toolbar input[type="text"] { width: 220px; }
    .toolbar .spacer { flex: 1; }
    .btn {
      height: 36px; padding: 0 16px; border: none; border-radius: 6px;
      font-size: 14px; cursor: pointer; background: #1e3a8a; color: #fff;
    }
    .btn:hover { background: #1d4ed8; }
    .btn.secondary { background: #fff; color: #374151; border: 1px solid #d1d5db; }
    .btn.secondary:hover { background: #f3f4f6; }

    .table-wrap { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; overflow: hidden; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    thead th {
      text-align: left; background: #f9fafb; color: #6b7280; font-weight: 600;
      padding: 10px 14px; border-bottom: 1px solid #e5e7eb; font-size: 13px;
    }
    tbody td { padding: 10px 14px; border-bottom: 1px solid #f3f4f6; }
    tbody tr:hover { background: #f8faff; cursor: pointer; }
    tbody tr:last-child td { border-bottom: none; }
    .empty { text-align: center; color: #9ca3af; padding: 32px !important; cursor: default; }

    .chip { display: inline-block; font-size: 12px; padding: 2px 10px; border-radius: 999px; }
    .st-ACTIVE { background: #dcfce7; color: #166534; }
    .st-CLOSED { background: #f3f4f6; color: #6b7280; }
    .st-ENDED  { background: #f3f4f6; color: #6b7280; }

    .pager { display: flex; gap: 6px; justify-content: center; align-items: center; margin-top: 16px; }
    .pager button {
      min-width: 34px; height: 34px; border: 1px solid #d1d5db; background: #fff;
      border-radius: 6px; cursor: pointer; font-size: 13px;
    }
    .pager button.on { background: #1e3a8a; color: #fff; border-color: #1e3a8a; }
    .pager button:disabled { color: #d1d5db; cursor: default; }
    .pager .total { font-size: 13px; color: #6b7280; margin-left: 10px; }

    .modal-back {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4);
      align-items: center; justify-content: center; z-index: 50;
    }
    .modal-back.show { display: flex; }
    .modal {
      background: #fff; border-radius: 12px; width: 460px; max-width: calc(100vw - 40px);
      padding: 24px; max-height: calc(100vh - 60px); overflow-y: auto;
    }
    .modal h2 { margin: 0 0 18px; font-size: 17px; }
    .modal .row { margin-bottom: 12px; }
    .modal .row2 { display: flex; gap: 8px; }
    .modal .row2 .row { flex: 1; }
    .modal label { display: block; font-size: 13px; color: #6b7280; margin-bottom: 4px; }
    .modal input, .modal select {
      width: 100%; height: 38px; padding: 0 10px; border: 1px solid #d1d5db;
      border-radius: 6px; font-size: 14px;
    }
    .modal .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
    .modal .err { color: #dc2626; font-size: 13px; min-height: 18px; margin-top: 8px; }
    .modal .section-label {
      font-size: 12px; color: #9ca3af; letter-spacing: .04em;
      margin: 16px 0 8px; padding-top: 12px; border-top: 1px solid #f3f4f6;
    }
    .student-list { font-size: 13px; line-height: 1.9; }

    /* 요일 토글 (등록/수정 모달) */
    .days { display: flex; gap: 6px; flex-wrap: wrap; }
    .dtog {
      width: 34px; height: 34px; padding: 0; border: 1px solid #d1d5db; background: #fff;
      color: #6b7280; border-radius: 50%; cursor: pointer; font-size: 13px;
    }
    .dtog:hover { border-color: #1e3a8a; }
    .dtog.on { background: #1e3a8a; color: #fff; border-color: #1e3a8a; }
    .dtog.daily { width: auto; padding: 0 14px; border-radius: 999px; }
    /* 목록 요일 동그라미 */
    .dcirc {
      display: inline-flex; align-items: center; justify-content: center;
      width: 22px; height: 22px; border-radius: 50%; background: #e0e7ff; color: #3730a3;
      font-size: 11px; font-weight: 600; margin-right: 3px;
    }
    .daily-pill {
      display: inline-block; background: #dbeafe; color: #1e40af; font-size: 12px;
      padding: 2px 10px; border-radius: 999px; font-weight: 600;
    }
  </style>
</head>
<body>

<div th:replace="~{fragments/common :: topbar('반관리')}"></div>

<div class="shell">
  <nav class="sidebar">
    <a href="/admin/dashboard">대시보드</a>
    <a href="/admin/members">회원관리</a>
    <div class="group-label">반 / 수강</div>
    <a href="/admin/classes">반관리</a>
    <a href="/admin/enrollments">수강관리</a>
    <div class="group-label">학생</div>
    <a href="/admin/attendance">출석관리</a>
    <a href="/admin/fees">회비관리</a>
    <a href="/admin/grades">성적관리</a>
    <div class="group-label">소통</div>
    <a href="/admin/notices">공지관리</a>
    <a href="/admin/counseling">상담관리</a>
    <div class="group-label">운영</div>
    <a href="/admin/ai">AI 리포트</a>
    <a href="/admin/notifications">알림이력</a>
    <a href="/admin/logs">활동로그</a>
    <a href="/admin/settings">시스템설정</a>
  </nav>

  <main class="content">
    <h1>반관리</h1>
    <p class="sub">강의반을 등록·조회하고, 행을 클릭해 반 정보와 수강 학생을 확인·수정합니다. (CLS-01 ~ CLS-04)</p>

    <!-- 검색 툴바 : GET /classes 파라미터와 1:1 대응 -->
    <div class="toolbar">
      <select id="fStatus">
        <option value="">상태 전체</option>
        <option value="ACTIVE">운영중</option>
        <option value="CLOSED">종료</option>
      </select>
      <input type="text" id="fKeyword" placeholder="반이름 / 과목 / 강사명 검색">
      <button class="btn" id="btnSearch">검색</button>
      <button class="btn secondary" id="btnReset">초기화</button>
      <div class="spacer"></div>
      <button class="btn" id="btnCreate">+ 반 등록</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
        <tr>
          <th>ID</th><th>반 이름</th><th>과목</th><th>담당강사</th><th>강의실</th>
          <th>요일</th><th>수업시간</th><th>수강인원</th><th>상태</th>
        </tr>
        </thead>
        <tbody id="tbody">
        <tr><td class="empty" colspan="9">불러오는 중…</td></tr>
        </tbody>
      </table>
    </div>

    <div class="pager" id="pager"></div>
  </main>
</div>

<!-- 반 등록 모달 : POST /classes (CLS-01) -->
<div class="modal-back" id="createModalBack">
  <div class="modal">
    <h2>반 등록</h2>
    <div class="row"><label>반 이름 *</label><input id="cClassName" maxlength="100"></div>
    <div class="row2">
      <div class="row"><label>과목</label><input id="cSubject" maxlength="100"></div>
      <div class="row"><label>강의실</label><input id="cClassroom" maxlength="100"></div>
    </div>
    <div class="row"><label>담당 강사</label><select id="cTeacher"></select></div>
    <div class="row2">
      <div class="row"><label>시작 시간</label><input id="cStartTime" type="time"></div>
      <div class="row"><label>종료 시간</label><input id="cEndTime" type="time"></div>
    </div>
    <div class="row">
      <label>수업 요일 <span style="color:#9ca3af">(미선택/전체 = 매일)</span></label>
      <div class="days" id="cDays">
        <button type="button" class="dtog" data-d="MON" onclick="toggleDay('c','MON')">월</button>
        <button type="button" class="dtog" data-d="TUE" onclick="toggleDay('c','TUE')">화</button>
        <button type="button" class="dtog" data-d="WED" onclick="toggleDay('c','WED')">수</button>
        <button type="button" class="dtog" data-d="THU" onclick="toggleDay('c','THU')">목</button>
        <button type="button" class="dtog" data-d="FRI" onclick="toggleDay('c','FRI')">금</button>
        <button type="button" class="dtog" data-d="SAT" onclick="toggleDay('c','SAT')">토</button>
        <button type="button" class="dtog" data-d="SUN" onclick="toggleDay('c','SUN')">일</button>
        <button type="button" class="dtog daily" onclick="setEveryday('c')">매일</button>
      </div>
    </div>
    <div class="err" id="cErr"></div>
    <div class="actions">
      <button class="btn secondary" onclick="closeModal('createModalBack')">취소</button>
      <button class="btn" id="btnCreateSave">등록</button>
    </div>
  </div>
</div>

<!-- 반 상세/수정 모달 : GET /classes/{id} + PUT /classes/{id} (CLS-03, CLS-04) -->
<div class="modal-back" id="detailModalBack">
  <div class="modal" style="width: 540px;">
    <h2>반 상세</h2>
    <div class="row"><label>반 이름 *</label><input id="dClassName" maxlength="100"></div>
    <div class="row2">
      <div class="row"><label>과목</label><input id="dSubject" maxlength="100"></div>
      <div class="row"><label>강의실</label><input id="dClassroom" maxlength="100"></div>
    </div>
    <div class="row2">
      <div class="row"><label>담당 강사</label><select id="dTeacher"></select></div>
      <div class="row">
        <label>상태 *</label>
        <select id="dStatus">
          <option value="ACTIVE">운영중</option>
          <option value="CLOSED">종료</option>
        </select>
      </div>
    </div>
    <div class="row2">
      <div class="row"><label>시작 시간</label><input id="dStartTime" type="time"></div>
      <div class="row"><label>종료 시간</label><input id="dEndTime" type="time"></div>
    </div>
    <div class="row">
      <label>수업 요일 <span style="color:#9ca3af">(미선택/전체 = 매일)</span></label>
      <div class="days" id="dDays">
        <button type="button" class="dtog" data-d="MON" onclick="toggleDay('d','MON')">월</button>
        <button type="button" class="dtog" data-d="TUE" onclick="toggleDay('d','TUE')">화</button>
        <button type="button" class="dtog" data-d="WED" onclick="toggleDay('d','WED')">수</button>
        <button type="button" class="dtog" data-d="THU" onclick="toggleDay('d','THU')">목</button>
        <button type="button" class="dtog" data-d="FRI" onclick="toggleDay('d','FRI')">금</button>
        <button type="button" class="dtog" data-d="SAT" onclick="toggleDay('d','SAT')">토</button>
        <button type="button" class="dtog" data-d="SUN" onclick="toggleDay('d','SUN')">일</button>
        <button type="button" class="dtog daily" onclick="setEveryday('d')">매일</button>
      </div>
    </div>

    <div class="section-label">수강 학생</div>
    <div id="dStudents" class="student-list"></div>

    <div class="err" id="dErr"></div>
    <div class="actions">
      <button class="btn secondary" onclick="closeModal('detailModalBack')">취소</button>
      <button class="btn" id="btnDetailSave">저장</button>
    </div>
  </div>
</div>

<script th:replace="~{fragments/common :: logoutScript}"></script>
<script>
  /* ===== 반관리 화면 로직 =====
     - 목록: GET /classes?statusCode=&keyword=&page=&size=   (CLS-02)
     - 등록: POST /classes                                    (CLS-01)
     - 상세: 행 클릭 시 GET /classes/{classId}                (CLS-03, 수강 학생 포함)
     - 수정: 상세 모달 저장 시 PUT /classes/{classId}         (CLS-04)
     강사 선택은 GET /teachers 목록으로 드롭다운 구성 */

  const STATUS_LABEL = { ACTIVE: '운영중', CLOSED: '종료' };
  const ENROLL_LABEL = { ACTIVE: '수강중', ENDED: '종료' };
  const PAGE_SIZE = 10;

  let currentPage = 1;
  let editingClassId = null;
  let editingClassStatus = null;   // [추가] 상세 모달 열 때의 반 상태 (종료 전이 감지용)
  let editingActiveCount = 0;      // [추가] 수강중 학생 수 (종료 확인창 안내용)

  /* ---------- 공통 유틸 ---------- */
  function esc(s) {
    return s == null ? '' : String(s).replace(/[&<>"']/g,
      c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  }
  async function writeFetch(url, method, body) {
    if (!getCsrfCookie()) { await fetch('/api/auth/csrf'); }
    return fetch(url, {
      method,
      headers: { 'Content-Type': 'application/json', 'X-XSRF-TOKEN': getCsrfCookie() },
      body: JSON.stringify(body)
    });
  }
  function closeModal(id) { document.getElementById(id).classList.remove('show'); }
  function openModalById(id) { document.getElementById(id).classList.add('show'); }

  /* ---------- 수업 요일 (days_of_week) ---------- */
  const DAY_CODES = ['MON','TUE','WED','THU','FRI','SAT','SUN'];
  const DAY_KO = { MON:'월', TUE:'화', WED:'수', THU:'목', FRI:'금', SAT:'토', SUN:'일' };
  function dayBtn(prefix, code) {
    return document.querySelector(`#${prefix}Days .dtog[data-d="${code}"]`);
  }
  function syncDaily(prefix) {
    const all = DAY_CODES.every(c => dayBtn(prefix, c).classList.contains('on'));
    const daily = document.querySelector(`#${prefix}Days .daily`);
    if (daily) daily.classList.toggle('on', all);
  }
  function toggleDay(prefix, code) { dayBtn(prefix, code).classList.toggle('on'); syncDaily(prefix); }
  function setEveryday(prefix) { DAY_CODES.forEach(c => dayBtn(prefix, c).classList.add('on')); syncDaily(prefix); }
  // 선택 요일 → 저장값 (0개 또는 7개 = 매일 = null)
  function getDays(prefix) {
    const sel = DAY_CODES.filter(c => dayBtn(prefix, c).classList.contains('on'));
    return (sel.length === 0 || sel.length === 7) ? null : sel.join(',');
  }
  // 저장값 → 토글 상태 (빈값/null = 매일 = 전부 선택)
  function setDays(prefix, csv) {
    const set = new Set((csv || '').split(',').map(s => s.trim()).filter(Boolean));
    DAY_CODES.forEach(c => dayBtn(prefix, c).classList.toggle('on', set.size === 0 ? true : set.has(c)));
    syncDaily(prefix);
  }
  // 목록 표시: 매일 pill 또는 선택 요일 동그라미
  function dayBadges(csv) {
    const arr = (csv || '').split(',').map(s => s.trim()).filter(Boolean);
    if (arr.length === 0 || arr.length === 7) return '<span class="daily-pill">매일</span>';
    return DAY_CODES.filter(c => arr.includes(c)).map(c => `<span class="dcirc">${DAY_KO[c]}</span>`).join('');
  }

  /* ---------- 강사 드롭다운 (등록/수정 모달 공용) ---------- */
  async function loadTeacherOptions() {
    const res = await fetch('/api/teachers?page=1&size=100');
    if (!res.ok) return;
    const data = await res.json();
    const options = '<option value="">(미지정)</option>' +
      data.items.map(t => `<option value="${t.teacherId}">${esc(t.name)} (${esc(t.subject) || '-'})</option>`).join('');
    document.getElementById('cTeacher').innerHTML = options;
    document.getElementById('dTeacher').innerHTML = options;
  }

  /* ---------- 목록 조회 (CLS-02) ---------- */
  async function loadClasses(page = 1) {
    currentPage = page;
    const params = new URLSearchParams({ page, size: PAGE_SIZE });
    const status = document.getElementById('fStatus').value;
    const keyword = document.getElementById('fKeyword').value.trim();
    if (status) params.set('statusCode', status);
    if (keyword) params.set('keyword', keyword);

    const res = await fetch('/api/classes?' + params);
    if (!res.ok) {
      document.getElementById('tbody').innerHTML =
        '<tr><td class="empty" colspan="9">목록 조회 실패 (' + res.status + ')</td></tr>';
      document.getElementById('pager').innerHTML = '';
      return;
    }
    const data = await res.json();
    renderTable(data.items);
    renderPager(data);
  }

  function renderTable(items) {
    const tbody = document.getElementById('tbody');
    if (!items || items.length === 0) {
      tbody.innerHTML = '<tr><td class="empty" colspan="9">조회 결과가 없습니다.</td></tr>';
      return;
    }
    tbody.innerHTML = items.map(c => `
      <tr onclick="openDetailModal(${c.classId})">
        <td>${c.classId}</td>
        <td>${esc(c.className)}</td>
        <td>${esc(c.subject) || '-'}</td>
        <td>${esc(c.teacherName) || '-'}</td>
        <td>${esc(c.classroom) || '-'}</td>
        <td>${dayBadges(c.daysOfWeek)}</td>
        <td>${c.startTime || '-'} ~ ${c.endTime || '-'}</td>
        <td>${c.activeStudentCount}명</td>
        <td><span class="chip st-${c.statusCode}">${STATUS_LABEL[c.statusCode] || c.statusCode}</span></td>
      </tr>`).join('');
  }

  function renderPager({ page, totalPages, totalCount }) {
    const pager = document.getElementById('pager');
    if (totalPages <= 0) { pager.innerHTML = ''; return; }
    let html = `<button ${page <= 1 ? 'disabled' : ''} onclick="loadClasses(${page - 1})">‹</button>`;
    const start = Math.max(1, page - 2), end = Math.min(totalPages, start + 4);
    for (let p = start; p <= end; p++) {
      html += `<button class="${p === page ? 'on' : ''}" onclick="loadClasses(${p})">${p}</button>`;
    }
    html += `<button ${page >= totalPages ? 'disabled' : ''} onclick="loadClasses(${page + 1})">›</button>`;
    html += `<span class="total">총 ${totalCount}개 반</span>`;
    pager.innerHTML = html;
  }

  /* ---------- 반 등록 (CLS-01) ---------- */
  function openCreateModal() {
    ['cClassName','cSubject','cClassroom','cStartTime','cEndTime']
      .forEach(id => document.getElementById(id).value = '');
    document.getElementById('cTeacher').value = '';
    setDays('c', '');   // 신규 기본값: 매일
    document.getElementById('cErr').textContent = '';
    openModalById('createModalBack');
  }

  async function saveCreate() {
    const body = {
      className: document.getElementById('cClassName').value.trim(),
      teacherId: document.getElementById('cTeacher').value || null,
      subject: document.getElementById('cSubject').value.trim() || null,
      classroom: document.getElementById('cClassroom').value.trim() || null,
      startTime: document.getElementById('cStartTime').value || null,
      endTime: document.getElementById('cEndTime').value || null,
      daysOfWeek: getDays('c')
    };
    const res = await writeFetch('/api/classes', 'POST', body);
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      document.getElementById('cErr').textContent = err.message || '등록 실패 (' + res.status + ')';
      return;
    }
    closeModal('createModalBack');
    loadClasses(1);
  }

  /* ---------- 반 상세/수정 (CLS-03, CLS-04) ---------- */
  async function openDetailModal(classId) {
    const res = await fetch('/api/classes/' + classId);          // CLS-03
    if (!res.ok) { alert('상세 조회 실패 (' + res.status + ')'); return; }
    const d = await res.json();
    const c = d.classInfo;
    editingClassId = c.classId;
    // [추가] 반 종료 확인용: 열었을 때의 상태와 수강중 인원 기억
    editingClassStatus = c.statusCode;
    editingActiveCount = (d.students || []).filter(s => s.statusCode === 'ACTIVE').length;
    document.getElementById('dClassName').value = c.className || '';
    document.getElementById('dSubject').value = c.subject || '';
    document.getElementById('dClassroom').value = c.classroom || '';
    document.getElementById('dTeacher').value = c.teacherId || '';
    document.getElementById('dStatus').value = c.statusCode;
    document.getElementById('dStartTime').value = c.startTime || '';
    document.getElementById('dEndTime').value = c.endTime || '';
    setDays('d', c.daysOfWeek);

    document.getElementById('dStudents').innerHTML =
      (d.students && d.students.length)
        ? d.students.map(s =>
            `· ${esc(s.name)} (${esc(s.studentNo) || '-'}, ${esc(s.gradeLevel) || '-'}) ` +
            `${s.enrollDate} ~ ${s.endDate || ''} ` +
            `<span class="chip ${s.statusCode === 'ACTIVE' ? 'st-ACTIVE' : 'st-ENDED'}">` +
            `${ENROLL_LABEL[s.statusCode] || s.statusCode}</span>`).join('<br>')
        : '<span style="color:#9ca3af;">수강 중인 학생이 없습니다.</span>';

    document.getElementById('dErr').textContent = '';
    openModalById('detailModalBack');
  }

  async function saveDetail() {
    // [추가] ACTIVE→CLOSED로 바꾸면 수강중 학생도 일괄 종료됨을 안내 (서버에서 같은 트랜잭션으로 처리)
    const newStatus = document.getElementById('dStatus').value;
    if (editingClassStatus === 'ACTIVE' && newStatus === 'CLOSED') {
      const msg = editingActiveCount > 0
        ? `반을 종료하면 수강중인 학생 ${editingActiveCount}명의 수강도 함께 종료됩니다.\n(재개해도 수강은 복구되지 않습니다) 계속할까요?`
        : '반을 종료 상태로 변경합니다. 계속할까요?';
      if (!confirm(msg)) return;
    }
    const body = {
      className: document.getElementById('dClassName').value.trim(),
      teacherId: document.getElementById('dTeacher').value || null,
      subject: document.getElementById('dSubject').value.trim() || null,
      classroom: document.getElementById('dClassroom').value.trim() || null,
      startTime: document.getElementById('dStartTime').value || null,
      endTime: document.getElementById('dEndTime').value || null,
      statusCode: document.getElementById('dStatus').value,
      daysOfWeek: getDays('d')
    };
    const res = await writeFetch('/api/classes/' + editingClassId, 'PUT', body);  // CLS-04
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      document.getElementById('dErr').textContent = err.message || '수정 실패 (' + res.status + ')';
      return;
    }
    closeModal('detailModalBack');
    loadClasses(currentPage);
  }

  /* ---------- 이벤트 바인딩 ---------- */
  document.getElementById('btnSearch').onclick = () => loadClasses(1);
  document.getElementById('btnReset').onclick = () => {
    fStatus.value = ''; fKeyword.value = '';
    loadClasses(1);
  };
  document.getElementById('fKeyword').addEventListener('keydown',
    e => { if (e.key === 'Enter') loadClasses(1); });
  document.getElementById('btnCreate').onclick = openCreateModal;
  document.getElementById('btnCreateSave').onclick = saveCreate;
  document.getElementById('btnDetailSave').onclick = saveDetail;

  ['createModalBack', 'detailModalBack'].forEach(id => {
    document.getElementById(id).addEventListener('click',
      e => { if (e.target.id === id) closeModal(id); });
  });

  loadTeacherOptions();
  loadClasses(1);
</script>
</body>
</html>
