<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>AI 리포트</title>
    <link rel="stylesheet" href="/css/common.css">
    <style>
        .ai-layout { display: grid; gap: 16px; }
        .ai-grid {
            display: grid;
            grid-template-columns: minmax(360px, 460px) minmax(0, 1fr);
            gap: 16px;
            align-items: start;
        }
        .ai-grid.logs-view {
            display: block;
        }
        .ai-grid.logs-view .tool-panel {
            width: 100%;
        }
        .ai-grid.logs-view .result-panel {
            display: none;
        }
        .panel {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 18px;
        }
        .panel h2 {
            margin: 0 0 14px;
            font-size: 17px;
            color: #0f2a5f;
        }
        .tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 14px;
        }
        .tab-btn {
            border: 0;
            border-radius: 6px;
            padding: 8px 12px;
            background: #e5e7eb;
            color: #111827;
            cursor: pointer;
            font-weight: 700;
        }
        .tab-btn.active {
            background: #2563eb;
            color: #fff;
        }
        .form-row {
            display: grid;
            gap: 6px;
            margin-bottom: 12px;
        }
        .form-row label {
            font-size: 13px;
            font-weight: 700;
            color: #374151;
        }
        .form-row input,
        .form-row select,
        .form-row textarea {
            width: 100%;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            padding: 8px 10px;
            background: #fff;
        }
        .form-row textarea {
            min-height: 110px;
            resize: vertical;
        }
        .ai-btn {
            border: 0;
            border-radius: 6px;
            padding: 9px 13px;
            background: #2563eb;
            color: #fff;
            cursor: pointer;
            font-weight: 700;
        }
        .ai-btn.secondary {
            background: #e5e7eb;
            color: #111827;
        }
        .ai-btn:disabled {
            opacity: .55;
            cursor: wait;
        }
        .button-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .tone-options {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px;
        }
        .tone-btn {
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            padding: 8px 10px;
            background: #fff;
            color: #111827;
            cursor: pointer;
            font-weight: 700;
            text-align: left;
        }
        .tone-btn:hover {
            background: #eff6ff;
            border-color: #93c5fd;
            color: #1d4ed8;
        }
        .tone-btn.active {
            background: #2563eb;
            border-color: #2563eb;
            color: #fff;
        }
        .custom-tone-row {
            display: none;
            margin-top: 8px;
        }
        .custom-tone-row.show {
            display: block;
        }
        .select-row {
            display: grid;
            grid-template-columns: 130px minmax(0, 1fr);
            gap: 8px;
        }
        .suggest-picker {
            position: relative;
            display: flex;
        }
        .suggest-picker input {
            padding-right: 42px;
        }
        .suggest-toggle {
            width: 38px;
            margin-left: -38px;
            border: 0;
            border-left: 1px solid #cbd5e1;
            background: #f8fafc;
            border-radius: 0 6px 6px 0;
            cursor: pointer;
            color: #0f2a5f;
            font-weight: 700;
        }
        .suggest-menu {
            display: none;
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            right: 0;
            z-index: 15;
            max-height: 220px;
            overflow-y: auto;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            background: #fff;
            box-shadow: 0 12px 28px rgba(15, 23, 42, .16);
            padding: 6px;
        }
        .suggest-menu.show { display: block; }
        .suggest-menu button {
            width: 100%;
            border: 0;
            border-radius: 6px;
            background: transparent;
            padding: 8px 9px;
            text-align: left;
            cursor: pointer;
            color: #111827;
        }
        .suggest-menu button:hover,
        .suggest-menu button.active {
            background: #dbeafe;
            color: #1d4ed8;
        }
        .selected-note {
            margin: 6px 0 12px;
            color: #475569;
            font-size: 12px;
        }
        .output {
            min-height: 380px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 14px;
            background: #f8fafc;
            white-space: pre-wrap;
            line-height: 1.65;
            color: #111827;
            overflow: auto;
        }
        .output.success {
            color: #111827;
        }
        .output .result-heading {
            display: block;
            margin: 18px 0 6px;
            color: #0f2a5f;
            font-weight: 800;
        }
        .output .result-strong {
            color: #1d4ed8;
            font-weight: 800;
        }
        .output .result-log {
            display: block;
            margin-top: 18px;
            padding-top: 10px;
            border-top: 1px solid #e5e7eb;
            color: #64748b;
            font-size: 13px;
        }
        .output.error {
            color: #dc2626;
        }
        .output.loading {
            color: #b45309;
        }
        .tool-section { display: none; }
        .tool-section.active { display: block; }
        .log-toolbar {
            display: flex;
            gap: 10px;
            align-items: flex-end;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
        .log-toolbar .form-row {
            min-width: 160px;
            margin-bottom: 0;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        th, td {
            border-bottom: 1px solid #e5e7eb;
            padding: 9px 8px;
            text-align: left;
            vertical-align: middle;
        }
        th {
            background: #f8fafc;
            color: #0f2a5f;
            font-weight: 700;
        }
        .log-table {
            table-layout: fixed;
        }
        .log-table th,
        .log-table td {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .log-table tbody tr {
            cursor: pointer;
        }
        .log-table tbody tr:hover {
            background: #eff6ff;
        }
        .log-detail-row td {
            background: #f8fafc;
            border-bottom: 1px solid #cbd5e1;
            padding: 14px 16px;
        }
        .log-detail-box {
            color: #111827;
            line-height: 1.7;
            max-height: 360px;
            overflow-y: auto;
            padding: 14px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            background: #fff;
        }
        .log-detail-title {
            margin: 0 0 8px;
            color: #0f2a5f;
            font-weight: 800;
        }
        .log-detail-meta {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px;
            margin-bottom: 12px;
        }
        .log-meta-item {
            padding: 8px 10px;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            background: #f8fafc;
        }
        .log-meta-label {
            display: block;
            margin-bottom: 2px;
            color: #64748b;
            font-size: 12px;
            font-weight: 700;
        }
        .log-meta-value {
            color: #0f172a;
            font-weight: 800;
        }
        .log-status-success {
            color: #1d4ed8;
        }
        .log-status-fail {
            color: #dc2626;
        }
        .log-detail-content {
            white-space: pre-wrap;
            padding-top: 10px;
            border-top: 1px solid #e5e7eb;
        }
        .log-detail-content strong {
            color: #0f2a5f;
        }
        .log-id-col { width: 72px; }
        .log-date-col { width: 164px; }
        .log-user-col { width: 76px; }
        .log-feature-col { width: 112px; }
        .log-success-col { width: 58px; text-align: center; }
        .log-model-col { width: 150px; }
        .pagination {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-top: 12px;
        }
        .page-btn {
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            padding: 7px 10px;
            background: #fff;
            color: #0f2a5f;
            cursor: pointer;
            font-weight: 700;
        }
        .page-btn.active {
            background: #2563eb;
            border-color: #2563eb;
            color: #fff;
        }
        .page-btn:disabled {
            cursor: default;
            opacity: .45;
        }
        .empty {
            text-align: center;
            color: #64748b;
            padding: 24px 8px;
        }
        .status {
            display: none;
            position: fixed;
            right: 24px;
            bottom: 24px;
            max-width: 460px;
            z-index: 20;
            border: 1px solid #bfdbfe;
            border-left: 5px solid #2563eb;
            border-radius: 8px;
            background: #eff6ff;
            color: #1e3a8a;
            padding: 13px 15px;
            box-shadow: 0 10px 26px rgba(15, 23, 42, .14);
        }
        .status.show { display: block; }
        .status.error {
            border-color: #fecaca;
            border-left-color: #dc2626;
            background: #fff1f2;
            color: #991b1b;
        }
        @media (max-width: 1100px) {
            .ai-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div th:replace="~{fragments/common :: topbar('관리자')}"></div>
<div class="shell">
    <nav class="sidebar">
        <a href="/admin/dashboard">대시보드</a>
        <a href="/admin/members">회원관리</a>
        <div class="group-label">반 / 수강</div>
        <a href="/admin/classes">반관리</a>
        <a href="/admin/enrollments">수강관리</a>
        <div class="group-label">학생</div>
        <a href="/admin/attendance">출석관리</a>
        <a href="/admin/fees">회비관리</a>
        <a href="/admin/grades">성적관리</a>
        <div class="group-label">소통</div>
        <a href="/admin/notices">공지관리</a>
        <a href="/admin/counseling">상담관리</a>
        <div class="group-label">운영</div>
        <a href="/admin/ai">AI 리포트</a>
        <a href="/admin/notifications">알림이력</a>
        <a href="/admin/logs">활동로그</a>
        <a href="/admin/settings">시스템설정</a>
    </nav>

    <main class="content">
        <h1>AI 리포트</h1>
        <p class="sub">Gemini API를 사용해 리포트 초안, 상담 요약, 공지 초안을 생성합니다.</p>

        <div class="ai-layout">
            <section class="panel">
                <div class="tabs">
                    <button class="tab-btn active" data-tab="report" onclick="showTab('report')">학생 리포트</button>
                    <button class="tab-btn" data-tab="grade" onclick="showTab('grade')">성적 분석</button>
                    <button class="tab-btn" data-tab="counseling" onclick="showTab('counseling')">상담 요약</button>
                    <button class="tab-btn" data-tab="notice" onclick="showTab('notice')">공지 초안</button>
                    <button class="tab-btn" data-tab="logs" onclick="showTab('logs')">사용 로그</button>
                </div>
            </section>

            <div class="ai-grid">
                <section class="panel tool-panel">
                    <div id="reportSection" class="tool-section active">
                        <h2>학생 종합 리포트</h2>
                        <div class="form-row">
                            <label for="studentId">학생</label>
                            <select id="studentId"></select>
                        </div>
                        <div class="form-row">
                            <label for="targetMonth">조회 월</label>
                            <input id="targetMonth" type="month">
                        </div>
                        <div class="form-row">
                            <label for="teacherComment">추가 코멘트</label>
                            <textarea id="teacherComment" placeholder="리포트에 참고할 내용을 입력하세요"></textarea>
                        </div>
                        <button id="reportButton" class="ai-btn" onclick="generateMonthlyReport()">리포트 생성</button>
                    </div>

                    <div id="gradeSection" class="tool-section">
                        <h2>성적 분석</h2>
                        <div class="form-row">
                            <label>학생 검색</label>
                            <div class="select-row">
                                <select id="gradeStudentSearchCategory" onchange="handleGradeStudentSearchChange()">
                                    <option value="student">학생명</option>
                                    <option value="studentNo">학생번호</option>
                                    <option value="class">반</option>
                                </select>
                                <div class="suggest-picker">
                                    <input id="gradeStudentKeyword" placeholder="검색어 입력"
                                           autocomplete="off"
                                           oninput="handleGradeStudentKeywordInput()"
                                           onfocus="loadGradeSearchSuggestions(false)">
                                    <button type="button" class="suggest-toggle" onclick="toggleGradeSearchSuggestions()">▼</button>
                                    <div id="gradeSuggestionMenu" class="suggest-menu"></div>
                                </div>
                            </div>
                        </div>
                        <div class="form-row">
                            <label for="gradeStudentId">학생 선택</label>
                            <select id="gradeStudentId" onchange="loadGradeSubjects()"></select>
                        </div>
                        <div class="form-row">
                            <label for="gradeSubject">과목</label>
                            <select id="gradeSubject">
                                <option value="">전체 과목</option>
                            </select>
                        </div>
                        <div class="form-row">
                            <label for="gradeAnalysisFocus">추가 요청</label>
                            <textarea id="gradeAnalysisFocus" placeholder="예: 최근 하락 원인과 다음 지도 방향을 중심으로 분석"></textarea>
                        </div>
                        <button id="gradeButton" class="ai-btn" onclick="analyzeGrades()">성적 분석 생성</button>
                    </div>

                    <div id="counselingSection" class="tool-section">
                        <h2>상담 기록 요약</h2>
                        <div class="form-row">
                            <label>상담 기록 검색</label>
                            <div class="select-row">
                                <select id="counselingSearchCategory" onchange="handleCounselingCategoryChange()">
                                    <option value="">전체검색</option>
                                    <option value="student">학생명</option>
                                    <option value="parent">학부모명</option>
                                    <option value="teacher">강사명</option>
                                    <option value="class">반</option>
                                    <option value="content">상담내용</option>
                                </select>
                                <div class="suggest-picker">
                                    <input id="counselingSearchKeyword" placeholder="검색어 입력"
                                           autocomplete="off"
                                           oninput="handleCounselingKeywordInput()"
                                           onfocus="loadCounselingSuggestions(false)"
                                           onkeydown="handleCounselingSuggestionKeydown(event)">
                                    <button type="button" class="suggest-toggle" onclick="toggleCounselingSuggestions()">▼</button>
                                    <div id="counselingSuggestionMenu" class="suggest-menu"></div>
                                </div>
                            </div>
                        </div>
                        <div class="form-row">
                            <label for="counselingSelect">상담 기록 선택</label>
                            <select id="counselingSelect" onchange="updateSelectedCounselingNote()">
                                <option value="">상담 기록을 선택하세요</option>
                            </select>
                            <div id="selectedCounselingNote" class="selected-note">상담 기록을 선택하면 직접 입력보다 선택 기록을 우선 요약합니다.</div>
                        </div>
                        <div class="form-row">
                            <label for="counselingContent">직접 입력</label>
                            <textarea id="counselingContent" placeholder="상담 기록을 선택하지 않을 때만 직접 입력 내용으로 요약합니다"></textarea>
                        </div>
                        <button id="counselingButton" class="ai-btn" onclick="summarizeCounseling()">상담 요약</button>
                    </div>

                    <div id="noticeSection" class="tool-section">
                        <h2>공지사항 초안</h2>
                        <div class="form-row">
                            <label for="noticeTarget">공지 대상</label>
                            <select id="noticeTarget">
                                <option value="ALL">전체</option>
                                <option value="CLASS">반</option>
                                <option value="STUDENT">학생</option>
                                <option value="PARENT">학부모</option>
                                <option value="TEACHER">강사</option>
                            </select>
                        </div>
                        <div class="form-row">
                            <label>문체</label>
                            <div class="tone-options">
                                <button type="button" class="tone-btn active" data-tone="정중하고 간결하게" onclick="selectNoticeTone(this)">정중 간결</button>
                                <button type="button" class="tone-btn" data-tone="친근하고 이해하기 쉽게" onclick="selectNoticeTone(this)">친근 안내</button>
                                <button type="button" class="tone-btn" data-tone="중요한 내용을 먼저 강조하고 명확하게" onclick="selectNoticeTone(this)">중요 강조</button>
                                <button type="button" class="tone-btn" data-tone="행사 안내문처럼 밝고 참여를 유도하게" onclick="selectNoticeTone(this)">행사 안내</button>
                                <button type="button" class="tone-btn" data-tone="학부모에게 전달하는 공식 안내문처럼 신뢰감 있게" onclick="selectNoticeTone(this)">학부모 안내</button>
                                <button type="button" class="tone-btn" data-tone="CUSTOM" onclick="selectNoticeTone(this)">직접 입력</button>
                            </div>
                            <div id="customToneRow" class="custom-tone-row">
                                <input id="noticeToneCustom" placeholder="원하는 문체를 입력하세요">
                            </div>
                        </div>
                        <div class="form-row">
                            <label for="noticeKeywords">키워드</label>
                            <textarea id="noticeKeywords" placeholder="예: 7월 보강 일정, 준비물, 문의 안내"></textarea>
                        </div>
                        <button id="noticeButton" class="ai-btn" onclick="draftNotice()">공지 초안 생성</button>
                    </div>

                    <div id="logsSection" class="tool-section">
                        <h2>AI 사용 로그</h2>
                        <div class="log-toolbar">
                            <div class="form-row">
                                <label for="logFeature">기능</label>
                                <select id="logFeature">
                                    <option value="">전체</option>
                                    <option value="REPORT">REPORT</option>
                                    <option value="GRADE">GRADE</option>
                                    <option value="COUNSELING">COUNSELING</option>
                                    <option value="NOTICE">NOTICE</option>
                                </select>
                            </div>
                            <div class="form-row">
                                <label for="fromDate">시작일</label>
                                <input id="fromDate" type="date">
                            </div>
                            <div class="form-row">
                                <label for="toDate">종료일</label>
                                <input id="toDate" type="date">
                            </div>
                            <button class="ai-btn" onclick="loadLogs()">조회</button>
                        </div>
                        <table class="log-table">
                            <thead>
                            <tr>
                                <th class="log-id-col">로그ID</th>
                                <th class="log-date-col">일시</th>
                                <th class="log-user-col">요청자</th>
                                <th class="log-feature-col">기능</th>
                                <th class="log-success-col">성공</th>
                                <th class="log-model-col">모델</th>
                            </tr>
                            </thead>
                            <tbody id="logRows">
                            <tr><td class="empty" colspan="6">조회된 로그가 없습니다.</td></tr>
                            </tbody>
                        </table>
                        <div id="logPagination" class="pagination"></div>
                    </div>
                </section>

                <section class="panel result-panel">
                    <h2>생성 결과</h2>
                    <div class="button-row" style="margin-bottom: 10px;">
                        <button class="ai-btn secondary" onclick="copyOutput()">복사</button>
                        <button class="ai-btn secondary" onclick="clearOutput()">비우기</button>
                    </div>
                    <div id="output" class="output">AI 생성 결과가 여기에 표시됩니다.</div>
                </section>
            </div>
        </div>
    </main>
</div>

<div id="status" class="status"></div>
<script th:replace="~{fragments/common :: logoutScript}"></script>
<script>
    let counselingOptions = [];
    let counselingSuggestions = [];
    let counselingSuggestionIndex = -1;
    let counselingSearchTimer = null;
    let gradeStudentSearchTimer = null;
    let gradeSearchSuggestions = [];
    let aiLogs = [];
    let logCurrentPage = 1;
    let expandedLogId = null;
    let currentTab = 'report';
    const LOG_PAGE_SIZE = 15;
    const LOG_PAGE_WINDOW = 5;

    document.addEventListener('DOMContentLoaded', async () => {
        document.getElementById('targetMonth').value = new Date().toISOString().slice(0, 7);
        await loadStudents();
        await loadGradeStudents();
        await loadCounselingOptions();
        await loadLogs();
    });

    function getCsrfCookie() {
        const match = document.cookie.match(/(?:^|;\s*)XSRF-TOKEN=([^;]*)/);
        return match ? decodeURIComponent(match[1]) : null;
    }

    async function ensureCsrf() {
        if (!getCsrfCookie()) {
            await fetch('/api/auth/csrf');
        }
        return getCsrfCookie();
    }

    async function sendJson(url, body) {
        const response = await fetch(url, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-XSRF-TOKEN': await ensureCsrf()
            },
            body: JSON.stringify(body)
        });
        if (!response.ok) {
            throw await createHttpError(response);
        }
        return response.json();
    }

    async function fetchJson(url) {
        const response = await fetch(url, { headers: { 'Accept': 'application/json' } });
        if (!response.ok) {
            throw await createHttpError(response);
        }
        return response.json();
    }

        if (!counselingSuggestions.length) {

            return;
        }
        menu.innerHTML = counselingSuggestions.map((item, index) => `
            <button type="button"
                    class="${index === counselingSuggestionIndex && counselingSuggestionIndex >= 0 ? 'active' : ''}"
                    data-suggestion-index="${index}"
                    onmouseenter="clearCounselingSuggestionActive()"
                    onclick="selectCounselingSuggestion('${escapeJs(item.value || item.label || '')}')">${escapeHtml(item.label || item.value || '')}</button>
        `).join('');

    function handleCounselingSuggestionKeydown(event) {
        const menu = document.getElementById('counselingSuggestionMenu');
        if (!menu.classList.contains('show') || !counselingSuggestions.length) {
            if (event.key === 'ArrowDown') {
                event.preventDefault();
                loadCounselingSuggestions(false).then(() => {
                    counselingSuggestionIndex = counselingSuggestions.length ? 0 : -1;
                    renderCounselingSuggestions();
                    document.getElementById('counselingSuggestionMenu').classList.add('show');
                    scrollActiveSuggestionIntoView();
                });
            }
            return;
        }

        if (event.key === 'ArrowDown') {
            event.preventDefault();
            counselingSuggestionIndex = counselingSuggestionIndex < 0 ? 0 : (counselingSuggestionIndex + 1) % counselingSuggestions.length;
            renderCounselingSuggestions();
            scrollActiveSuggestionIntoView();
        } else if (event.key === 'ArrowUp') {
            event.preventDefault();
            counselingSuggestionIndex = counselingSuggestionIndex < 0 ? counselingSuggestions.length - 1 : (counselingSuggestionIndex - 1 + counselingSuggestions.length) % counselingSuggestions.length;
            renderCounselingSuggestions();
            scrollActiveSuggestionIntoView();
        } else if (event.key === 'Enter') {
            event.preventDefault();
            const selected = counselingSuggestions[counselingSuggestionIndex];
            if (selected) {
                selectCounselingSuggestion(selected.value || selected.label || '');
            }
        } else if (event.key === 'Escape') {
            menu.classList.remove('show');
        }
    }

        const params = new URLSearchParams();
        const feature = document.getElementById('logFeature')?.value;

        const toDate = document.getElementById('toDate')?.value;
        if (feature) params.append('featureCode', feature);

        if (toDate) params.append('toDate', toDate);

    function renderLogPage() {
        const tbody = document.getElementById('logRows');
        if (!aiLogs.length) {
            tbody.innerHTML = '<tr><td class="empty" colspan="6">조회된 로그가 없습니다.</td></tr>';
            document.getElementById('logPagination').innerHTML = '';
            return;
        }

        const start = (logCurrentPage - 1) * LOG_PAGE_SIZE;
        const rows = aiLogs.slice(start, start + LOG_PAGE_SIZE);
        tbody.innerHTML = rows.map(log => {
            const mainRow = `
                <tr onclick="toggleLogDetail(${log.ai_log_id})">
                    <td class="log-id-col">${log.ai_log_id}</td>
                    <td class="log-date-col" title="${escapeHtml(formatDateTime(log.created_at))}">${formatDateTime(log.created_at)}</td>
                    <td class="log-user-col" title="${escapeHtml(log.user_name || '')}">${escapeHtml(log.user_name || '')}</td>
                    <td class="log-feature-col" title="${escapeHtml(log.feature_code || '')}">${escapeHtml(log.feature_code || '')}</td>
                    <td class="log-success-col">${log.success_yn === 'Y' ? '성공' : '실패'}</td>
                    <td class="log-model-col" title="${escapeHtml(log.model_name || '')}">${escapeHtml(log.model_name || '')}</td>
                </tr>
            `;
            const detailRow = Number(expandedLogId) === Number(log.ai_log_id)
                ? `<tr class="log-detail-row"><td colspan="6">${formatLogDetailHtml(log)}</td></tr>`
                : '';
            return mainRow + detailRow;
        }).join('');
        renderLogPagination();
    }

    function renderLogPagination() {
        const totalPages = Math.max(1, Math.ceil(aiLogs.length / LOG_PAGE_SIZE));
        const half = Math.floor(LOG_PAGE_WINDOW / 2);
        let startPage = Math.max(1, logCurrentPage - half);
        let endPage = Math.min(totalPages, startPage + LOG_PAGE_WINDOW - 1);
        startPage = Math.max(1, endPage - LOG_PAGE_WINDOW + 1);

        const buttons = [];
        buttons.push(`<button type="button" class="page-btn" ${logCurrentPage === 1 ? 'disabled' : ''} onclick="moveLogPage(${logCurrentPage - 1})">이전</button>`);
        for (let page = startPage; page <= endPage; page++) {
            buttons.push(`<button type="button" class="page-btn ${page === logCurrentPage ? 'active' : ''}" onclick="moveLogPage(${page})">${page}</button>`);
        }
        buttons.push(`<button type="button" class="page-btn" ${logCurrentPage === totalPages ? 'disabled' : ''} onclick="moveLogPage(${logCurrentPage + 1})">다음</button>`);
        document.getElementById('logPagination').innerHTML = buttons.join('');
    }

    function moveLogPage(page) {
        const totalPages = Math.max(1, Math.ceil(aiLogs.length / LOG_PAGE_SIZE));
        logCurrentPage = Math.min(Math.max(1, page), totalPages);
        expandedLogId = null;
        renderLogPage();
    }

        return `
            <div class="log-detail-box ${isSuccess ? '' : 'error'}">
                <div class="log-detail-title">${title}</div>
                <div class="log-detail-meta">
                    ${logMetaItem('로그 ID', log.ai_log_id)}
                    ${logMetaItem('요청자', log.user_name || '-')}
                    ${logMetaItem('기능', log.feature_code || '-')}
                    ${logMetaItem('성공 여부', `<span class="${statusClass}">${statusText}</span>`, true)}
                    ${logMetaItem('모델', log.model_name || '-')}
                    ${logMetaItem('요청일시', formatDateTime(log.created_at))}
                </div>
                <div class="log-detail-content"><strong>${contentTitle}</strong>
${escapeHtml(contentText)}</div>

    function setOutput(text, mode = '') {
        const output = document.getElementById('output');
        output.className = mode ? `output ${mode}` : 'output';
        output.innerText = text;

    function setFormattedOutput(text, mode = '') {
        const output = document.getElementById('output');
        output.className = mode ? `output ${mode}` : 'output';
        output.innerHTML = formatAiResult(text);
    }

    function formatAiResult(text) {
        const escaped = escapeHtml(cleanAiResultText(text || ''));
        return escaped
            .replace(/^###\s*(.+)$/gm, '<span class="result-heading">$1</span>')
            .replace(/\*\*(.+?)\*\*/g, '<span class="result-strong">$1</span>')
            .replace(/^(로그 ID:\s*.+)$/gm, '<span class="result-log">$1</span>');
    }

    function cleanAiResultText(text) {
        return String(text || '')
            .replace(/\$\\rightarrow\$/g, '→')
            .replace(/\\rightarrow/g, '→')
            .replace(/\$/g, '')
            .replace(/\brank_total\s*=\s*(\d+)/g, '총 $1명')
            .replace(/\bscore\s*=\s*/g, '점수 ')
            .replace(/\bsubject\s*=\s*/g, '과목 ')
            .replace(/\brank_no\s*=\s*/g, '석차 ')
            .replace(/\btotal_score\s*=\s*/g, '총점 ')
            .replace(/\bexam_name\s*=\s*/g, '시험명 ')
            .replace(/\bexam_date\s*=\s*/g, '시험일 ')
            .replace(/\bclass_name\s*=\s*/g, '반 ');
    }

    function clearOutput() {
        setOutput('AI 생성 결과가 여기에 표시됩니다.');
    }

    async function copyOutput() {
        await navigator.clipboard.writeText(document.getElementById('output').innerText);
        setStatus('생성 결과를 복사했습니다.');
    }

    function setStatus(message, isError = false) {
        const status = document.getElementById('status');
        status.innerText = message;
        status.className = isError ? 'status error show' : 'status show';
        clearTimeout(status.dataset.timerId);
        status.dataset.timerId = setTimeout(() => {
            status.className = 'status';
            status.innerText = '';
        }, 3600);
    }

    function parseError(error) {
        const status = error?.status;
        const rawMessage = error?.message || String(error || '');
        const serverMessage = extractServerMessage(rawMessage);

        if (status === 400) {
            return serverMessage || '입력값이 부족하거나 형식이 맞지 않아 AI 요청에 실패했습니다. 선택한 학생, 조회 기간, 입력 내용을 다시 확인해 주세요.';
        }
        if (status === 401) {
            return '로그인 정보가 만료되어 AI 요청에 실패했습니다. 다시 로그인한 뒤 시도해 주세요.';
        }
        if (status === 403) {
            return '현재 계정에 AI 기능 사용 권한이 없어 요청에 실패했습니다.';
        }
        if (status === 404) {
            return serverMessage || '선택한 학생 또는 상담 기록을 찾을 수 없어 AI 요청에 실패했습니다.';
        }
        if (status === 502 || status === 503 || status === 504) {
            return 'Gemini API 연결 또는 응답 문제 때문에 AI 생성에 실패했습니다. API 키, 모델명, 사용량 한도, 네트워크 상태를 확인해 주세요.';
        }
        if (status >= 500) {
            return serverMessage || '서버 처리 중 문제가 발생해 AI 요청에 실패했습니다. 잠시 후 다시 시도해 주세요.';
        }

        return serverMessage || '알 수 없는 문제 때문에 AI 요청에 실패했습니다. 입력값과 네트워크 상태를 확인해 주세요.';
    }

    function extractServerMessage(message) {
        try {
            const parsed = JSON.parse(message);
            return cleanErrorMessage(parsed.message || parsed.error || parsed.detail || '');
        } catch (e) {
            return cleanErrorMessage(message);
        }
    }

    function cleanErrorMessage(message) {
        let text = String(message || '').trim();
        const quotedStatusMessage = text.match(/^\d{3}\s+[A-Z_]+\s+"([^"]+)"$/);
        if (quotedStatusMessage) {
            return quotedStatusMessage[1].trim();
        }

        text = text.replace(/^\d{3}\s+[A-Z_]+\s*/, '').replace(/^"|"$/g, '').trim();
        return /^(Bad Request|Unauthorized|Forbidden|Not Found|Internal Server Error)$/i.test(text) ? '' : text;
    }

    function formatDateTime(value) {
        if (!value) return '';
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return value;
        return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')} ${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}:${String(date.getSeconds()).padStart(2, '0')}`;
    }

    function formatDateOnly(value) {
        if (!value) return '';
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return value;
        return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
    }

    function escapeHtml(value) {
        return String(value ?? '').replace(/[&<>"']/g, ch => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;'
        })[ch]);
    }

    function escapeJs(value) {
        return String(value ?? '').replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/\n/g, ' ');
    }

    document.addEventListener('click', event => {
        if (!event.target.closest('.suggest-picker')) {
            document.getElementById('counselingSuggestionMenu')?.classList.remove('show');
            document.getElementById('gradeSuggestionMenu')?.classList.remove('show');
        }
    });
</script>
</body>
</html>
