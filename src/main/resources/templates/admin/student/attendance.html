<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8">
  <title>EduBridge · 출석관리</title>
  <link rel="stylesheet" href="/css/common.css">
  <style>
    .panel { background:#fff; border:1px solid #e5e7eb; border-radius:10px; padding:18px; margin-bottom:20px; }
    .panel h2 { margin:0 0 12px; font-size:16px; }
    .row { display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; }
    .row .f { display:flex; flex-direction:column; font-size:13px; gap:4px; }
    .row input, .row select { padding:7px 8px; border:1px solid #cbd5e1; border-radius:6px; }
    .btn { padding:8px 14px; border:0; border-radius:6px; background:#1e3a8a; color:#fff; cursor:pointer; }
    .btn.sub { background:#6b7280; } .btn.danger { background:#b91c1c; }
    .btn.sm { padding:5px 9px; font-size:12.5px; }
    table { width:100%; border-collapse:collapse; font-size:13.5px; }
    th, td { border-bottom:1px solid #eef2f7; padding:8px 10px; text-align:left; vertical-align:middle; }
    th { background:#f8fafc; color:#475569; }
    td select, td input { padding:4px 6px; border:1px solid #cbd5e1; border-radius:5px; font-size:12.5px; }
    .tag { padding:2px 8px; border-radius:999px; font-size:12px; }
    .PRESENT{background:#dcfce7;color:#166534;} .LATE{background:#fef9c3;color:#854d0e;}
    .ABSENT{background:#fee2e2;color:#991b1b;} .LEAVE{background:#e0e7ff;color:#3730a3;}
    .note { font-size:12.5px; color:#b45309; background:#fffbeb; border:1px solid #fde68a; padding:8px 10px; border-radius:6px; margin-bottom:8px; }
    #msg { font-size:13px; margin-top:8px; }
  </style>
</head>
<body>
<div th:replace="~{fragments/common :: topbar('출석관리')}"></div>

<div class="shell">
  <main class="content">
    <p class="sub"><a href="/adminPage" style="color:#1e3a8a;">← 관리자 홈</a></p>
    <h1>출석관리</h1>

    <!-- 반 출석부 (반 선택 → 명단 → 상태/시간 저장) -->
    <div class="panel">
      <h2>반 출석부</h2>
      <div class="row" style="margin-bottom:12px;">
        <div class="f" id="classPickWrap">
          <label>반</label>
          <select id="classSel"><option value="">불러오는 중…</option></select>
        </div>
        <div class="f"><label>날짜</label><input id="sheetDate" type="date"></div>
        <button class="btn" onclick="loadRoster()">명단 불러오기</button>
        <button class="btn sub" onclick="markAbsent()">결석 일괄 처리</button>
      </div>
      <div id="rosterNote"></div>
      <table>
        <thead><tr><th>학생</th><th>상태</th><th>입실</th><th>퇴실</th><th>저장</th></tr></thead>
        <tbody id="roster">
          <tr><td colspan="5" style="color:#9ca3af;">반을 고르고 명단을 불러오세요.</td></tr>
        </tbody>
      </table>
      <div id="msg"></div>
    </div>

    <!-- 출석 이력 -->
    <div class="panel">
      <h2>출석 이력</h2>
      <div class="row" style="margin-bottom:12px;">
        <div class="f"><label>학생ID</label><input id="q_studentId" type="number" placeholder="전체"></div>
        <div class="f"><label>반ID</label><input id="q_classId" type="number" placeholder="전체"></div>
        <button class="btn sub" onclick="loadHistory()">조회</button>
      </div>
      <table>
        <thead>
          <tr><th>학생</th><th>반</th><th>날짜</th><th>상태</th><th>유형</th><th>입실/퇴실 · 관리</th></tr>
        </thead>
        <tbody id="tbody">
          <tr><td colspan="6" style="color:#9ca3af;">조회를 눌러 이력을 불러오세요.</td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<script th:replace="~{fragments/common :: logoutScript}"></script>
<script th:inline="none">
  function csrf() {
    const m = document.cookie.match(/(?:^|;\s*)XSRF-TOKEN=([^;]*)/);
    return m ? decodeURIComponent(m[1]) : null;
  }
  async function ensureCsrf() { if (!csrf()) await fetch('/api/auth/csrf'); return csrf(); }
  const STATUSES = [['PRESENT','출석'],['LATE','지각'],['ABSENT','결석'],['LEAVE','조퇴']];

  // "yyyy-MM-dd HH:mm:ss" → datetime-local 값 "yyyy-MM-ddTHH:mm"
  function toInput(s) { return s ? s.replace(' ', 'T').slice(0,16) : ''; }
  function statusOptions(sel) {
    return STATUSES.map(([v,l]) => `<option value="${v}" ${v===sel?'selected':''}>${l}</option>`).join('');
  }

  // 반 목록 (신상민님 GET /api/classes 계약). 없으면 반ID 직접 입력 폴백.
  async function loadClasses() {
    try {
      const res = await fetch('/api/classes');
      if (!res.ok) throw new Error(res.status);
      const list = await res.json();
      document.getElementById('classSel').innerHTML =
        list.map(c => `<option value="${c.classId}">${c.className ?? ('반 '+c.classId)}</option>`).join('')
        || '<option value="">등록된 반 없음</option>';
    } catch (e) {
      document.getElementById('classPickWrap').innerHTML =
        '<label>반ID (임시 직접입력)</label><input id="classSel" type="number" placeholder="예: 1">';
      document.getElementById('rosterNote').innerHTML =
        '<div class="note">반 목록 API(신상민님, GET /api/classes)가 아직 없어 반ID를 직접 입력합니다.</div>';
    }
  }

  // 반 수강생 명단 (신상민님 GET /api/classes/{id}/students 계약)
  async function loadRoster() {
    const classId = document.getElementById('classSel').value;
    const tbody = document.getElementById('roster');
    if (!classId) { tbody.innerHTML = `<tr><td colspan="5">반을 먼저 선택/입력하세요.</td></tr>`; return; }
    try {
      const res = await fetch(`/api/classes/${classId}/students`);
      if (!res.ok) throw new Error(res.status);
      const students = await res.json();
      if (!students.length) { tbody.innerHTML = `<tr><td colspan="5" style="color:#9ca3af;">수강생 없음</td></tr>`; return; }
      tbody.innerHTML = students.map(s => rosterRow(s.studentId, s.studentName ?? '')).join('');
    } catch (e) {
      document.getElementById('rosterNote').innerHTML +=
        '<div class="note">수강 명단 API(신상민님, GET /api/classes/{id}/students)가 아직 없어, 학생ID를 직접 넣어 한 명씩 등록합니다.</div>';
      tbody.innerHTML = rosterRow('', '');
    }
  }

  function rosterRow(studentId, name) {
    const idCell = studentId !== '' ? `${name || ''} <span style="color:#9ca3af">(#${studentId})</span>`
                                    : `<input type="number" style="width:80px" placeholder="학생ID" class="rid">`;
    return `<tr>
      <td>${idCell}</td>
      <td><select class="rstatus">${statusOptions('PRESENT')}</select></td>
      <td><input type="datetime-local" class="rin"></td>
      <td><input type="datetime-local" class="rout"></td>
      <td><button class="btn sm" onclick="saveRow(this)">저장</button></td>
    </tr>`;
  }

  async function saveRow(btn) {
    const tr = btn.closest('tr');
    const idInput = tr.querySelector('.rid');
    const studentId = idInput ? Number(idInput.value)
                              : Number((tr.children[0].textContent.match(/#(\d+)/) || [])[1]);
    const classId = Number(document.getElementById('classSel').value);
    const status  = tr.querySelector('.rstatus').value;
    const date    = document.getElementById('sheetDate').value || null;
    const checkIn = tr.querySelector('.rin').value || null;
    const checkOut= tr.querySelector('.rout').value || null;
    const msg = document.getElementById('msg');
    if (!studentId || !classId) { msg.textContent='학생ID/반ID 확인'; msg.style.color='#b91c1c'; return; }
    const token = await ensureCsrf();
    const res = await fetch('/api/attendance/manual', {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'X-XSRF-TOKEN':token },
      body: JSON.stringify({ studentId, classId, attendanceDate: date, statusCode: status,
                             checkInAt: checkIn, checkOutAt: checkOut })
    });
    if (res.ok) { msg.textContent = `학생 ${studentId} 저장됨`; msg.style.color='#166534'; loadHistory(); }
    else { const d = await res.json().catch(()=>({})); msg.textContent = `저장 실패 (${res.status}): ${d.message||''}`; msg.style.color='#b91c1c'; }
  }

  // 결석 일괄 처리 (POST /api/attendance/mark-absent)
  async function markAbsent() {
    const classId = Number(document.getElementById('classSel').value);
    const date = document.getElementById('sheetDate').value || new Date().toISOString().slice(0, 10);
    const msg = document.getElementById('msg');
    if (!classId) { msg.textContent = '반을 먼저 선택/입력하세요.'; msg.style.color = '#b91c1c'; return; }
    if (!confirm(`이 반의 ${date} 미출석 학생을 모두 결석 처리할까요?`)) return;
    const token = await ensureCsrf();
    const res = await fetch('/api/attendance/mark-absent', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-XSRF-TOKEN': token },
      body: JSON.stringify({ classId, date })
    });
    if (res.ok) {
      const d = await res.json();
      msg.textContent = `결석 처리 완료: ${d.markedAbsent}명`; msg.style.color = '#166534';
      loadHistory();
    } else {
      const d = await res.json().catch(() => ({}));
      msg.textContent = `결석 처리 실패 (${res.status}): ${d.message || ''}`; msg.style.color = '#b91c1c';
    }
  }

  async function loadHistory() {
    const s = document.getElementById('q_studentId').value;
    const c = document.getElementById('q_classId').value;
    const qs = new URLSearchParams();
    if (s) qs.append('studentId', s);
    if (c) qs.append('classId', c);
    const res = await fetch('/api/attendance?' + qs.toString());
    const tbody = document.getElementById('tbody');
    if (!res.ok) { tbody.innerHTML = `<tr><td colspan="6">조회 실패 (${res.status})</td></tr>`; return; }
    const list = await res.json();
    if (!list.length) { tbody.innerHTML = `<tr><td colspan="6" style="color:#9ca3af;">기록 없음</td></tr>`; return; }
    tbody.innerHTML = list.map(a => `
      <tr>
        <td>${a.studentName ?? ('#'+(a.studentId ?? ''))}</td>
        <td>${a.className ?? ('#'+(a.classId ?? ''))}</td>
        <td>${a.attendanceDate ?? ''}</td>
        <td><span class="tag ${a.statusCode ?? ''}">${a.statusCode ?? ''}</span></td>
        <td>${a.checkType ?? ''}</td>
        <td>
          <select class="e-status">${statusOptions(a.statusCode)}</select>
          입실 <input type="datetime-local" class="e-in" value="${toInput(a.checkedAt)}">
          퇴실 <input type="datetime-local" class="e-out" value="${toInput(a.checkOutAt)}">
          <button class="btn sm" onclick="updateRow(this, ${a.attendanceId})">수정</button>
          <button class="btn sm danger" onclick="deleteRow(${a.attendanceId})">삭제</button>
        </td>
      </tr>`).join('');
  }

  // 상태·입실·퇴실 수정 (PUT /api/attendance/{id})
  async function updateRow(btn, id) {
    const tr = btn.closest('tr');
    const body = {
      statusCode: tr.querySelector('.e-status').value,
      checkInAt:  tr.querySelector('.e-in').value  || null,
      checkOutAt: tr.querySelector('.e-out').value || null
    };
    const token = await ensureCsrf();
    const res = await fetch(`/api/attendance/${id}`, {
      method:'PUT',
      headers:{ 'Content-Type':'application/json', 'X-XSRF-TOKEN':token },
      body: JSON.stringify(body)
    });
    if (res.ok) loadHistory(); else alert(`수정 실패 (${res.status})`);
  }

  async function deleteRow(id) {
    if (!confirm('이 출석기록을 삭제할까요?')) return;
    const token = await ensureCsrf();
    const res = await fetch(`/api/attendance/${id}`, { method:'DELETE', headers:{ 'X-XSRF-TOKEN':token } });
    if (res.ok || res.status === 204) loadHistory(); else alert(`삭제 실패 (${res.status})`);
  }

  loadClasses();
</script>
</body>
</html>
