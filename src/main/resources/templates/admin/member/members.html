<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8">
  <title>EduBridge · 회원관리</title>
  <link rel="stylesheet" href="/css/common.css">
  <style>
    /* ===== 회원관리 전용 스타일 ===== */
    .tabs { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 2px solid #e5e7eb; }
    .tabs button {
      padding: 10px 20px; border: none; background: none; font-size: 14px;
      color: #6b7280; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px;
    }
    .tabs button.on { color: #1e3a8a; font-weight: 600; border-bottom-color: #1e3a8a; }

    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
    .toolbar select, .toolbar input {
      height: 36px; padding: 0 10px; border: 1px solid #d1d5db; border-radius: 6px;
      font-size: 14px; background: #fff;
    }
    .toolbar input[type="text"] { width: 220px; }
    .toolbar .spacer { flex: 1; }
    .btn {
      height: 36px; padding: 0 16px; border: none; border-radius: 6px;
      font-size: 14px; cursor: pointer; background: #1e3a8a; color: #fff;
    }
    .btn:hover { background: #1d4ed8; }
    .btn.secondary { background: #fff; color: #374151; border: 1px solid #d1d5db; }
    .btn.secondary:hover { background: #f3f4f6; }

    .table-wrap { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; overflow: hidden; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    thead th {
      text-align: left; background: #f9fafb; color: #6b7280; font-weight: 600;
      padding: 10px 14px; border-bottom: 1px solid #e5e7eb; font-size: 13px;
    }
    tbody td { padding: 10px 14px; border-bottom: 1px solid #f3f4f6; }
    tbody tr:hover { background: #f8faff; cursor: pointer; }
    tbody tr:last-child td { border-bottom: none; }
    .empty { text-align: center; color: #9ca3af; padding: 32px !important; cursor: default; }

    .chip { display: inline-block; font-size: 12px; padding: 2px 10px; border-radius: 999px; }
    .role-ADMIN   { background: #ede9fe; color: #5b21b6; }
    .role-TEACHER { background: #dbeafe; color: #1e40af; }
    .role-STUDENT { background: #dcfce7; color: #166534; }
    .role-PARENT  { background: #ffedd5; color: #9a3412; }
    .st-ACTIVE    { background: #dcfce7; color: #166534; }
    .st-INACTIVE  { background: #f3f4f6; color: #6b7280; }
    .st-WITHDRAWN { background: #fee2e2; color: #991b1b; }

    .pager { display: flex; gap: 6px; justify-content: center; align-items: center; margin-top: 16px; }
    .pager button {
      min-width: 34px; height: 34px; border: 1px solid #d1d5db; background: #fff;
      border-radius: 6px; cursor: pointer; font-size: 13px;
    }
    .pager button.on { background: #1e3a8a; color: #fff; border-color: #1e3a8a; }
    .pager button:disabled { color: #d1d5db; cursor: default; }
    .pager .total { font-size: 13px; color: #6b7280; margin-left: 10px; }

    /* 모달 공통 */
    .modal-back {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4);
      align-items: center; justify-content: center; z-index: 50;
    }
    .modal-back.show { display: flex; }
    .modal {
      background: #fff; border-radius: 12px; width: 420px; max-width: calc(100vw - 40px);
      padding: 24px; max-height: calc(100vh - 60px); overflow-y: auto;
    }
    .modal h2 { margin: 0 0 18px; font-size: 17px; }
    .modal .row { margin-bottom: 12px; }
    .modal .row2 { display: flex; gap: 8px; }
    .modal .row2 .row { flex: 1; }
    .modal label { display: block; font-size: 13px; color: #6b7280; margin-bottom: 4px; }
    .modal input, .modal select {
      width: 100%; height: 38px; padding: 0 10px; border: 1px solid #d1d5db;
      border-radius: 6px; font-size: 14px;
    }
    .modal input[readonly] { background: #f3f4f6; color: #6b7280; }
    .modal .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
    .modal .err { color: #dc2626; font-size: 13px; min-height: 18px; margin-top: 8px; }
    .modal .section-label {
      font-size: 12px; color: #9ca3af; letter-spacing: .04em;
      margin: 16px 0 8px; padding-top: 12px; border-top: 1px solid #f3f4f6;
    }
  </style>
</head>

<script th:replace="~{fragments/common :: logoutScript}"></script>
<script>
  /* ===== 회원관리 화면 로직 =====
     [전체 회원 탭]
       - 목록: GET /api/users?roleCode=&statusCode=&keyword=&page=&size=  (USER-01)
       - 상세: 행 클릭 시 GET /api/users/{userId}                          (USER-02)
       - 수정: PUT /api/users/{userId}                                     (USER-03)
     [강사 탭]
       - 등록: POST /api/teachers                                          (TEA-01)
       - 목록: GET /api/teachers?keyword=&page=&size=                      (TEA-02)
       - 수정: PUT /api/teachers/{teacherId}                               (TEA-03)
     쓰기 요청(POST/PUT)은 X-XSRF-TOKEN 헤더 필요. 인증은 ACCESS_TOKEN 쿠키(JWT). */

  const ROLE_LABEL   = { ADMIN: '관리자', TEACHER: '강사', STUDENT: '학생', PARENT: '학부모' };
  const STATUS_LABEL = { ACTIVE: '활성', INACTIVE: '비활성', WITHDRAWN: '탈퇴' };
  const PAGE_SIZE = 10;

  let currentTab = 'user';      // 'user' | 'teacher'
  let currentPage = 1;
  let editingUserId = null;
  let editingTeacherId = null;
  let teacherCache = {};        // teacherId → 목록 행 데이터 (수정 모달 채우기용)

  /* ---------- 공통 유틸 ---------- */
  function esc(s) {
    return s == null ? '' : String(s).replace(/[&<>"']/g,
      c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  }
  async function writeFetch(url, method, body) {
    if (!getCsrfCookie()) { await fetch('/api/auth/csrf'); }   // CSRF 쿠키 확보
    return fetch(url, {
      method,
      headers: { 'Content-Type': 'application/json', 'X-XSRF-TOKEN': getCsrfCookie() },
      body: JSON.stringify(body)
    });
  }
  function closeModal(id) { document.getElementById(id).classList.remove('show'); }

  async function linkParentToStudent() {
    const relationCode = document.getElementById('sdLinkRelation').value;
    const primaryYn = document.getElementById('sdLinkPrimary').checked ? 'Y' : 'N';
    let res;

    if (editingStudentParentId) {
      // 수정 모드: PUT /api/students/{id}/parents/{studentParentId}
      res = await writeFetch(
        '/api/students/' + editingStudentId + '/parents/' + editingStudentParentId,
        'PUT', { relationCode, primaryYn });
    } else {
      // 신규 연결: POST /api/students/{id}/parents (PAR-03, 로그인ID로 지정)
      const parentLoginId = document.getElementById('sdLinkParentLoginId').value.trim();
      if (!parentLoginId) {
        document.getElementById('sdErr').textContent = '연결할 학부모의 로그인 ID를 입력하세요';
        return;
      }
      res = await writeFetch('/api/students/' + editingStudentId + '/parents',
        'POST', { parentLoginId, relationCode, primaryYn });
    }

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      document.getElementById('sdErr').textContent = err.message ||
        (editingStudentParentId ? '변경 실패 (' : '연결 실패 (') + res.status + ')';
      return;
    }
    openStudentDetailModal(editingStudentId);   // 보호자 목록 갱신 (resetLinkForm 포함)
  }

  /* ---------- 페이저 (양쪽 탭 공용) ---------- */
  function renderPager({ page, totalPages, totalCount }, fnName) {
    const pager = document.getElementById('pager');
    if (totalPages <= 0) { pager.innerHTML = ''; return; }
    let html = `<button ${page <= 1 ? 'disabled' : ''} onclick="${fnName}(${page - 1})">‹</button>`;
    const start = Math.max(1, page - 2), end = Math.min(totalPages, start + 4);
    for (let p = start; p <= end; p++) {
      html += `<button class="${p === page ? 'on' : ''}" onclick="${fnName}(${p})">${p}</button>`;
    }
    html += `<button ${page >= totalPages ? 'disabled' : ''} onclick="${fnName}(${page + 1})">›</button>`;
    html += `<span class="total">총 ${totalCount}명</span>`;
    pager.innerHTML = html;
  }

  document.getElementById('tKeyword').addEventListener('keydown',
    e => { if (e.key === 'Enter') loadTeachers(1); });
  document.getElementById('btnTCreate').onclick = openTeacherCreateModal;
  document.getElementById('btnTCreateSave').onclick = saveTeacherCreate;
  document.getElementById('btnTEditSave').onclick = saveTeacherEdit;

  document.getElementById('btnSSearch').onclick = () => loadStudents(1);
  document.getElementById('btnSReset').onclick = () => { sKeyword.value = ''; loadStudents(1); };
  document.getElementById('sKeyword').addEventListener('keydown',
    e => { if (e.key === 'Enter') loadStudents(1); });
  document.getElementById('btnSCreate').onclick = openStudentCreateModal;
  document.getElementById('btnSCreateSave').onclick = saveStudentCreate;
  document.getElementById('btnSDetailSave').onclick = saveStudentDetail;
  document.getElementById('btnSdLink').onclick = linkParentToStudent;
  document.getElementById('btnSdLinkCancel').onclick = resetLinkForm;

  document.getElementById('btnPSearch').onclick = () => loadParents(1);
  document.getElementById('btnPReset').onclick = () => { pKeyword.value = ''; loadParents(1); };
  document.getElementById('pKeyword').addEventListener('keydown',
    e => { if (e.key === 'Enter') loadParents(1); });
  document.getElementById('btnPCreate').onclick = openParentCreateModal;
  document.getElementById('btnPCreateSave').onclick = saveParentCreate;
  document.getElementById('btnPEditSave').onclick = saveParentEdit;

  ['userModalBack', 'tCreateModalBack', 'tEditModalBack',
   'sCreateModalBack', 'sDetailModalBack', 'pCreateModalBack', 'pEditModalBack'].forEach(id => {
    document.getElementById(id).addEventListener('click',
      e => { if (e.target.id === id) closeModal(id); });
  });

  loadUsers(1);
</script>
