<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>EduBridge 회원가입</title>
<style>
  body { font-family: sans-serif; max-width: 420px; margin: 40px auto; }
  h2 { text-align: center; }
  .field { margin-bottom: 12px; }
  label { display: block; margin-bottom: 4px; font-size: 14px; }
  input, select { width: 100%; padding: 8px; box-sizing: border-box; }
  button { width: 100%; padding: 10px; margin-top: 8px; cursor: pointer; }
  .link { text-align: center; margin-top: 12px; font-size: 14px; }
  .required { color: #d33; }
  .hint { display: block; margin-top: 4px; color: #777; font-size: 12px; }
  pre { background: #f4f4f4; padding: 12px; white-space: pre-wrap; word-break: break-all; }
</style>
</head>
<body>
<h2>회원가입</h2>

<div class="field">
  <label for="loginId">아이디</label>
  <input id="loginId" placeholder="아이디">
</div>
<div class="field">
  <label for="password">비밀번호</label>
  <input id="password" type="password" placeholder="비밀번호 (4자 이상)">
</div>
<div class="field">
  <label for="name">이름</label>
  <input id="name" placeholder="이름">
</div>
<div class="field">
  <label for="email">이메일 <span class="required">*</span></label>
  <input id="email" type="email" required placeholder="이메일">
  <small class="hint">비밀번호 재설정 등에 사용되므로 정확히 입력해 주세요.</small>
</div>
<div class="field">
  <label for="phone">연락처</label>
  <input id="phone" placeholder="연락처 (선택)">
</div>
<div class="field">
  <label for="roleCode">역할</label>
  <select id="roleCode" onchange="toggleRoleFields()">
    <option>STUDENT</option>
    <option>PARENT</option>
    <option>TEACHER</option>
  </select>
</div>

<!-- 역할별 추가 입력 (역할 선택에 따라 표시) -->
<div id="studentFields">
  <div class="field">
    <label for="schoolName">학교</label>
    <input id="schoolName" placeholder="학교명">
  </div>
  <div class="field">
    <label for="gradeLevel">학년</label>
    <input id="gradeLevel" placeholder="학년 (예: 중2)">
  </div>
</div>
<div id="parentFields" hidden>
  <div class="field">
    <label for="address">주소</label>
    <input id="address" placeholder="주소">
  </div>
</div>
<div id="teacherFields" hidden>
  <div class="field">
    <label for="subject">과목</label>
    <input id="subject" placeholder="담당 과목">
  </div>
  <small class="hint">강사 계정은 가입 후 관리자 승인(활성화)이 필요합니다.</small>
</div>

<button onclick="signup()">가입하기</button>
<div class="link"><a href="/">이미 계정이 있으신가요? 로그인</a></div>

<pre id="out" hidden></pre>

<script>
// 역할 선택에 따라 추가 입력창 표시
function toggleRoleFields() {
  const role = document.getElementById('roleCode').value;
  document.getElementById('studentFields').hidden = role !== 'STUDENT';
  document.getElementById('parentFields').hidden  = role !== 'PARENT';
  document.getElementById('teacherFields').hidden = role !== 'TEACHER';
}

// 쿠키에서 XSRF-TOKEN 값 읽기
function getCsrfCookie() {
  const m = document.cookie.match(/(?:^|;\s*)XSRF-TOKEN=([^;]*)/);
  return m ? decodeURIComponent(m[1]) : null;
}

// CSRF 쿠키가 없으면 발급받기
async function ensureCsrf() {
  if (!getCsrfCookie()) {
    await fetch('/api/auth/csrf');
  }
  return getCsrfCookie();
}

async function signup() {
  const val = id => document.getElementById(id).value.trim() || null;
  const role = document.getElementById('roleCode').value;

  if (!val('email')) {
    alert('이메일은 필수입니다. (비밀번호 재설정 등에 사용됩니다)');
    return;
  }

  // 가입하기 한 번으로 계정 + 역할별 추가 정보가 함께 처리된다
  const res = await fetch('/api/auth/signup', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'X-XSRF-TOKEN': await ensureCsrf()   // CSRF Double Submit
    },
    body: JSON.stringify({
      loginId: val('loginId'),
      password: document.getElementById('password').value,
      name: val('name'),
      email: val('email'),
      phone: val('phone'),
      roleCode: role,
      schoolName: role === 'STUDENT' ? val('schoolName') : null,
      gradeLevel: role === 'STUDENT' ? val('gradeLevel') : null,
      address:    role === 'PARENT'  ? val('address')    : null,
      subject:    role === 'TEACHER' ? val('subject')    : null
    })
  });
  const data = await res.json().catch(() => ({}));

  if (res.ok) {
      if (document.getElementById('roleCode').value == 'TEACHER') {
        alert('임시 등록 완료, 관리자에게 승인 요청 바랍니다. 로그인 페이지로 이동합니다.');
      } else {
        alert('회원가입이 완료되었습니다. 로그인 페이지로 이동합니다.');
      }
    location.href = '/loginForm.html';
    return;
  }
  const out = document.getElementById('out');
  out.hidden = false;
  out.textContent = JSON.stringify(data.message, null, 2);
}
</script>
</body>
</html>
