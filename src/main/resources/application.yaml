spring:
  application:
    name: EduBridgePrj

  web:
    resources:
      static-locations:
        - file:src/main/resources/static/
        - classpath:/static/
      cache:
        period: 0

  datasource:
    url: ${DB_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  flyway:
    enabled: true
    locations: classpath:db

  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY:DUMMY_KEY}
        chat:
          model: ${GEMINI_CHAT_MODEL:gemini-2.5-flash}
          temperature: 0.7

  servlet:
    multipart:
      enabled: true
      location: ${UPLOAD_PATH}
      max-file-size: 100MB
      max-request-size: 1000MB

  # [추가 2026-07-20] 메일 발송(SMTP) 설정 - app.mail.enabled=true일 때만 SmtpMailService가 사용
  # MAIL_* 환경변수가 비어 있어도(.env 미설정) 기본값(enabled=false)이라 개발 중엔 ConsoleMailService 그대로 동작
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.edu.domain
  configuration:
    map-underscore-to-camel-case: true

app:
  jwt:
    issuer: edubridge
    secret: ${JWT_SECRET}
    access-token-minutes: 30
    refresh-token-days: 7

  mail:
    # true로 바꾸고 위 spring.mail 값(MAIL_HOST 등)을 채우면 SmtpMailService가 ConsoleMailService를 대체한다
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@edubridge.local}

part1:
  upload-path: ${UPLOAD_PATH}
